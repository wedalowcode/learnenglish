<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>词库管理</title>
<link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div>
          <div class="crumb">资源中心<span class="sep">/</span>词库管理</div>
          <h1 class="page-title">词库管理</h1>
          <div class="page-sub">词库与单词是多对多关系 · 词库内单独保存单词排序</div>
        </div>
        <div class="page-actions">
          <a class="btn" href="import.html">批量导入</a>
          <button class="btn btn-primary" onclick="openForm()">+ 新增词库</button>
        </div>
      </div>

      <div class="card filter">
        <div class="field"><label>词库名称</label><input class="input" id="kw" placeholder="输入名称" oninput="render()"></div>
        <div class="field"><label>教材版本</label>
          <select class="select" id="bk" onchange="render()"><option value="">全部</option><option>人教版</option><option>外研版</option></select></div>
        <div class="field"><label>年级</label>
          <select class="select" id="gr" onchange="render()"><option value="">全部</option>
            <option>三年级</option><option>五年级</option><option>六年级</option><option>七年级</option><option>八年级</option><option>九年级</option></select></div>
        <div class="field"><label>学期</label>
          <select class="select" onchange="render()"><option value="">全部</option><option>上学期</option><option>下学期</option></select></div>
        <div class="field"><label>状态</label>
          <select class="select" id="st" onchange="render()"><option value="">全部</option><option>启用</option><option>停用</option></select></div>
        <div class="filter-actions"><button class="btn btn-primary" onclick="render()">查询</button>
          <button class="btn" onclick="reset()">重置</button></div>
      </div>

      <div class="card mt16">
        <div class="card-head"><div class="card-title">词库列表<span class="hint" id="cnt"></span></div>
          <span class="small muted">基础单词复用，学员学习状态独立记录</span></div>
        <div class="card-body tight">
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th style="width:74px">编号</th><th>词库名称</th><th>教材版本</th><th>年级</th><th>学期</th>
                <th>单元</th><th class="right">单词数量</th><th>创建时间</th><th>状态</th><th style="width:190px">操作</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div class="pager"><span>共 <b id="total">6</b> 条</span>
            <div class="pages"><button class="pg" disabled>‹</button><button class="pg on">1</button><button class="pg" disabled>›</button></div>
          </div>
        </div>
      </div>

      <div class="alert alert-info mt16"><span class="ico">i</span>
        <div>同一个单词可以出现在不同教材版本、年级、学期或单元的多个词库中，但<b>基础单词信息尽量复用</b>；学员对该单词的学习状态独立记录，不随词库共用。</div>
      </div>

    </main>
  </div>
</div>

<div class="mask" id="formModal">
  <div class="modal wide">
    <div class="modal-head"><div class="modal-title" id="ftitle">新增词库</div>
      <button class="modal-close" onclick="Proto.closeModal('formModal')">×</button></div>
    <div class="modal-body">
      <div class="form-grid g3">
        <div class="field full"><label>词库名称 <span class="req">*</span></label>
          <input class="input" placeholder="如 人教版 七年级上 Unit 1 词汇"></div>
        <div class="field"><label>教材版本 <span class="req">*</span></label>
          <select class="select"><option>人教版</option><option>外研版</option><option>其他版本</option></select></div>
        <div class="field"><label>年级 <span class="req">*</span></label>
          <select class="select"><option>三年级</option><option>四年级</option><option>五年级</option>
            <option>六年级</option><option>七年级</option><option>八年级</option><option>九年级</option></select></div>
        <div class="field"><label>学期 <span class="req">*</span></label>
          <select class="select"><option>上学期</option><option>下学期</option></select></div>
        <div class="field"><label>单元</label>
          <select class="select"><option>Unit 1</option><option>Unit 2</option><option>Unit 3</option><option>Unit 4</option></select></div>
        <div class="field"><label>状态</label>
          <select class="select"><option>启用</option><option>停用</option></select></div>
        <div class="field"><label>排序</label><input class="input" type="number" value="10"></div>
        <div class="field full"><label>说明</label><textarea class="textarea" placeholder="选填"></textarea></div>
      </div>
      <div class="alert alert-info mt16"><span class="ico">i</span>
        <div>创建空词库后，可在词库详情中逐个添加单词，或使用 Excel 批量导入。</div></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="Proto.closeModal('formModal')">取消</button>
      <button class="btn btn-primary" onclick="Proto.closeModal('formModal');Proto.toast('词库已创建','ok')">保存</button>
    </div>
  </div>
</div>

<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script>
Proto.shell({ role: 'admin', active: 'wordbook-list' });

function render() {
  const kw = document.getElementById('kw').value.trim();
  const bk = document.getElementById('bk').value;
  const gr = document.getElementById('gr').value;
  const st = document.getElementById('st').value;
  const rows = DB.books.filter(b => {
    if (kw && !b.name.includes(kw)) return false;
    if (bk && b.book !== bk) return false;
    if (gr && b.grade !== gr) return false;
    if (st && b.status !== st) return false;
    return true;
  });
  document.getElementById('cnt').textContent = `筛选结果 ${rows.length} 条`;
  document.getElementById('total').textContent = rows.length;

  Proto.renderRows('rows', rows, b => `
    <tr>
      <td class="mono small">${b.id}</td>
      <td class="strong"><a href="wordbook-detail.html">${b.name}</a></td>
      <td>${b.book}</td>
      <td>${b.grade}</td>
      <td>${b.term}</td>
      <td>${b.unit}</td>
      <td class="right mono">${b.count}</td>
      <td class="small muted">${b.created}</td>
      <td>${b.status === '启用' ? '<span class="tag tag-green">启用</span>' : '<span class="tag tag-slate">停用</span>'}</td>
      <td class="ops">
        <a class="btn-link" href="wordbook-detail.html">详情</a>
        <button class="btn-link" onclick="openForm('${b.name}')">编辑</button>
        <a class="btn-link" href="import.html">导入</a>
        <button class="btn-link ${b.status === '启用' ? 'danger' : ''}"
          onclick="toggle('${b.name}','${b.status}')">${b.status === '启用' ? '停用' : '启用'}</button>
      </td>
    </tr>`, 10, '没有符合条件的词库');
}

function reset() {
  document.getElementById('kw').value = '';
  ['bk', 'gr', 'st'].forEach(id => document.getElementById(id).value = '');
  render();
}

function openForm(name) {
  document.getElementById('ftitle').textContent = name ? '编辑词库 · ' + name : '新增词库';
  Proto.openModal('formModal');
}

function toggle(name, status) {
  if (status === '启用') {
    Proto.confirmBox('停用词库', `停用 <b>${name}</b> 后，教师将无法在训练中选择该词库。<br><br>
      学员已有的训练记录与复习任务<b>不受影响</b>。`, '确认停用', () => Proto.toast('词库已停用', 'ok'));
  } else {
    Proto.toast('词库已启用', 'ok');
  }
}

render();
</script>
</body>
</html>
