<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>佣金记录</title>
<link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div>
          <div class="crumb">佣金管理<span class="sep">/</span>佣金记录</div>
          <h1 class="page-title">佣金记录</h1>
          <div class="page-sub" id="sub">—</div>
        </div>
        <div class="page-actions">
          <button class="btn" onclick="Proto.toast('导出为示意，完整结算下一轮实现','warn')">导出</button>
        </div>
      </div>

      <div class="grid g4 mb16" id="stats"></div>

      <div class="alert alert-warn mb16"><span class="ico">!</span>
        <div><b>本轮只做佣金预估，不做完整结算：</b>比例或固定金额、确认时点、退款冲回、结算周期均列为待业务确认。
          下方金额按代理档案中的规则计算，<b>不作为结算依据</b>；完整结算接口（应结 / 已结 / 打款 / 冲正）已预留。</div></div>

      <div class="card">
        <div class="card-body tight">
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th style="width:128px">订单编号</th><th>学员</th><th>课程商品</th>
                <th class="right">订单金额</th><th>订单状态</th><th>课时入账</th>
                <th class="right">佣金预估</th><th>结算状态</th><th>时间</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="card mt16">
        <div class="card-head"><div class="card-title">佣金规则说明</div>
          <span class="tag tag-amber nodot">规则待业务确认</span></div>
        <div class="card-body" style="font-size:12.5px;color:var(--text-2);line-height:1.9">
          当前展示规则来自代理档案（<b id="ruleText" style="color:var(--text)">—</b>）。<br>
          <b style="color:var(--text)">预估</b> = 已收款入账订单金额 × 比例，或固定金额 × 已入账订单数；
          <b style="color:var(--text)">未结算</b> 表示本轮不做打款与冲正记录，仅保留预估字段。
        </div>
      </div>

    </main>
  </div>
</div>

<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script>
const S = Store;
const AG = Proto.agentId();
S.setSession({ role: 'agent', agentId: AG, operatorName: Proto.agentName() });
Proto.shell({ role: 'agent', active: 'agent-commission' });

const cm = S.agentCommissionPreview(AG) || {};
document.getElementById('sub').textContent =
  `${Proto.agentName()} · 规则 ${cm.ruleText || '—'} · 确认时点与结算周期待业务确认`;
document.getElementById('ruleText').textContent = cm.ruleText || '—';

document.getElementById('stats').innerHTML = `
  <div class="card stat"><div class="stat-label">已入账成交金额</div><div class="stat-value">${Proto.money(cm.creditedAmount || 0)}</div>
    <div class="stat-foot">${cm.creditedOrders || 0} 笔已收款订单</div></div>
  <div class="card stat"><div class="stat-label">佣金预估</div><div class="stat-value" style="color:var(--warning)">${Proto.money(cm.estimatedCommission || 0)}</div>
    <div class="stat-foot">按当前规则估算</div></div>
  <div class="card stat"><div class="stat-label">已结算佣金</div><div class="stat-value" style="color:var(--text-3)">未结算</div>
    <div class="stat-foot">完整结算不在本轮范围</div></div>
  <div class="card stat"><div class="stat-label">结算状态</div><div class="stat-value" style="font-size:20px">${cm.settlementStatus || '未结算'}</div>
    <div class="stat-foot">接口已预留</div></div>`;

const rows = S.orderRows({ agentId: AG });
Proto.renderRows('rows', rows, r => {
  const o = r.order;
  return `<tr>
    <td class="mono small">${o.id}</td>
    <td class="strong">${r.studentName}</td>
    <td class="small">${o.productName}</td>
    <td class="right mono">${Proto.money(o.amount)}</td>
    <td><span class="tag tag-${S.ORDER_TONE[o.status] || 'slate'}">${o.status}</span></td>
    <td class="small muted">${o.status === S.ORDER.CREDITED ? o.totalHours + ' 课时' : '未入账'}</td>
    <td class="right mono strong">${o.status === S.ORDER.CREDITED ? Proto.money(cm.estimatedCommission / Math.max(1, cm.creditedOrders)) : '—'}</td>
    <td><span class="tag tag-slate">${cm.settlementStatus || '未结算'}</span></td>
    <td class="small muted">${o.creditedAt || o.createdAt}</td>
  </tr>`;
}, 9, '暂无订单');
</script>
</body>
</html>
