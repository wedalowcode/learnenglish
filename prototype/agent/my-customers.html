<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的客户</title>
<link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div>
          <div class="crumb">客户管理<span class="sep">/</span>我的客户</div>
          <h1 class="page-title">我的客户</h1>
          <div class="page-sub" id="sub">仅显示本人报备或归属本人的客户</div>
        </div>
        <div class="page-actions">
          <input class="input" id="kw" placeholder="搜索姓名 / 手机号" style="width:180px" oninput="render()">
          <a class="btn btn-primary" href="customer-create.html">+ 客户报备</a>
        </div>
      </div>

      <div class="card">
        <div class="card-body tight">
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th style="width:88px">线索编号</th><th>客户</th><th>联系电话</th><th>学生年级</th>
                <th>意向课程</th><th>来源</th><th>状态</th><th>剩余课时</th><th>最近跟进</th><th>下次跟进</th>
                <th style="width:150px">操作</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div class="pager"><span>共 <b id="total">0</b> 条</span></div>
        </div>
      </div>

      <div class="alert alert-warn mt16"><span class="ico">!</span>
        <div>代理<b>不得查看其他代理的客户和订单</b>。客户归属冲突（如重复报备）由机构管理员处理，不以最后报备者判定归属。</div>
      </div>

    </main>
  </div>
</div>

<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script>
const S = Store;
const AG = Proto.agentId();
S.setSession({ role: 'agent', agentId: AG, operatorName: Proto.agentName() });
Proto.shell({ role: 'agent', active: 'agent-customers' });

function render() {
  const kw = document.getElementById('kw').value.trim();
  const rows = S.agentCustomers({ kw: kw });
  document.getElementById('total').textContent = rows.length;
  document.getElementById('sub').textContent =
    `仅显示本人报备或归属本人的客户 · 共 ${rows.length} 人`;
  Proto.renderRows('rows', rows, r => {
    const overdue = r.nextFollowAt && r.nextFollowAt.slice(0, 10) <= S.TODAY;
    return `<tr>
      <td class="mono small">${r.leadId || '—'}</td>
      <td class="strong"><a href="customer-detail.html?id=${r.leadId}">${r.customerName}</a></td>
      <td class="mono">${r.phone || '—'}</td>
      <td>${r.grade || '—'}</td>
      <td class="small">${r.intent || '—'}</td>
      <td class="small">${r.channel || '—'}</td>
      <td><span class="tag tag-${S.LEAD_TONE[r.status] || 'slate'}">${r.status}</span></td>
      <td class="mono">${r.remain === null ? '<span class="muted">—</span>' : r.remain}</td>
      <td class="small muted">${(r.lastFollowAt || '—').slice(5, 16)}</td>
      <td class="small" ${overdue ? 'style="color:var(--danger)"' : ''}>${r.nextFollowAt ? r.nextFollowAt.slice(0, 10) : '—'}</td>
      <td class="ops">
        <a class="btn-link" href="customer-detail.html?id=${r.leadId}">详情</a>
        <a class="btn-link" href="customer-detail.html?id=${r.leadId}">跟进</a>
        ${r.converted ? `<a class="btn-link" href="customer-detail.html?id=${r.leadId}#feedback">反馈</a>` : ''}
      </td>
    </tr>`;
  }, 11, '没有匹配的客户');
}
render();
</script>
</body>
</html>
