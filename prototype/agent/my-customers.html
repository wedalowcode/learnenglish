<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的客户</title>
<link rel="stylesheet" href="../assets/css/common.css">
<style>
  .row-overdue td { background:#fff5f5; }
  .tag-odds { font-size:11px; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div>
          <div class="crumb">客户管理<span class="sep">/</span>我的客户</div>
          <h1 class="page-title">我的客户</h1>
          <div class="page-sub" id="sub">仅显示本人报备或归属本人的客户</div>
        </div>
        <div class="page-actions">
          <input class="input" id="kw" placeholder="搜索姓名 / 手机号" style="width:180px" oninput="render()">
          <a class="btn btn-primary" href="customer-create.html">+ 客户报备</a>
        </div>
      </div>

      <div class="card filter">
        <div class="field"><label>状态</label>
          <select class="select" id="f_status" onchange="render()"><option value="">全部</option></select></div>
        <div class="field"><label>意向等级</label>
          <select class="select" id="f_level" onchange="render()"><option value="">全部</option></select></div>
        <div class="field"><label>跟进节奏</label>
          <select class="select" id="f_due" onchange="render()">
            <option value="">全部</option><option value="overdue">逾期未跟进</option><option value="today">今日待跟</option>
          </select></div>
        <div class="field"><label>来源渠道</label>
          <select class="select" id="f_channel" onchange="render()"><option value="">全部</option></select></div>
        <div class="field"><label>订单</label>
          <select class="select" id="f_order" onchange="render()">
            <option value="">不限</option><option value="has">有订单</option><option value="none">无订单</option>
          </select></div>
        <div class="filter-actions"><button class="btn" onclick="resetFilter()">重置</button></div>
      </div>

      <div class="card mt16">
        <div class="card-body tight">
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th style="width:88px">线索编号</th><th>客户</th><th>联系电话</th><th>学生年级</th>
                <th>意向课程</th><th>等级</th><th>来源</th><th>状态</th><th class="right">剩余课时</th>
                <th>最近跟进</th><th>下次跟进</th><th style="width:190px">操作</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div class="pager"><span>共 <b id="total">0</b> 条</span></div>
        </div>
      </div>

      <div class="alert alert-warn mt16"><span class="ico">!</span>
        <div>代理<b>不得查看其他代理的客户和订单</b>。客户归属冲突（如重复报备）由机构管理员处理，不以最后报备者判定归属。</div>
      </div>

    </main>
  </div>
</div>

<!-- 快速记录跟进 -->
<div class="mask" id="quickModal">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">快速记录跟进</div>
      <button class="modal-close" onclick="Proto.closeModal('quickModal')">×</button></div>
    <div class="modal-body">
      <div class="desc g1 mb12" id="q_info"></div>
      <div class="form-grid">
        <div class="field"><label>跟进方式</label>
          <select class="select" id="q_type"><option>电话</option><option>微信</option><option>面谈</option><option>其他</option></select></div>
        <div class="field"><label>下次跟进时间</label>
          <input class="input" type="date" id="q_next"></div>
        <div class="field full"><label>沟通内容 <span class="req">*</span></label>
          <textarea class="textarea" id="q_content" placeholder="记录客户诉求与你的回复"></textarea></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="Proto.closeModal('quickModal')">取消</button>
      <button class="btn btn-primary" onclick="saveQuick()">保存跟进</button>
    </div>
  </div>
</div>

<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script>
const S = Store;
const AG = Proto.agentId();
S.setSession({ role: 'agent', agentId: AG, operatorName: Proto.agentName() });
Proto.shell({ role: 'agent', active: 'agent-customers' });

const TERMINAL = [S.LEAD.DEAL, S.LEAD.INVALID, S.LEAD.CLOSED];
let quickLead = '';
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function d10(t) { return String(t || '').slice(0, 10); }

/* 筛选下拉初始化（来自数据字典/枚举，不在页面写死） */
(function initFilters() {
  const st = document.getElementById('f_status');
  st.innerHTML = '<option value="">全部</option>' + (S.LEAD_STATUS || []).map(x => `<option>${esc(x)}</option>`).join('');
  const lv = document.getElementById('f_level');
  lv.innerHTML = '<option value="">全部</option>' + (S.LEAD_LEVELS || []).map(x => `<option>${esc(x)}</option>`).join('');
  const ch = document.getElementById('f_channel');
  ch.innerHTML = '<option value="">全部</option>' + (S.LEAD_CHANNELS || []).map(x => `<option>${esc(x)}</option>`).join('');
  /* 工作台入口预置：?due=today|overdue &stage=intent|payment */
  const q = new URLSearchParams(location.search);
  const due = q.get('due');
  if (due === 'today' || due === 'overdue') document.getElementById('f_due').value = due;
  const stage = q.get('stage');
  if (stage === 'intent') st.value = S.LEAD.INTENT;
  if (stage === 'payment') document.getElementById('f_order').value = 'has';
})();

function dueKind(r) {
  if (TERMINAL.indexOf(r.status) >= 0 || !r.nextFollowAt) return '';
  const d = d10(r.nextFollowAt);
  if (d < S.TODAY) return 'overdue';
  if (d === S.TODAY) return 'today';
  return '';
}

function resetFilter() {
  ['f_status', 'f_level', 'f_due', 'f_channel', 'f_order'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('kw').value = '';
  render();
}

function render() {
  const kw = document.getElementById('kw').value.trim();
  const fStatus = document.getElementById('f_status').value;
  const fLevel = document.getElementById('f_level').value;
  const fDue = document.getElementById('f_due').value;
  const fChannel = document.getElementById('f_channel').value;
  const fOrder = document.getElementById('f_order').value;

  let rows = S.agentCustomers({ kw: kw });
  if (fStatus) rows = rows.filter(r => r.status === fStatus);
  if (fLevel) rows = rows.filter(r => r.level === fLevel);
  if (fChannel) rows = rows.filter(r => r.channel === fChannel);
  if (fDue) rows = rows.filter(r => dueKind(r) === fDue);
  if (fOrder === 'has') rows = rows.filter(r => r.orderCount > 0);
  if (fOrder === 'none') rows = rows.filter(r => !r.orderCount);

  /* 默认排序：逾期 > 今日待跟 > 意向明确 > 其他；同级按更新时间倒序 */
  function rank(r) {
    const k = dueKind(r);
    if (k === 'overdue') return 0;
    if (k === 'today') return 1;
    if (r.status === S.LEAD.INTENT) return 2;
    return 3;
  }
  rows.sort((a, b) => {
    const d = rank(a) - rank(b);
    if (d) return d;
    return (a.updatedAt || '') < (b.updatedAt || '') ? 1 : -1;
  });

  document.getElementById('total').textContent = rows.length;
  document.getElementById('sub').textContent = `仅显示本人报备或归属本人的客户 · 共 ${rows.length} 人`;

  Proto.renderRows('rows', rows, r => {
    const k = dueKind(r);
    const overdue = k === 'overdue';
    const levelTone = r.level === '高' ? 'red' : r.level === '中' ? 'amber' : r.level ? 'slate' : 'slate';
    return `<tr class="${overdue ? 'row-overdue' : ''}">
      <td class="mono small">${esc(r.leadId || '—')}</td>
      <td class="strong"><a href="customer-detail.html?id=${r.leadId}">${esc(r.customerName)}</a></td>
      <td class="mono">${esc(r.phone || '—')}</td>
      <td>${esc(r.grade || '—')}</td>
      <td class="small">${esc(r.intent || '—')}</td>
      <td>${r.level ? `<span class="tag tag-${levelTone} nodot tag-odds">${esc(r.level)}</span>` : '<span class="muted">—</span>'}</td>
      <td class="small">${esc(r.channel || '—')}</td>
      <td><span class="tag tag-${S.LEAD_TONE[r.status] || 'slate'}">${esc(r.status)}</span></td>
      <td class="right mono">${r.remain === null ? '<span class="muted">—</span>' : r.remain}</td>
      <td class="small muted">${esc((r.lastFollowAt || '—').slice(5, 16))}</td>
      <td class="small" ${overdue ? 'style="color:var(--danger);font-weight:600"' : (k === 'today' ? 'style="color:var(--warning);font-weight:600"' : '')}>
        ${k === 'overdue' ? '<span class="tag tag-red nodot">逾期</span> ' : ''}${esc(d10(r.nextFollowAt) || '—')}</td>
      <td class="ops nowrap">
        <a class="btn-link" href="customer-detail.html?id=${r.leadId}">详情</a>
        <button class="btn-link" onclick="openQuick('${r.leadId}','${esc(r.customerName)}')">快速跟进</button>
        <a class="btn-link" href="tel:${esc(r.phone || '')}">拨号</a>
        <button class="btn-link" onclick="copyPhone('${esc(r.phone || '')}')">复制</button>
      </td>
    </tr>`;
  }, 12, '没有符合条件的客户');
}

function openQuick(leadId, name) {
  if (!leadId) { Proto.toast('该客户无对应线索，请在详情页查看', 'warn'); return; }
  quickLead = leadId;
  document.getElementById('q_info').innerHTML = `<span class="k">客户</span><span class="v strong">${esc(name)}</span>`;
  document.getElementById('q_content').value = '';
  document.getElementById('q_next').value = '';
  Proto.openModal('quickModal');
}
function saveQuick() {
  const content = document.getElementById('q_content').value.trim();
  if (!content) { Proto.toast('请填写沟通内容', 'err'); return; }
  try {
    S.addLeadFollowUp(quickLead, {
      type: document.getElementById('q_type').value,
      content: content,
      nextAt: document.getElementById('q_next').value
    });
    Proto.closeModal('quickModal');
    Proto.toast('跟进已记录', 'ok');
    render();
  } catch (e) { Proto.toast(e.message, 'err'); }
}
function copyPhone(phone) {
  if (!phone) { Proto.toast('没有可复制的手机号', 'warn'); return; }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(phone).then(() => Proto.toast('已复制 ' + phone, 'ok'), () => Proto.toast('请手动复制：' + phone, 'warn'));
    } else { Proto.toast('请手动复制：' + phone, 'warn'); }
  } catch (e) { Proto.toast('请手动复制：' + phone, 'warn'); }
}

render();
</script>
</body>
</html>
