<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>业绩概览</title>
<link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div>
          <div class="crumb">工作台<span class="sep">/</span>业绩概览</div>
          <h1 class="page-title">业绩概览</h1>
          <div class="page-sub" id="sub">—</div>
        </div>
        <div class="page-actions">
          <a class="btn" href="my-customers.html">我的客户</a>
          <button class="btn btn-primary" onclick="openCreate()">+ 客户报备</button>
        </div>
      </div>

      <div class="grid g4 mb16" id="stats"></div>

      <div class="alert alert-warn mb16"><span class="ico">!</span>
        <div><b>佣金规则待确认：</b>确认时点、退款冲回、结算周期由机构配置。当前金额按代理档案中的规则预估，<b>仅供参考，不作为结算依据</b>（完整结算本轮不做）。</div></div>

      <div class="grid g-2-1" style="align-items:start">
        <div class="card">
          <div class="card-head"><div class="card-title">最近客户</div>
            <a class="btn btn-sm" href="my-customers.html">全部客户</a></div>
          <div class="card-body tight">
            <table class="table compact">
              <thead><tr><th>客户</th><th>学生年级</th><th>意向课程</th><th>状态</th><th>最近跟进</th><th style="width:80px">操作</th></tr></thead>
              <tbody id="recent"></tbody>
            </table>
          </div>
        </div>

        <div>
          <div class="card">
            <div class="card-head"><div class="card-title">待跟进提醒</div>
              <span class="tag tag-red nodot" id="dueCount">0</span></div>
            <div class="card-body" id="dueList"></div>
          </div>

          <div class="card">
            <div class="card-head"><div class="card-title">续费机会</div>
              <a class="btn btn-sm" href="renewal-list.html">全部</a></div>
            <div class="card-body" id="renewals"></div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script>
/* 代理身份取自会话：不使用任何工号/姓名硬编码 */
const S = Store;
const AG = Proto.agentId();
S.setSession({ role: 'agent', agentId: AG, operatorName: Proto.agentName() });
Proto.shell({ role: 'agent', active: 'agent-workbench' });

const ov = S.agentOverview(AG);
const rows = S.agentCustomers();
const cm = ov.commission || {};

document.getElementById('sub').textContent =
  `${ov.agent ? ov.agent.name : ''} · ${ov.agent ? ov.agent.type : ''} · 佣金规则 ${ov.agent ? ov.agent.ruleText : '—'}`;

document.getElementById('stats').innerHTML = `
  <div class="card stat"><div class="stat-label">我的客户</div><div class="stat-value">${ov.customers}<small>人</small></div>
    <div class="stat-foot">跟进中 ${ov.pendingLeads} 人</div></div>
  <div class="card stat"><div class="stat-label">成交客户</div><div class="stat-value" style="color:var(--success)">${ov.deals}<small>人</small></div>
    <div class="stat-foot">已入账订单 ${ov.creditedOrders} 笔</div></div>
  <div class="card stat"><div class="stat-label">成交金额</div><div class="stat-value">${Proto.money(ov.amount)}</div>
    <div class="stat-foot">按已收款入账订单统计</div></div>
  <div class="card stat"><div class="stat-label">佣金预估</div><div class="stat-value" style="color:var(--warning)">${Proto.money(cm.estimatedCommission || 0)}</div>
    <div class="stat-foot">${cm.settlementStatus || '未结算'} · 仅预估</div></div>`;

Proto.renderRows('recent', rows.slice(0, 6), r => `
  <tr>
    <td class="strong"><a href="customer-detail.html?id=${r.leadId}">${r.customerName}</a></td>
    <td>${r.grade || '—'}</td>
    <td class="small">${r.intent || '—'}</td>
    <td><span class="tag tag-${S.LEAD_TONE[r.status] || 'slate'}">${r.status}</span></td>
    <td class="small muted">${(r.lastFollowAt || '—').slice(5, 16)}</td>
    <td class="ops"><a class="btn-link" href="customer-detail.html?id=${r.leadId}">跟进</a></td>
  </tr>`, 6);

const due = rows.filter(r => r.nextFollowAt && r.nextFollowAt.slice(0, 10) <= S.TODAY &&
  [S.LEAD.DEAL, S.LEAD.INVALID, S.LEAD.CLOSED].indexOf(r.status) < 0);
document.getElementById('dueCount').textContent = due.length;
document.getElementById('dueList').innerHTML = due.length ? due.map(r => `
  <div class="m-row"><span class="k">${r.customerName} · ${r.grade || '—'}</span>
    <span class="tag tag-amber nodot">${r.nextFollowAt.slice(0, 10)}</span></div>`).join('')
  : '<div class="small muted">暂无逾期跟进，全部按计划推进。</div>';

const rn = S.agentRenewals(AG);
document.getElementById('renewals').innerHTML = rn.length ? rn.slice(0, 4).map(x => `
  <div class="m-row"><span class="k">${x.studentName} · 剩余 ${x.remain} 课时</span>
    <span class="tag tag-${S.RENEWAL_TONE[x.renewal.status]}">${x.renewal.status}</span></div>`).join('')
  : '<div class="small muted">暂无续费机会。</div>';

function openCreate() { location.href = 'customer-create.html'; }
</script>
</body>
</html>
