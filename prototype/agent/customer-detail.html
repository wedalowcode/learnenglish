<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>客户详情</title>
<link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="page">
      <div class="empty" style="padding:60px 20px"><div class="e-ico">▤</div><p>正在加载客户档案…</p></div>
    </main>
  </div>
</div>

<div class="mask" id="followModal">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">记录跟进</div>
      <button class="modal-close" onclick="Proto.closeModal('followModal')">×</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field"><label>跟进方式 <span class="req">*</span></label>
          <select class="select" id="f_type"><option>电话</option><option>微信</option><option>面谈</option><option>其他</option></select></div>
        <div class="field"><label>下次跟进时间</label>
          <input class="input" type="date" id="f_next"></div>
        <div class="field"><label>意向等级</label>
          <select class="select" id="f_level"><option value="">不评估</option></select></div>
        <div class="field"><label>决策人</label>
          <select class="select" id="f_decision"><option value="">未明确</option></select></div>
        <div class="field"><label>下次动作</label>
          <select class="select" id="f_nextaction"><option value="">未设定</option></select></div>
        <div class="field"><label>预算区间</label>
          <input class="input" id="f_budget" placeholder="如 1-2万（选填）"></div>
        <div class="field full"><label>主要顾虑（多选）</label>
          <div class="flex gap8" id="f_concerns" style="flex-wrap:wrap"></div></div>
        <div class="field full"><label>沟通内容 <span class="req">*</span></label>
          <textarea class="textarea" id="f_content" placeholder="必填，记录客户诉求与你的回复"></textarea></div>
        <div class="field full"><label>推进状态（只能向前流转）</label>
          <select class="select" id="f_status"></select></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="Proto.closeModal('followModal')">取消</button>
      <button class="btn btn-primary" onclick="saveFollow()">保存跟进</button>
    </div>
  </div>
</div>

<div class="mask" id="orderModal">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">提交报名订单</div>
      <button class="modal-close" onclick="Proto.closeModal('orderModal')">×</button></div>
    <div class="modal-body">
      <div class="alert alert-info mb16"><span class="ico">i</span>
        <div>提交后订单进入「待审核」，<b>未收款不产生课时</b>；管理员确认收款后才为学员建档入账。</div></div>
      <div class="field"><label>报名套餐 <span class="req">*</span></label>
        <select class="select" id="o_product"></select></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="Proto.closeModal('orderModal')">取消</button>
      <button class="btn btn-primary" onclick="submitOrder()">提交订单</button>
    </div>
  </div>
</div>

<div class="mask" id="renewalModal">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">发起续费订单</div>
      <button class="modal-close" onclick="Proto.closeModal('renewalModal')">×</button></div>
    <div class="modal-body">
      <div class="alert alert-info mb16"><span class="ico">i</span>
        <div id="renewalTip">续费订单仍需管理员确认收款后才增加课时。</div></div>
      <div class="field"><label>续费套餐 <span class="req">*</span></label>
        <select class="select" id="r_product"></select></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="Proto.closeModal('renewalModal')">取消</button>
      <button class="btn btn-primary" onclick="submitRenewal()">提交续费订单</button>
    </div>
  </div>
</div>

<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script>
const S = Store;
const AG = Proto.agentId();
S.setSession({ role: 'agent', agentId: AG, operatorName: Proto.agentName() });
Proto.shell({ role: 'agent', active: 'agent-customers' });

/* 结构化跟进字段初始化（来自 Store 枚举，集中维护不散落） */
(function initFollowFields() {
  const lv = document.getElementById('f_level');
  lv.innerHTML = '<option value="">不评估</option>' + (S.LEAD_LEVELS || []).map(x => `<option>${x}</option>`).join('');
  const dc = document.getElementById('f_decision');
  dc.innerHTML = '<option value="">未明确</option>' + (S.LEAD_DECISION_MAKERS || []).map(x => `<option>${x}</option>`).join('');
  const na = document.getElementById('f_nextaction');
  na.innerHTML = '<option value="">未设定</option>' + (S.LEAD_NEXT_ACTIONS || []).map(x => `<option>${x}</option>`).join('');
  const cs = document.getElementById('f_concerns');
  cs.innerHTML = (S.LEAD_CONCERNS || []).map(x => `<label class="check"><input type="checkbox" name="fc" value="${x}"> ${x}</label>`).join('');
})();

const Q = new URLSearchParams(location.search);
let LEAD_ID = Q.get('id');
let VIEW = null;
let renewalId = '';

function firstLeadId() {
  const rows = S.agentCustomers().filter(r => r.leadId);
  return rows.length ? rows[0].leadId : '';
}
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function render() {
  if (!LEAD_ID) LEAD_ID = firstLeadId();
  if (!LEAD_ID) {
    document.getElementById('page').innerHTML =
      '<div class="card"><div class="card-body"><div class="empty" style="padding:40px"><div class="e-ico">▤</div><p>你还没有客户，先提交一条客户报备</p><a class="btn btn-primary mt12" href="customer-create.html">+ 客户报备</a></div></div></div>';
    return;
  }
  try { VIEW = S.agentLeadView(LEAD_ID); }
  catch (e) {
    document.getElementById('page').innerHTML =
      `<div class="card"><div class="card-body"><div class="alert alert-warn"><span class="ico">!</span><div>${esc(e.message)}</div></div>
       <a class="btn mt12" href="my-customers.html">返回我的客户</a></div></div>`;
    return;
  }
  const L = VIEW.lead, STU = VIEW.student;
  const nexts = (S.LEAD_NEXT[L.status] || []);
  document.getElementById('page').innerHTML = `
    <div class="page-head">
      <div>
        <div class="crumb">客户管理<span class="sep">/</span><a href="my-customers.html">我的客户</a><span class="sep">/</span>客户详情</div>
        <h1 class="page-title">${esc(L.name)} <span class="tag tag-${S.LEAD_TONE[L.status] || 'slate'}" style="font-size:12px;vertical-align:middle">${L.status}</span></h1>
        <div class="page-sub">${L.id} · ${esc(L.phone)} · 学生 ${esc(L.kidName || (STU ? STU.name : '—'))} · ${esc(L.grade || '—')} · 意向 ${esc(L.intent || '—')}</div>
      </div>
      <div class="page-actions">
        <a class="btn" href="my-customers.html">返回</a>
        ${[S.LEAD.DEAL, S.LEAD.INVALID, S.LEAD.CLOSED].indexOf(L.status) < 0
          ? `<button class="btn" onclick="openFollow()">+ 记录跟进</button>` : ''}
        ${[S.LEAD.TO_CONTACT, S.LEAD.FOLLOWING].indexOf(L.status) >= 0
          ? `<button class="btn btn-primary" onclick="toIntent()">转为意向</button>` : ''}
        ${L.status === S.LEAD.INTENT
          ? `<button class="btn btn-primary" onclick="Proto.openModal('orderModal')">提交报名订单</button>` : ''}
      </div>
    </div>

    ${Q.get('first') === '1' ? `<div class="alert alert-success mb16"><span class="ico">✓</span>
      <div><b>报备成功！</b>建议立即记录首次跟进，沉淀客户诉求、顾虑与下次动作。
        <div class="mt8"><button class="btn btn-sm btn-primary" onclick="openFollow()">立即记录首次跟进</button></div></div></div>` : ''}

    <div class="grid g-2-1" style="align-items:start">
      <div>
        <div class="card">
          <div class="card-head"><div class="card-title">客户信息</div></div>
          <div class="card-body">
            <div class="desc g3">
              <div class="desc-item"><span class="k">家长姓名</span><span class="v">${esc(L.name)}</span></div>
              <div class="desc-item"><span class="k">联系电话</span><span class="v mono">${esc(L.phone)}</span></div>
              <div class="desc-item"><span class="k">学生姓名</span><span class="v">${esc(L.kidName || (STU ? STU.name : '—'))}</span></div>
              <div class="desc-item"><span class="k">学生年级</span><span class="v">${esc(L.grade || '—')}</span></div>
              <div class="desc-item"><span class="k">意向教材</span><span class="v">${esc(L.book || '—')}</span></div>
              <div class="desc-item"><span class="k">意向课程</span><span class="v">${esc(L.intent || '—')}</span></div>
              <div class="desc-item"><span class="k">来源渠道</span><span class="v">${esc(L.channel || '—')}</span></div>
              <div class="desc-item"><span class="k">意向等级</span><span class="v">${esc(L.level || '—')}</span></div>
              <div class="desc-item"><span class="k">下次跟进</span><span class="v">${esc(L.nextFollowAt ? L.nextFollowAt.slice(0, 16) : '—')}</span></div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-head"><div class="card-title">归属追溯<span class="hint">代理归属 / 维护归属分开留痕</span></div></div>
          <div class="card-body">
            <div class="desc g3">
              <div class="desc-item"><span class="k">代理归属</span><span class="v">${esc(Proto.agentName())}（${esc(AG)}）</span></div>
              <div class="desc-item"><span class="k">维护归属</span><span class="v">${esc(L.followerName || '—')}</span></div>
              <div class="desc-item"><span class="k">成交归属</span><span class="v">${VIEW.orders.filter(o => o.status === S.ORDER.CREDITED).length ? esc(Proto.agentName()) : '待成交'}</span></div>
            </div>
            <div class="alert alert-info mt12"><span class="ico">i</span>
              <div>代理不可修改客户归属；归属冲突由机构管理员在后台确认，并写入线索操作日志。</div></div>
          </div>
        </div>

        <div class="card">
          <div class="card-head"><div class="card-title">跟进时间轴<span class="hint">共 ${VIEW.followUps.length} 次</span></div>
            ${[S.LEAD.DEAL, S.LEAD.INVALID, S.LEAD.CLOSED].indexOf(L.status) < 0
              ? '<button class="btn btn-sm" onclick="openFollow()">+ 记录</button>' : ''}</div>
          <div class="card-body">
            ${VIEW.followUps.length ? `<div class="timeline">${VIEW.followUps.map((f, i) => `
              <div class="tl-item ${i === 0 ? 'on' : ''}">
                <div class="tl-head"><b>${esc(f.type)}</b><span class="tl-time">${esc(f.at)} · ${esc(f.by)}</span></div>
                <div class="tl-body">${esc(f.content)}
                  ${(f.level || f.decisionMaker || (f.concerns && f.concerns.length) || f.budget || f.nextAction)
                    ? `<div class="small muted mt4">${f.level ? '等级 ' + esc(f.level) + ' ' : ''}${f.decisionMaker ? '决策人 ' + esc(f.decisionMaker) + ' ' : ''}${(f.concerns && f.concerns.length) ? '顾虑 ' + esc(f.concerns.join('/')) + ' ' : ''}${f.budget ? '预算 ' + esc(f.budget) + ' ' : ''}${f.nextAction ? '下次动作 ' + esc(f.nextAction) : ''}</div>` : ''}
                  ${f.nextAt ? `<div class="box">下次跟进：${esc(f.nextAt)}</div>` : ''}</div>
              </div>`).join('')}</div>`
              : '<div class="empty" style="padding:24px 8px"><p>尚未记录跟进</p><p class="small">至少一条跟进后才能转为意向</p></div>'}
          </div>
        </div>

        <div class="card">
          <div class="card-head"><div class="card-title">成交订单 <span class="hint">状态时间轴</span></div></div>
          <div class="card-body">
            ${VIEW.orders.length ? VIEW.orders.map(o => `
              <div style="border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:10px">
                <div class="flex jcb aic">
                  <div><b>${esc(o.productName)}</b> <span class="mono small muted">${o.id}</span></div>
                  <span class="tag tag-${S.ORDER_TONE[o.status] || 'slate'}">${esc(o.status)}</span>
                </div>
                <div class="small muted mt4">课时 ${o.totalHours} · 金额 ${Proto.money(o.amount)} · 已支付 ${Proto.money(o.paidAmount || 0)} · 下单 ${esc(o.createdAt)}</div>
                <div class="flex mt8" style="gap:6px;flex-wrap:wrap;align-items:center">
                  ${(o.timeline || []).map(n => `<span class="tag tag-${n.done ? (n.terminal ? 'red' : 'green') : 'slate'} nodot" title="${esc(n.at || '')}">${esc(n.label)}${n.done ? ' ✓' : ''}</span>`).join('<span class="muted">→</span>')}
                </div>
                ${o.rejectReason ? `<div class="alert alert-warn mt8" style="margin:8px 0 0"><span class="ico">!</span><div>驳回/取消原因：${esc(o.rejectReason)}</div></div>` : ''}
              </div>`).join('')
              : `<div class="empty" style="padding:24px 8px"><div class="e-ico">▤</div><p>暂未成交</p><p class="small">转为意向并提交报名订单后，订单会保留你的代理归属</p></div>`}
          </div>
        </div>
      </div>

      <div>
        <div class="card">
          <div class="card-head"><div class="card-title">学员与课时</div></div>
          <div class="card-body">
            ${STU ? `<div class="m-row"><span class="k">学员</span><b>${esc(STU.name)}</b></div>
              <div class="m-row"><span class="k">当前教师</span><span>${esc(STU.teacherName)}</span></div>
              <div class="m-row"><span class="k">剩余课时</span><b class="mono" style="color:${STU.remain < 5 ? 'var(--danger)' : 'var(--text)'}">${STU.remain}</b></div>
              <div class="m-row" style="border-bottom:none"><span class="k">状态</span><span>${esc(STU.status)}</span></div>`
              : '<div class="small muted">尚未成交，无学员档案与课时。课时只来自订单收款入账。</div>'}
          </div>
        </div>

        <div class="card" id="feedback">
          <div class="card-head"><div class="card-title">学习反馈<span class="hint">教师已发布</span></div></div>
          <div class="card-body">
            ${VIEW.feedbacks.length ? VIEW.feedbacks.slice(0, 4).map(f => `
              <div class="m-row" style="display:block">
                <div class="flex jcb aic"><b>${esc(f.title)}</b><span class="small muted">${esc((f.publishedAt || '').slice(0, 10))}</span></div>
                <div class="small muted mt4">教师 ${esc(f.teacherName)} · 学员 ${esc(f.studentName)}</div>
                <div class="box mt8">表现：${esc(f.performance)}${f.weak ? '；薄弱点：' + esc(f.weak) : ''}</div>
              </div>`).join('')
              : '<div class="small muted">教师尚未发布学习反馈；发布后代理可见自己客户的反馈。</div>'}
          </div>
        </div>

        <div class="card">
          <div class="card-head"><div class="card-title">续费机会</div>
            <a class="btn btn-sm" href="renewal-list.html">全部</a></div>
          <div class="card-body">
            ${VIEW.renewals.length ? VIEW.renewals.map(r => `
              <div class="m-row" style="display:block">
                <div class="flex jcb aic"><span class="k">${esc(r.sourceType)}</span>
                  <span class="tag tag-${S.RENEWAL_TONE[r.status]}">${r.status}</span></div>
                <div class="small muted mt4">剩余 ${r.remain} 课时 · 到期 ${esc(r.expireAt || '—')}</div>
                ${[S.RENEWAL.PENDING, S.RENEWAL.FOLLOWING].indexOf(r.status) >= 0
                  ? `<button class="btn btn-sm mt8" onclick="openRenewal('${r.id}')">发起续费订单</button>` : ''}
              </div>`).join('')
              : '<div class="small muted">课时低于阈值或套餐临期时自动生成续费机会。</div>'}
          </div>
        </div>

        <div class="alert alert-info mt16"><span class="ico">i</span>
          <div>代理端不展示收款流水与内部操作日志，仅展示必要的订单状态、课时余额与已发布学习反馈。</div></div>
      </div>
    </div>`;

  const st = document.getElementById('f_status');
  st.innerHTML = '<option value="">保持当前状态</option>' +
    nexts.map(s => `<option>${s}</option>`).join('');
  const psel = document.getElementById('o_product');
  psel.innerHTML = S.products().filter(p => p.status !== '停用')
    .map(p => `<option value="${p.id}"${p.id === L.intentProductId ? ' selected' : ''}>${p.name} · ${p.hours}课时 · ${Proto.money(p.amount)}</option>`).join('');
  document.getElementById('r_product').innerHTML = S.products().filter(p => p.status !== '停用')
    .map(p => `<option value="${p.id}">${p.name} · ${p.hours}课时 · ${Proto.money(p.amount)}</option>`).join('');
}

function openFollow() { Proto.openModal('followModal'); }
function saveFollow() {
  const concerns = Array.from(document.querySelectorAll('input[name=fc]:checked')).map(x => x.value);
  try {
    S.addLeadFollowUp(LEAD_ID, {
      type: document.getElementById('f_type').value,
      content: document.getElementById('f_content').value.trim(),
      nextAt: document.getElementById('f_next').value,
      status: document.getElementById('f_status').value,
      level: document.getElementById('f_level').value,
      decisionMaker: document.getElementById('f_decision').value,
      budget: document.getElementById('f_budget').value.trim(),
      nextAction: document.getElementById('f_nextaction').value,
      concerns: concerns
    });
    Proto.closeModal('followModal');
    document.getElementById('f_content').value = '';
    document.getElementById('f_budget').value = '';
    document.getElementById('f_level').value = '';
    document.getElementById('f_decision').value = '';
    document.getElementById('f_nextaction').value = '';
    document.querySelectorAll('input[name=fc]').forEach(x => x.checked = false);
    Proto.toast('跟进已记录', 'ok');
    render();
  } catch (e) { Proto.toast(e.message, 'err'); }
}
function toIntent() {
  try {
    S.markLeadIntent(LEAD_ID, { intent: VIEW.lead.intent });
    Proto.toast('已转为意向明确，可提交报名订单', 'ok');
    render();
  } catch (e) { Proto.toast(e.message, 'err'); }
}
function submitOrder() {
  try {
    const o = S.submitEnrollmentOrder({ leadId: LEAD_ID, productId: document.getElementById('o_product').value });
    Proto.closeModal('orderModal');
    Proto.toast('报名订单 ' + o.order.id + ' 已提交，等待管理员审核收款', 'ok');
    render();
  } catch (e) { Proto.toast(e.message, 'err'); }
}
function openRenewal(id) {
  renewalId = id;
  const r = S.renewal(id);
  document.getElementById('renewalTip').textContent =
    `学员当前剩余 ${r ? r.remain : 0} 课时 · ${r ? r.sourceType : ''}。续费订单仍需管理员确认收款后才增加课时。`;
  Proto.openModal('renewalModal');
}
function submitRenewal() {
  try {
    const o = S.submitRenewalOrder(renewalId, document.getElementById('r_product').value);
    Proto.closeModal('renewalModal');
    Proto.toast('续费订单 ' + o.order.id + ' 已提交，等待管理员确认收款', 'ok');
    render();
  } catch (e) { Proto.toast(e.message, 'err'); }
}
render();
</script>
</body>
</html>
