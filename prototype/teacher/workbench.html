<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日工作台</title>
<link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div>
          <div class="crumb">教学工作台<span class="sep">/</span>今日工作台</div>
          <h1 class="page-title">早上好，<span id="greetName">老师</span></h1>
          <div class="page-sub" id="subLine">—</div>
        </div>
        <div class="page-actions">
          <a class="btn" href="my-students.html">我的学员</a>
          <a class="btn" href="teaching-record.html">教学记录</a>
          <a class="btn btn-primary" href="course-workbench.html" id="goToday">进入今日第一节课</a>
        </div>
      </div>

      <div class="grid g6 mb16" id="statCards"></div>

      <div class="grid g-2-1" style="align-items:start">
        <div>
          <div class="card">
            <div class="card-head"><div class="card-title">今日课程</div>
              <span class="small muted">从课程工作台进入，所有教学行为归属本节课；完成课程才扣课时</span></div>
            <div class="card-body tight">
              <div class="table-wrap">
                <table class="table">
                  <thead><tr><th>时间</th><th>学员</th><th>年级</th><th>课程状态</th><th>报告</th><th style="width:180px">操作</th></tr></thead>
                  <tbody id="todayCourses"></tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-head"><div class="card-title">最近教学记录</div>
              <a class="btn btn-sm" href="teaching-record.html">全部</a></div>
            <div class="card-body">
              <div class="timeline" id="recentRecords"></div>
            </div>
          </div>
        </div>

        <div>
          <div class="card">
            <div class="card-head"><div class="card-title">今日待复习</div>
              <span class="tag tag-amber nodot" id="dueBadge">0</span></div>
            <div class="card-body">
              <div id="dueBox"><div class="small muted">加载中…</div></div>
              <div class="divider"></div>
              <div class="small muted">两套体系任务<b>独立生成、独立记录</b>，复习结果互不覆盖。</div>
            </div>
          </div>

          <div class="card">
            <div class="card-head"><div class="card-title">我的学员</div>
              <a class="btn btn-sm" href="my-students.html">全部</a></div>
            <div class="card-body tight">
              <table class="table compact"><tbody id="recentStudents"></tbody></table>
            </div>
          </div>

          <div class="card">
            <div class="card-head"><div class="card-title">快捷入口</div></div>
            <div class="card-body" style="display:flex;flex-direction:column;gap:8px">
              <a class="btn btn-block btn-primary" href="course-workbench.html">课程工作台</a>
              <a class="btn btn-block" href="word-training-setup.html">开始单词训练</a>
              <a class="btn btn-block" href="article-training.html">开始文章训练</a>
              <a class="btn btn-block" href="leitner.html">莱特纳复习</a>
              <a class="btn btn-block" href="memory21.html">21 天记忆复习</a>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script>
Proto.shell({ role: 'teacher', active: 'workbench' });

const TEACHER = Proto.teacherId();
document.getElementById('greetName').textContent = Proto.teacherName();
const CTAG = { '待上课': 'tag-slate', '授课中': 'tag-blue', '已完成': 'tag-green', '未上课': 'tag-amber', '已取消': 'tag-red' };
const RTAG = { '未生成': 'tag-slate', '编辑中': 'tag-amber', '已提交': 'tag-blue', '已发布': 'tag-green' };

const today = Store.coursesOfTeacher(TEACHER, Store.TODAY);
const stat = Store.courseStat(TEACHER, Store.TODAY);
const rs = Store.reportStat(TEACHER);
const stu = Store.student('S2026001');
const due = Store.leitnerDueDetail('S2026001');
const p21 = Store.plan21TodaySummary('S2026001');

document.getElementById('subLine').textContent =
  Store.TODAY + '（周一）· 今天有 ' + stat.total + ' 节课 · 已完成 ' + stat.done
  + ' · 待写报告 ' + rs.draft + ' 份';

const first = today.filter(c => c.status === '授课中')[0] || today.filter(c => c.status === '待上课')[0];
if (first) document.getElementById('goToday').href = 'course-workbench.html?course=' + first.id;
else {
  document.getElementById('goToday').href = 'course-workbench.html';
  document.getElementById('goToday').textContent = '打开课程工作台';
}

document.getElementById('statCards').innerHTML = `
  <div class="card stat"><div class="stat-label">今日课程</div><div class="stat-value">${stat.total}<small>节</small></div>
    <div class="stat-foot">${stat.done} 已完成 · ${stat.pending} 待上课${stat.ongoing ? ' · ' + stat.ongoing + ' 授课中' : ''}</div></div>
  <div class="card stat"><div class="stat-label">待写报告</div>
    <div class="stat-value" style="color:var(--warning)">${rs.draft}<small>份</small></div>
    <div class="stat-foot"><a href="teaching-record.html">去填写 →</a></div></div>
  <div class="card stat"><div class="stat-label">待发布报告</div>
    <div class="stat-value">${rs.submitted}<small>份</small></div>
    <div class="stat-foot">已提交，家长还看不到</div></div>
  <div class="card stat"><div class="stat-label">今日待复习单词</div>
    <div class="stat-value">${due.total}<small>个</small></div>
    <div class="stat-foot">红盒 ${due.red.length} + 黄盒到期 ${due.yellow.length} + 指定 ${due.manual.length}</div></div>
  <div class="card stat"><div class="stat-label">21 天待复习</div>
    <div class="stat-value">${p21.due}<small>个</small></div>
    <div class="stat-foot">计划第 ${p21.day} / 21 天 · 已完成 ${p21.done}</div></div>
  <div class="card stat"><div class="stat-label">当前负责学员</div>
    <div class="stat-value">${Store.students().filter(s => s.teacher === TEACHER).length}<small>人</small></div>
    <div class="stat-foot">${Store.students().filter(s => s.teacher === TEACHER).map(s => s.name).join(' · ')}</div></div>`;

Proto.renderRows('todayCourses', today, c => {
  const s = Store.student(c.studentId);
  const rp = Store.reportOfCourse(c.id);
  return `<tr>
    <td class="mono strong">${c.start}-${c.end}</td>
    <td class="strong"><a href="student-profile.html?student=${c.studentId}">${s ? s.name : c.student}</a></td>
    <td>${s ? s.grade : '—'}</td>
    <td><span class="tag ${CTAG[c.status]} nodot">${c.status}</span></td>
    <td>${rp ? `<span class="tag ${RTAG[rp.status]} nodot">${rp.status}</span>` : '<span class="tag tag-slate nodot">未生成</span>'}</td>
    <td class="ops">
      <a class="btn-link" href="course-workbench.html?course=${c.id}">${c.status === '已完成' ? '回看' : '进入课堂'}</a>
      <a class="btn-link" href="student-profile.html?student=${c.studentId}">学习档案</a>
    </td>
  </tr>`;
}, 6, '今天没有排课');

document.getElementById('recentRecords').innerHTML = (function () {
  const list = Store.recordsOfTeacher(TEACHER).slice(0, 4);
  if (!list.length) return '<div class="small muted">还没有完成过课程</div>';
  return list.map(r => {
    const c = Store.course(r.courseId);
    const s = Store.student(r.studentId);
    const rp = r.reportId ? Store.report(r.reportId) : null;
    return `<div class="tl-item on">
      <div class="tl-head"><b>${s ? s.name : ''} · ${rp ? rp.title : '一对一课程'}</b>
        <span class="tl-time">${(c ? c.date : '').slice(5)}</span></div>
      <div class="tl-body">单词 ${r.snapshot ? r.snapshot.trainWords : 0} 个 · 复习 ${r.snapshot ? (r.snapshot.leitnerWords + r.snapshot.plan21Words) : 0} 个
        · 文章 ${r.snapshot ? r.snapshot.articleSentences : 0} 句
        ${rp ? `<span class="tag ${RTAG[rp.status]} nodot" style="margin-left:6px">${rp.status}</span>` : ''}</div>
    </div>`;
  }).join('');
})();

document.getElementById('dueBadge').textContent = due.total + p21.due;
document.getElementById('dueBox').innerHTML = `
  <div class="m-row"><span class="k">莱特纳 · 红盒</span>
    <span><b class="mono">${due.red.length}</b> <a class="btn-link" href="leitner.html?student=S2026001" style="margin-left:6px">复习</a></span></div>
  <div class="m-row"><span class="k">莱特纳 · 黄盒到期</span>
    <span><b class="mono">${due.yellow.length}</b> <a class="btn-link" href="leitner.html?student=S2026001" style="margin-left:6px">复习</a></span></div>
  <div class="m-row"><span class="k">莱特纳 · 教师指定</span><span><b class="mono">${due.manual.length}</b></span></div>
  <div class="m-row"><span class="k">21 天计划今日任务</span>
    <span><b class="mono">${p21.due}</b> <a class="btn-link" href="memory21.html?student=S2026001" style="margin-left:6px">复习</a></span></div>
  ${p21.overdueTasks ? `<div class="m-row"><span class="k">21 天历史逾期</span>
    <span><b class="mono" style="color:var(--danger)">${p21.overdueWords}</b> 个单词 / ${p21.overdueTasks} 个节点</span></div>` : ''}`;

Proto.renderRows('recentStudents', Store.students().filter(s => s.teacher === TEACHER), s => {
  const d = Store.leitnerDueDetail(s.id);
  const p = Store.plan21TodaySummary(s.id);
  return `<tr>
    <td class="strong"><a href="student-profile.html?student=${s.id}">${s.name}</a></td>
    <td class="small muted">${s.lastCourse}</td>
    <td class="right mono" style="color:var(--warning)">${d.total + p.due}</td>
    <td class="ops"><a class="btn-link" href="word-training-setup.html?student=${s.id}">训练</a></td>
  </tr>`;
}, 4, '暂无负责学员');
</script>
</body>
</html>
