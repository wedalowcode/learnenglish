<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日工作台</title>
<link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div>
          <div class="crumb">教学工作台<span class="sep">/</span>今日工作台</div>
          <h1 class="page-title">早上好，<span id="greetName">老师</span></h1>
          <div class="page-sub" id="subLine">—</div>
        </div>
        <div class="page-actions">
          <a class="btn" href="my-students.html">我的学员</a>
          <a class="btn" href="teaching-record.html">教学记录</a>
          <a class="btn btn-primary" href="course-workbench.html" id="goToday">进入今日第一节课</a>
        </div>
      </div>

      <div class="grid g6 mb16" id="statCards"></div>

      <div class="grid g-2-1" style="align-items:start">
        <div>
          <div class="card">
            <div class="card-head"><div class="card-title">今日课程</div>
              <span class="small muted">单词训练必须从具体课程进入；教务排课信息教师端只读</span></div>
            <div class="card-body tight">
              <div class="table-wrap">
                <table class="table">
                  <thead><tr><th>时间</th><th>学员</th><th>年级</th><th>课程状态</th><th>腾讯会议</th><th>报告</th><th style="width:150px">操作</th></tr></thead>
                  <tbody id="todayCourses"></tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-head"><div class="card-title">最近教学记录</div>
              <a class="btn btn-sm" href="teaching-record.html">全部</a></div>
            <div class="card-body">
              <div class="timeline" id="recentRecords"></div>
            </div>
          </div>
        </div>

        <div>
          <div class="card">
            <div class="card-head"><div class="card-title">待填写教学报告</div>
              <span class="tag tag-amber nodot" id="reportBadge">0</span></div>
            <div class="card-body" id="pendingReports"></div>
          </div>

          <div class="card">
            <div class="card-head"><div class="card-title">今日课程说明</div></div>
            <div class="card-body">
              <div class="small muted" style="line-height:1.9">
                排课、授课教师、上课时间与腾讯会议链接由教务维护，教师端只读。<br>
                待上课 / 授课中可进入课堂；已完成只能回看历史；未上课 / 已取消不能进入正常教学流程。
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script>
Proto.shell({ role: 'teacher', active: 'workbench' });

const TEACHER = Proto.teacherId();
const TODAY = Store.TODAY;
document.getElementById('greetName').textContent = Proto.teacherName();

const CTAG = { '待上课': 'tag-slate', '授课中': 'tag-blue', '已完成': 'tag-green', '未上课': 'tag-amber', '已取消': 'tag-red', '待处理': 'tag-amber' };
const RTAG = { '未生成': 'tag-slate', '编辑中': 'tag-amber', '已提交': 'tag-blue', '已发布': 'tag-green' };
const WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

const today = Store.coursesOfTeacher(TEACHER, TODAY);
const stat = Store.courseStat(TEACHER, TODAY);
const rs = Store.reportStat(TEACHER);
const openCourse = today.filter(c => c.status === '授课中')[0] || today.filter(c => c.status === '待上课')[0];

document.getElementById('subLine').textContent =
  TODAY + '（' + (WEEK[new Date(TODAY + 'T00:00:00').getDay()] || '') + '）· 今天 ' + stat.total +
  ' 节课 · 待上课 ' + stat.pending + ' · 授课中 ' + stat.ongoing + ' · 已完成 ' + stat.done + ' · 待写报告 ' + rs.draft + ' 份';

if (openCourse) {
  document.getElementById('goToday').href = 'course-workbench.html?course=' + openCourse.id;
} else {
  document.getElementById('goToday').href = 'course-workbench.html';
  document.getElementById('goToday').textContent = '打开课程工作台';
}

document.getElementById('statCards').innerHTML = `
  <div class="card stat"><div class="stat-label">今日课程</div><div class="stat-value">${stat.total}<small>节</small></div>
    <div class="stat-foot">${TODAY}</div></div>
  <div class="card stat"><div class="stat-label">待上课</div>
    <div class="stat-value">${stat.pending}<small>节</small></div>
    <div class="stat-foot">按开课时间排序</div></div>
  <div class="card stat"><div class="stat-label">授课中</div>
    <div class="stat-value" style="color:var(--info)">${stat.ongoing}<small>节</small></div>
    <div class="stat-foot">可继续进入课堂</div></div>
  <div class="card stat"><div class="stat-label">已完成</div>
    <div class="stat-value" style="color:var(--success)">${stat.done}<small>节</small></div>
    <div class="stat-foot">只能查看历史记录</div></div>
  <div class="card stat"><div class="stat-label">待写报告</div>
    <div class="stat-value" style="color:var(--warning)">${rs.draft}<small>份</small></div>
    <div class="stat-foot"><a href="teaching-record.html">去填写 →</a></div></div>
  <div class="card stat"><div class="stat-label">未上课 / 已取消</div>
    <div class="stat-value">${(stat.by['未上课'] || 0) + (stat.by['已取消'] || 0)}<small>节</small></div>
    <div class="stat-foot">不可进入正常教学流程</div></div>`;

function meetingCell(c) {
  if (c.meetingUrl) {
    return `<a class="btn-link" href="${Proto.escHtml(c.meetingUrl)}" target="_blank" rel="noopener">进入腾讯会议</a>
      <button class="btn-link" data-copy="${Proto.escHtml(c.meetingUrl)}">复制链接</button>`;
  }
  return '<span class="small muted">会议链接待教务补充</span>';
}
function enterCell(c) {
  if (c.status === '待上课' || c.status === '授课中') {
    return `<a class="btn-link" href="course-workbench.html?course=${c.id}">进入课堂</a>`;
  }
  if (c.status === '已完成') {
    return `<a class="btn-link" href="course-workbench.html?course=${c.id}">回看</a>`;
  }
  return '<span class="small muted">不可进入</span>';
}

Proto.renderRows('todayCourses', today, c => {
  const s = Store.student(c.studentId);
  const rp = Store.reportOfCourse(c.id);
  return `<tr>
    <td class="mono strong">${c.start}—${c.end}</td>
    <td class="strong"><a href="course-workbench.html?course=${c.id}">${s ? s.name : Proto.escHtml(c.student)}</a></td>
    <td>${s ? s.grade : '—'}</td>
    <td><span class="tag ${CTAG[c.status] || 'tag-slate'} nodot">${c.status}</span></td>
    <td>${meetingCell(c)}</td>
    <td>${rp ? `<span class="tag ${RTAG[rp.status] || 'tag-slate'} nodot">${rp.status}</span>` : '<span class="tag tag-slate nodot">未生成</span>'}</td>
    <td class="ops">${enterCell(c)}</td>
  </tr>`;
}, 20, '今天没有排课');

document.querySelectorAll('[data-copy]').forEach(btn => {
  btn.addEventListener('click', () => {
    const url = btn.getAttribute('data-copy');
    const done = () => { btn.textContent = '已复制'; setTimeout(() => { btn.textContent = '复制链接'; }, 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done, done);
    } else {
      const ta = document.createElement('textarea');
      ta.value = url; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta); done();
    }
  });
});

document.getElementById('recentRecords').innerHTML = (function () {
  const list = Store.recordsOfTeacher(TEACHER).slice(0, 4);
  if (!list.length) return '<div class="small muted">还没有完成过课程</div>';
  return list.map(r => {
    const c = Store.course(r.courseId);
    const s = Store.student(r.studentId);
    const rp = r.reportId ? Store.report(r.reportId) : null;
    return `<div class="tl-item on">
      <div class="tl-head"><b>${s ? s.name : ''} · ${rp ? rp.title : '一对一课程'}</b>
        <span class="tl-time">${(c ? c.date : '').slice(5)}</span></div>
      <div class="tl-body">单词 ${r.snapshot ? r.snapshot.trainWords : 0} 个 · 复习 ${r.snapshot ? (r.snapshot.leitnerWords + r.snapshot.plan21Words) : 0} 个
        · 文章 ${r.snapshot ? r.snapshot.articleSentences : 0} 句
        ${rp ? `<span class="tag ${RTAG[rp.status] || 'tag-slate'} nodot" style="margin-left:6px">${rp.status}</span>` : ''}</div>
    </div>`;
  }).join('');
})();

(function renderPendingReports() {
  const list = (Store.reports() || []).filter(r => (r.teacherId || '') === (TEACHER || '') && r.status === '编辑中');
  document.getElementById('reportBadge').textContent = list.length;
  const box = document.getElementById('pendingReports');
  if (!list.length) {
    box.innerHTML = '<div class="small muted">没有待填写的教学报告</div>';
    return;
  }
  box.innerHTML = list.slice(0, 5).map(r => {
    const c = Store.course(r.courseId);
    const s = Store.student(r.studentId);
    return `<div class="m-row"><span class="k">${s ? s.name : ''} · ${r.title || '教学报告'}</span>
      <span><a class="btn-link" href="teaching-record.html?course=${c ? c.id : ''}">去填写 →</a></span></div>`;
  }).join('');
})();
</script>
</body>
</html>
