<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章训练</title>
<link rel="stylesheet" href="../assets/css/common.css">
</head>
<body class="focus-page">

<div class="focus-top">
  <a class="btn btn-sm" href="#" id="exitLink">← 退出</a>
  <div>
    <div class="ft-title" id="topTitle">文章训练</div>
    <div class="ft-sub" id="topSub">请选择本次训练的文章</div>
  </div>
  <div class="grow"></div>
  <div class="text-r" style="margin-right:12px">
    <div class="small muted" id="progLabel">阶段</div>
    <div style="font-size:15px;font-weight:600" id="prog">—</div>
  </div>
  <button class="btn btn-sm" onclick="openEnd()">提前结束</button>
</div>

<div class="focus-main">
  <div class="focus-wrap" id="stage"></div>
</div>

<!-- 提前结束 -->
<div class="mask" id="endModal">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">提前结束文章训练</div>
      <button class="modal-close" onclick="Proto.closeModal('endModal')">×</button></div>
    <div class="modal-body">
      <div class="alert alert-warn mb16"><span class="ico">!</span>
        <div>已记录的句子操作（播放 / 查看中文 / 跟读）会全部保留，<b>未完成的句子保持未完成</b>，不会被静默补齐。</div></div>
      <div class="form-grid g1">
        <div class="field"><label>结束原因 <span class="req">*</span></label>
          <select class="select" id="endReason">
            <option value="">请选择</option>
            <option>课堂时间不足</option>
            <option>学员状态不佳</option>
            <option>音频资源异常</option>
            <option>临时调整教学内容</option>
            <option>其他</option>
          </select></div>
        <div class="field"><label>教师评价</label>
          <textarea class="textarea" id="endEval" placeholder="可填写本次听读表现"></textarea></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="Proto.closeModal('endModal')">取消</button>
      <button class="btn btn-danger" onclick="doEnd()">确认结束并保存</button>
    </div>
  </div>
</div>

<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script>
const q = new URLSearchParams(location.search);
let studentId = q.get('student') || 'S2026001';
let task = null;
let stage = 'select';       // select | listen | sentence | summary
let si = 0, revealed = false;

const el = () => document.getElementById('stage');
const ARTICLES = DB.articles || [];
// 只有 AR001 内置了逐句资源，其余为占位说明（不伪造句子）
const SENT_BY_ARTICLE = { AR001: DB.sentences || [] };

function setTop(t, s, p, label) {
  document.getElementById('topTitle').textContent = t;
  document.getElementById('topSub').textContent = s;
  document.getElementById('prog').textContent = p;
  document.getElementById('progLabel').textContent = label || '阶段';
}

/* ---------- 启动 / 恢复 ---------- */
function boot() {
  const tid = q.get('task');
  if (tid) {
    task = Store.articleTask(tid);
    if (task) { resumeInto(); return; }
  }
  const aid = q.get('article');
  if (aid) {
    const a = ARTICLES.filter(x => x.id === aid)[0];
    if (a) { startWith(a); return; }
  }
  // 有未完成任务时优先恢复（同一学员最近一条）
  const active = Store.articleTasksOf(studentId).filter(t => t.status === '进行中')[0];
  if (active) { task = active; resumeInto(); return; }
  renderSelect();
}

function resumeInto() {
  studentId = task.studentId;
  syncExit();
  if (task.status !== '进行中') { stage = 'summary'; render(); return; }
  stage = task.audioDone ? 'sentence' : 'listen';
  if (stage === 'sentence') {
    const d = Store.articleTaskDetails(task.id);
    const first = d.findIndex(x => !x.readDone);
    si = first >= 0 ? first : 0;
  }
  render();
}

function startWith(a) {
  const sents = SENT_BY_ARTICLE[a.id] || [];
  if (!sents.length) {
    Proto.toast('该文章在原型中未内置逐句资源，暂不能训练', 'err');
    renderSelect();
    return;
  }
  try {
    task = Store.startArticleTask({
      studentId: studentId, teacherId: 'T001',
      articleId: a.id, articleName: a.name, courseId: '',
      sentences: sents, by: '李婉'
    });
  } catch (e) {
    Proto.toast(e.message, 'err');
    return;
  }
  Proto.toast('已创建文章训练任务 ' + task.id, 'ok');
  stage = task.audioDone ? 'sentence' : 'listen';
  si = 0; revealed = false;
  syncExit();
  render();
}

function syncExit() {
  document.getElementById('exitLink').href = 'student-profile.html?student=' + studentId;
}

function render() {
  if (stage === 'select') renderSelect();
  else if (stage === 'listen') renderListen();
  else if (stage === 'sentence') renderSentence();
  else renderSummary();
}

/* ---------- 选择文章 ---------- */
function renderSelect() {
  const stu = Store.student(studentId);
  setTop('文章训练 · ' + (stu ? stu.name : studentId), '请选择本次训练的文章', '—', '阶段');

  const rows = ARTICLES.map(a => {
    const hist = Store.articleTasksOf(studentId).filter(t => t.articleId === a.id);
    const has = (SENT_BY_ARTICLE[a.id] || []).length > 0;
    const last = hist[0];
    return `<tr>
      <td class="strong">${a.name}</td>
      <td class="small">${a.book} / ${a.unit}</td>
      <td class="right mono">${a.sentences}</td>
      <td><span class="tag ${a.audio === '已就绪' ? 'tag-green' : a.audio === '部分缺失' ? 'tag-amber' : 'tag-slate'} nodot">${a.audio}</span></td>
      <td class="right mono">${hist.length}</td>
      <td class="small muted">${last ? last.startedAt.slice(0, 10) : '—'}</td>
      <td>${has
        ? `<button class="btn-link" onclick="pick('${a.id}')">开始 / 继续</button>`
        : `<span class="small muted" title="原型未内置该文章的逐句数据">未内置句子</span>`}</td>
    </tr>`;
  }).join('');

  el().innerHTML = `
    <div class="card">
      <div class="card-head"><div class="card-title">选择文章</div>
        <span class="small muted">教材版本 / 单元 / 文章；历史训练次数来自数据层</span></div>
      <div class="card-body">
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>文章名称</th><th>教材 / 单元</th><th class="right">句子数量</th><th>完整音频</th>
              <th class="right">历史训练</th><th>最近训练</th><th style="width:110px">操作</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div class="alert alert-info mt16"><span class="ico">i</span>
          <div>文章训练流程：完整听文章 → 逐句训练 → 训练总结。每个句子的播放、查看中文、跟读确认都单独落库，
            <b>刷新后可继续未完成任务</b>。文章训练<b>不会直接改变单词掌握状态</b>。</div></div>
      </div>
    </div>`;
}

/* ---------- 第一阶段：完整听 ---------- */
function renderListen() {
  const sents = task.sentences;
  setTop('第一阶段 · 完整听文章', task.articleName, '1 / 3', '阶段');
  el().innerHTML = `
    <div class="steps mb16" style="justify-content:center;max-width:520px;margin:0 auto 16px">
      <div class="step on"><span class="dot">1</span>完整听</div>
      <div class="step-line"></div>
      <div class="step"><span class="dot">2</span>逐句训练</div>
      <div class="step-line"></div>
      <div class="step"><span class="dot">3</span>总结</div>
    </div>

    <div class="word-card" style="min-height:220px">
      <div style="font-size:12px;color:var(--text-3);letter-spacing:.08em">FULL ARTICLE</div>
      <div style="font-size:24px;font-weight:600;line-height:1.4">${task.articleName}</div>
      <div class="wc-ph">共 ${sents.length} 句 · 任务 ${task.id}</div>
      <div class="mt16 flex gap8" style="justify-content:center">
        <button class="audio-btn" data-label="▶ 播放完整音频"
          onclick="playFull(this)">▶ 播放完整音频</button>
      </div>
      ${task.audioDone ? '<div class="tag tag-green mt12">已完整播放并记录</div>' : ''}
    </div>

    <div class="alert alert-info mt16"><span class="ico">i</span>
      <div>先让孩子完整听一遍，不要求跟读。播放动作会写入任务（完整音频是否完成），刷新后不会丢失。</div></div>

    <div class="flex jcb mt16">
      <button class="btn btn-ghost" onclick="stage='select';task=null;render()">← 重新选文章</button>
      <button class="btn btn-primary btn-lg" onclick="confirmListen()">确认听完，进入逐句训练 →</button>
    </div>`;
}

function playFull(btn) {
  const all = task.sentences.map(s => s.en).join(' ');
  Proto.playAudio(btn, all);
  try {
    Store.setArticleAudioDone(task.id, true);
    task = Store.articleTask(task.id);
  } catch (e) { Proto.toast(e.message, 'err'); return; }
  Proto.toast('已记录：完整音频播放完成', 'ok');
  render();
}

function confirmListen() {
  try {
    Store.setArticleAudioDone(task.id, true);
    task = Store.articleTask(task.id);
  } catch (e) { Proto.toast(e.message, 'err'); return; }
  stage = 'sentence';
  const d = Store.articleTaskDetails(task.id);
  si = Math.max(d.findIndex(x => !x.readDone), 0);
  revealed = false;
  render();
}

/* ---------- 第二阶段：逐句 ---------- */
function renderSentence() {
  const d = Store.articleTaskDetails(task.id);
  const cur = d[si];
  if (!cur) { stage = 'summary'; render(); return; }
  const doneCount = d.filter(x => x.readDone).length;
  setTop('第二阶段 · 逐句训练', task.articleName, `${si + 1} / ${d.length}`, '句子');

  el().innerHTML = `
    <div class="steps mb16" style="max-width:520px;margin:0 auto 16px">
      <div class="step done"><span class="dot">✓</span>完整听</div>
      <div class="step-line"></div>
      <div class="step on"><span class="dot">2</span>逐句训练</div>
      <div class="step-line"></div>
      <div class="step"><span class="dot">3</span>总结</div>
    </div>

    <div class="flex jcb aic mb12">
      <span class="tag tag-blue nodot">第 ${cur.seq} 句 / 共 ${d.length} 句</span>
      <span class="small muted">已完成 ${doneCount} / ${d.length} · 任务 ${task.id}</span>
    </div>

    <div class="word-card">
      <div class="wc-en" style="font-size:27px;line-height:1.5">${cur.en}</div>
      <div class="wc-cn ${revealed ? '' : 'answer-hide'}" style="font-size:17px;margin-top:4px">${cur.cn || ''}</div>
      <div class="mt16 flex gap8" style="justify-content:center">
        <button class="audio-btn" data-label="${cur.audioPlayed ? '▶ 再播放一次' : '▶ 播放本句'}"
          onclick="playSentence(this)">${cur.audioPlayed ? '▶ 再播放一次' : '▶ 播放本句'}</button>
        ${revealed ? '' : `<button class="btn btn-sm" onclick="viewCn()">显示中文</button>`}
      </div>
      <div class="mt12 small muted">
        记录：${cur.audioPlayed ? '已播放音频' : '未播放'} · ${cur.cnViewed ? '已查看中文' : '未查看中文'}
        ${cur.readDone ? ' · 跟读已确认' : ' · 跟读未确认'}
        ${cur.at ? ' · 最后操作 ' + cur.at.slice(11) : ''}
      </div>
    </div>

    <div class="judge-row" style="grid-template-columns:repeat(3,1fr)">
      <button class="judge" onclick="prevS()">← 上一句</button>
      <button class="judge" onclick="markSentence('待加强')">跟读待加强</button>
      <button class="judge yes" onclick="markSentence('通过')">本句完成 ✓</button>
    </div>

    <div class="flex jcb mt16">
      <span class="small muted">${cur.readDone ? '本句已确认，可继续或返回修改' : '未确认的句子不会被静默跳过'}</span>
      <button class="btn btn-sm" onclick="nextS()">跳过，下一句 →</button>
    </div>

    <div class="mini-words mt16">
      ${d.map((x, i) => `<span class="mini-word ${x.readDone ? 'ok' : ''}"
        style="cursor:pointer;${i === si ? 'outline:2px solid var(--primary);outline-offset:1px' : ''}"
        onclick="jump(${i})" title="${x.teacherConfirm || (x.readDone ? '已完成' : '未完成')}">${i + 1}</span>`).join('')}
    </div>`;
}

function log(patch, tip) {
  const d = Store.articleTaskDetails(task.id);
  const cur = d[si];
  try {
    Store.articleSentenceLog(task.id, cur.sentenceId, patch);
  } catch (e) { Proto.toast(e.message, 'err'); return false; }
  if (tip) Proto.toast(tip, 'ok');
  return true;
}

function playSentence(btn) {
  const d = Store.articleTaskDetails(task.id);
  Proto.playAudio(btn, d[si].en);
  if (log({ audioPlayed: true })) render();
}

function viewCn() {
  revealed = true;
  log({ cnViewed: true });
  render();
}

function markSentence(state) {
  if (!log({ readDone: true, teacherConfirm: state }, '已记录：第 ' + Store.articleTaskDetails(task.id)[si].seq + ' 句 ' + state)) return;
  nextS();
}

function jump(i) { si = i; revealed = false; render(); }
function prevS() { if (si > 0) { si--; revealed = false; render(); } }
function nextS() {
  const d = Store.articleTaskDetails(task.id);
  if (si < d.length - 1) { si++; revealed = false; render(); }
  else { stage = 'summary'; render(); }
}

/* ---------- 第三阶段：总结 ---------- */
function renderSummary() {
  const d = Store.articleTaskDetails(task.id);
  const done = d.filter(x => x.readDone).length;
  const rest = d.length - done;
  setTop('第三阶段 · 训练总结', task.articleName, '3 / 3', '阶段');

  el().innerHTML = `
    <div class="steps mb16" style="justify-content:center;max-width:520px;margin:0 auto 16px">
      <div class="step done"><span class="dot">✓</span>完整听</div>
      <div class="step-line"></div>
      <div class="step done"><span class="dot">✓</span>逐句训练</div>
      <div class="step-line"></div>
      <div class="step on"><span class="dot">3</span>总结</div>
    </div>

    <div class="card">
      <div class="card-head"><div class="card-title">训练总结</div>
        <span class="tag ${rest === 0 ? 'tag-green' : 'tag-amber'} nodot">
          ${rest === 0 ? '全部完成' : '部分完成'}</span></div>
      <div class="card-body">
        <div class="grid g4 mb16">
          <div class="card stat"><div class="stat-label">文章总句数</div><div class="stat-value">${d.length}</div></div>
          <div class="card stat"><div class="stat-label">已完成句数</div>
            <div class="stat-value" style="color:var(--success)">${done}</div></div>
          <div class="card stat"><div class="stat-label">未完成句数</div>
            <div class="stat-value" style="color:${rest ? 'var(--warning)' : 'var(--text-3)'}">${rest}</div></div>
          <div class="card stat"><div class="stat-label">完整音频</div>
            <div class="stat-value" style="font-size:16px;color:${task.audioDone ? 'var(--success)' : 'var(--text-3)'}">
              ${task.audioDone ? '已听完' : '未完成'}</div></div>
        </div>

        <div class="table-wrap mb16">
          <table class="table compact">
            <thead><tr><th>#</th><th>句子</th><th>播放</th><th>看中文</th><th>跟读</th><th>教师确认</th></tr></thead>
            <tbody>${d.map(x => `<tr>
              <td class="mono small">${x.seq}</td>
              <td class="small">${x.en}</td>
              <td class="small">${x.audioPlayed ? '✓' : '—'}</td>
              <td class="small">${x.cnViewed ? '✓' : '—'}</td>
              <td class="small">${x.readDone ? '✓' : '—'}</td>
              <td class="small">${x.teacherConfirm || '<span class="muted">—</span>'}</td>
            </tr>`).join('')}</tbody>
          </table>
        </div>

        <div class="form-grid g1">
          <div class="field"><label>教师评价</label>
            <textarea class="textarea" id="evalBox" placeholder="例如：听读较流畅，第 3、6 句连读需加强">${task.evaluation || ''}</textarea></div>
          <div class="field"><label>备注</label>
            <textarea class="textarea" id="noteBox" placeholder="选填，仅教师与教务可见">${task.note || ''}</textarea></div>
        </div>

        <div class="alert alert-info mt16"><span class="ico">i</span>
          <div>保存内容：学员 / 文章 / 教师 / 课程（可为空）/ 开始与完成时间 / 完整音频是否完成 /
            总句数与完成句数 / 每句的播放·查看中文·跟读·教师确认 / 教师评价 / 任务状态。
            <b>不改变单词掌握状态。</b></div></div>

        <div class="flex gap8 mt16" style="justify-content:flex-end">
          <button class="btn" onclick="stage='sentence';render()">返回逐句</button>
          <button class="btn btn-primary" onclick="saveAll()">保存并返回档案</button>
        </div>
      </div>
    </div>`;
}

function saveAll() {
  if (task.status !== '进行中') { Proto.toast('该任务已结束，不能重复提交', 'warn'); location.href = 'student-profile.html?student=' + studentId; return; }
  const ev = (document.getElementById('evalBox') || {}).value || '';
  const nt = (document.getElementById('noteBox') || {}).value || '';
  let r;
  try {
    r = Store.finishArticleTask(task.id, { evaluation: ev, note: nt });
  } catch (e) { Proto.toast(e.message, 'err'); return; }
  if (!r.ok) { Proto.toast(r.reason, 'err'); return; }
  Proto.toast(`已保存：${r.done} / ${r.total} 句，任务状态「${r.task.status}」`, 'ok');
  setTimeout(() => location.href = 'student-profile.html?student=' + studentId, 600);
}

/* ---------- 提前结束 ---------- */
function openEnd() {
  if (!task || task.status !== '进行中') { Proto.toast('当前没有进行中的文章训练', 'warn'); return; }
  document.getElementById('endReason').value = '';
  document.getElementById('endEval').value = '';
  Proto.openModal('endModal');
}

function doEnd() {
  const reason = document.getElementById('endReason').value;
  if (!reason) { Proto.toast('请选择结束原因', 'err'); return; }
  const ev = document.getElementById('endEval').value.trim();
  let r;
  try {
    r = Store.finishArticleTask(task.id, { endReason: reason, evaluation: ev });
  } catch (e) { Proto.toast(e.message, 'err'); return; }
  Proto.closeModal('endModal');
  Proto.toast(`已结束并保存：${r.done} / ${r.total} 句，未完成句子保持未完成`, 'ok');
  stage = 'summary';
  render();
}

function pick(id) {
  const a = ARTICLES.filter(x => x.id === id)[0];
  if (a) startWith(a);
}

window.startWith = startWith;
boot();
</script>
</body>
</html>
