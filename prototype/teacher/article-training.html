<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章训练</title>
<link rel="stylesheet" href="../assets/css/common.css">
</head>
<body class="focus-page">

<div class="focus-top">
  <a class="btn btn-sm" href="student-profile.html">← 退出</a>
  <div>
    <div class="ft-title" id="topTitle">文章训练 · 陈可欣</div>
    <div class="ft-sub" id="topSub">请选择本次训练的文章</div>
  </div>
  <div class="grow"></div>
  <div class="text-r" style="margin-right:12px">
    <div class="small muted" id="progLabel">阶段</div>
    <div style="font-size:15px;font-weight:600" id="prog">1 / 3</div>
  </div>
</div>

<div class="focus-main">
  <div class="focus-wrap" id="stage"></div>
</div>

<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script>
const SENT = DB.sentences;
const S = {
  stage: 'select',     // select | listen | sentence | summary
  si: 0,               // 当前句索引
  done: {},            // 句索引 -> true
  revealed: false,
  article: null,
  listened: false,
};
const el = () => document.getElementById('stage');

function setTop(t, s, p, label) {
  document.getElementById('topTitle').textContent = t;
  document.getElementById('topSub').textContent = s;
  document.getElementById('prog').textContent = p;
  document.getElementById('progLabel').textContent = label;
}

function render() {
  if (S.stage === 'select') renderSelect();
  else if (S.stage === 'listen') renderListen();
  else if (S.stage === 'sentence') renderSentence();
  else renderSummary();
}

/* ---------- 选择文章 ---------- */
function renderSelect() {
  setTop('文章训练 · 陈可欣', '请选择本次训练的文章', '—', '阶段');
  el().innerHTML = `
    <div class="card">
      <div class="card-head"><div class="card-title">选择文章</div>
        <span class="small muted">教材版本 / 年级 / 学期 / 单元 / 文章</span></div>
      <div class="card-body">
        <div class="form-grid g3 mb16">
          <div class="field"><label>教材版本</label><select class="select"><option>人教版</option><option>外研版</option></select></div>
          <div class="field"><label>年级</label><select class="select"><option>七年级</option><option>五年级</option></select></div>
          <div class="field"><label>单元</label><select class="select"><option>Unit 1</option><option>Unit 2</option></select></div>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>文章名称</th><th>教材 / 单元</th><th class="right">句子数量</th><th>完整音频</th>
              <th class="right">历史训练</th><th>最近训练</th><th style="width:110px">操作</th></tr></thead>
            <tbody>
              <tr><td class="strong">My First Day at School</td><td class="small">人教版 / Unit 1</td>
                <td class="right mono">8</td><td><span class="tag tag-green nodot">已就绪</span></td>
                <td class="right mono">4</td><td class="small muted">2026-11-02</td>
                <td><button class="btn-link" onclick="pick('My First Day at School')">选择</button></td></tr>
              <tr><td class="strong">A Trip to the Library</td><td class="small">人教版 / Unit 2</td>
                <td class="right mono">6</td><td><span class="tag tag-amber nodot">部分缺失</span></td>
                <td class="right mono">3</td><td class="small muted">2026-10-30</td>
                <td><button class="btn-link" onclick="Proto.toast('该文章有 2 句缺少音频，训练时会提示资源异常','warn')">选择</button></td></tr>
              <tr><td class="strong">The Four Seasons</td><td class="small">外研版 / Module 1</td>
                <td class="right mono">7</td><td><span class="tag tag-green nodot">已就绪</span></td>
                <td class="right mono">2</td><td class="small muted">2026-10-18</td>
                <td><button class="btn-link" onclick="pick('The Four Seasons')">选择</button></td></tr>
            </tbody>
          </table>
        </div>
        <div class="alert alert-info mt16"><span class="ico">i</span>
          <div>文章训练流程：完整听文章 → 逐句训练 → 训练总结。文章训练<b>不会直接改变单词掌握状态</b>。</div></div>
      </div>
    </div>`;
}

function pick(name) {
  S.article = name;
  S.stage = 'listen';
  S.listened = false;
  S.done = {};
  S.si = 0;
  render();
}

/* ---------- 第一阶段：完整听 ---------- */
function renderListen() {
  setTop('第一阶段 · 完整听文章', S.article, '1 / 3', '阶段');
  el().innerHTML = `
    <div class="steps mb16" style="justify-content:center;max-width:520px;margin:0 auto 16px">
      <div class="step on"><span class="dot">1</span>完整听</div>
      <div class="step-line"></div>
      <div class="step"><span class="dot">2</span>逐句训练</div>
      <div class="step-line"></div>
      <div class="step"><span class="dot">3</span>总结</div>
    </div>

    <div class="word-card" style="min-height:220px">
      <div style="font-size:12px;color:var(--text-3);letter-spacing:.08em">FULL ARTICLE</div>
      <div style="font-size:24px;font-weight:600;line-height:1.4">${S.article}</div>
      <div class="wc-ph">共 ${SENT.length} 句 · 约 55 秒</div>
      <div class="mt16 flex gap8" style="justify-content:center">
        <button class="audio-btn" data-label="▶ 播放完整音频"
          onclick="Proto.playAudio(this, '${SENT.map(s => s.en).join(' ').replace(/'/g, '')}')">▶ 播放完整音频</button>
        <button class="btn btn-sm" onclick="Proto.toast('已从开头重新播放')">重新播放</button>
      </div>
      ${S.listened ? '<div class="tag tag-green mt12">已完整播放</div>' : ''}
    </div>

    <div class="alert alert-info mt16"><span class="ico">i</span>
      <div>先让孩子完整听一遍，不要求跟读。教师确认后可进入逐句训练。</div></div>

    <div class="flex jcb mt16">
      <button class="btn btn-ghost" onclick="S.stage='select';render()">← 重新选文章</button>
      <button class="btn btn-primary btn-lg" onclick="S.listened=true;S.stage='sentence';render()">确认听完，进入逐句训练 →</button>
    </div>`;
}

/* ---------- 第二阶段：逐句 ---------- */
function renderSentence() {
  const s = SENT[S.si];
  const doneCount = Object.keys(S.done).length;
  setTop('第二阶段 · 逐句训练', S.article, `${S.si + 1} / ${SENT.length}`, '句子');

  el().innerHTML = `
    <div class="steps mb16" style="max-width:520px;margin:0 auto 16px">
      <div class="step done"><span class="dot">✓</span>完整听</div>
      <div class="step-line"></div>
      <div class="step on"><span class="dot">2</span>逐句训练</div>
      <div class="step-line"></div>
      <div class="step"><span class="dot">3</span>总结</div>
    </div>

    <div class="flex jcb aic mb12">
      <span class="tag tag-blue nodot">第 ${s.i} 句 / 共 ${SENT.length} 句</span>
      <span class="small muted">已完成 ${doneCount} / ${SENT.length}</span>
    </div>

    <div class="word-card">
      <div class="wc-en" style="font-size:27px;line-height:1.5">${s.en}</div>
      <div class="wc-cn ${S.revealed ? '' : 'answer-hide'}" style="font-size:17px;margin-top:4px">${s.cn}</div>
      <div class="mt16 flex gap8" style="justify-content:center">
        <button class="audio-btn" data-label="▶ 播放本句"
          onclick="Proto.playAudio(this,'${s.en.replace(/'/g, '')}')">▶ 播放本句</button>
        ${S.revealed ? '' : `<button class="btn btn-sm" onclick="S.revealed=true;render()">显示中文</button>`}
      </div>
    </div>

    <div class="judge-row">
      <button class="judge" onclick="prevS()">← 上一句</button>
      <button class="judge yes" onclick="completeS()">本句完成 ✓</button>
    </div>

    <div class="flex jcb mt16">
      <span class="small muted">${S.done[S.si] ? '本句已完成，可继续下一句' : '未完成的句子不会被静默跳过'}</span>
      <button class="btn btn-sm" onclick="nextS()">跳过，下一句 →</button>
    </div>

    <div class="mini-words mt16">
      ${SENT.map((x, i) => `<span class="mini-word ${S.done[i] ? 'ok' : ''}">${i + 1}</span>`).join('')}
    </div>`;
}

function prevS() { if (S.si > 0) { S.si--; S.revealed = false; render(); } }
function nextS() {
  if (S.si < SENT.length - 1) { S.si++; S.revealed = false; render(); }
  else { S.stage = 'summary'; render(); }
}
function completeS() {
  S.done[S.si] = true;
  if (S.si < SENT.length - 1) { S.si++; S.revealed = false; render(); }
  else { S.stage = 'summary'; render(); }
}

/* ---------- 第三阶段：总结 ---------- */
function renderSummary() {
  const done = Object.keys(S.done).length;
  const rest = SENT.length - done;
  setTop('第三阶段 · 训练总结', S.article, '3 / 3', '阶段');

  el().innerHTML = `
    <div class="steps mb16" style="max-width:520px;margin:0 auto 16px">
      <div class="step done"><span class="dot">✓</span>完整听</div>
      <div class="step-line"></div>
      <div class="step done"><span class="dot">✓</span>逐句训练</div>
      <div class="step-line"></div>
      <div class="step on"><span class="dot">3</span>总结</div>
    </div>

    <div class="card">
      <div class="card-head"><div class="card-title">训练总结</div>
        <span class="tag ${rest === 0 ? 'tag-green' : 'tag-amber'} nodot">
          ${rest === 0 ? '全部完成' : '部分完成'}</span></div>
      <div class="card-body">
        <div class="grid g4 mb16">
          <div class="card stat"><div class="stat-label">文章总句数</div><div class="stat-value">${SENT.length}</div></div>
          <div class="card stat"><div class="stat-label">已完成句数</div>
            <div class="stat-value" style="color:var(--success)">${done}</div></div>
          <div class="card stat"><div class="stat-label">未完成句数</div>
            <div class="stat-value" style="color:${rest ? 'var(--warning)' : 'var(--text-3)'}">${rest}</div></div>
          <div class="card stat"><div class="stat-label">完整音频</div>
            <div class="stat-value" style="font-size:16px;color:var(--success)">已听完</div></div>
        </div>

        <div class="form-grid g1">
          <div class="field"><label>教师评价</label>
            <textarea class="textarea">听读较流畅，第 3、6 句连读与 th 发音需加强，建议下节课带读 2 遍。</textarea></div>
          <div class="field"><label>备注</label>
            <textarea class="textarea" placeholder="选填，仅教师与教务可见"></textarea></div>
        </div>

        <div class="alert alert-info mt16"><span class="ico">i</span>
          <div>本次文章训练将保存：学员 / 文章 / 教师 / 训练时间 / 完整音频是否完成 / 每句训练状态 /
            完成句数 / 总句数 / 教师评价 / 课程关联。<b>不改变单词掌握状态</b>。</div></div>

        <div class="flex gap8 mt16" style="justify-content:flex-end">
          <button class="btn" onclick="S.stage='sentence';render()">返回逐句</button>
          <a class="btn btn-primary" href="student-profile.html"
            onclick="Proto.toast('文章训练记录已保存','ok')">保存并返回档案</a>
        </div>
      </div>
    </div>`;
}

render();
</script>
</body>
</html>
