<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>21 天记忆复习执行</title>
<link rel="stylesheet" href="../assets/css/common.css">
</head>
<body class="focus-page">

<div class="focus-top">
  <a class="btn btn-sm" href="memory21.html">← 退出复习</a>
  <div>
    <div class="ft-title">21 天记忆复习 · 陈可欣</div>
    <div class="ft-sub">计划：11 月记忆强化计划 · 第 10 天 · 今日任务 12 个</div>
  </div>
  <div class="grow"></div>
  <div class="text-r" style="margin-right:12px">
    <div class="small muted">复习进度</div>
    <div style="font-size:15px;font-weight:600" id="prog">1 / 12</div>
  </div>
  <button class="btn btn-sm" onclick="Proto.confirmBox('结束复习','已完成结果会保存，未复习单词仍保留在今日任务中。','结束',()=>location.href='memory21.html')">结束</button>
</div>

<div class="focus-main">
  <div class="focus-wrap" id="stage"></div>
</div>

<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script>
const LIST = [
  { en: 'friend', ph: '/frend/', cn: '朋友' },
  { en: 'question', ph: '/ˈkwestʃən/', cn: '问题；询问' },
  { en: 'answer', ph: '/ˈɑːnsə(r)/', cn: '回答；答案' },
  { en: 'library', ph: '/ˈlaɪbrəri/', cn: '图书馆' },
  { en: 'classroom', ph: '/ˈklɑːsruːm/', cn: '教室' },
  { en: 'family', ph: '/ˈfæməli/', cn: '家；家人' },
  { en: 'class', ph: '/klɑːs/', cn: '班级；课' },
  { en: 'look', ph: '/lʊk/', cn: '看；看起来' },
  { en: 'first', ph: '/fɜːst/', cn: '第一的；首先' },
  { en: 'last', ph: '/lɑːst/', cn: '最后的；持续' },
  { en: 'happy', ph: '/ˈhæpi/', cn: '高兴的；快乐的' },
  { en: 'name', ph: '/neɪm/', cn: '名字；命名' },
];

const S = { i: 0, revealed: false, ans: {}, stage: 'run' };
const el = () => document.getElementById('stage');

function render() {
  document.getElementById('prog').textContent = `${Math.min(S.i + 1, LIST.length)} / ${LIST.length}`;
  if (S.stage === 'done') { renderDone(); return; }
  const w = LIST[S.i];

  el().innerHTML = `
    <div class="bar mb16"><i style="width:${(S.i / LIST.length * 100).toFixed(1)}%"></i></div>

    <div class="alert alert-info mb16"><span class="ico">i</span>
      <div>当前处于 <b>21 天记忆复习</b> 体系，本轮任务按计划第 10 天生成。此体系不使用盒子，与莱特纳体系结果互相独立。</div></div>

    <div class="word-card">
      <div class="wc-en">${w.en}</div>
      <div class="wc-ph">${w.ph}</div>
      ${S.revealed ? `<div class="wc-cn">${w.cn}</div>`
        : `<div class="wc-cn muted" style="font-size:14px">（点击「显示答案」查看中文释义）</div>`}
      <div class="mt12">
        <button class="audio-btn" data-label="▶ 播放发音" onclick="Proto.playAudio(this,'${w.en}')">▶ 播放发音</button>
        ${S.revealed ? '' : `<button class="btn btn-sm" style="margin-left:8px" onclick="reveal()">显示答案</button>`}
      </div>
    </div>

    <div class="judge-row">
      <button class="judge no" onclick="ans('no')">不认识 <kbd>1</kbd></button>
      <button class="judge yes" onclick="ans('yes')">认识 <kbd>2</kbd></button>
    </div>

    <div class="flex jcb mt12">
      <button class="btn btn-ghost btn-sm" onclick="prev()">← 上一个</button>
      <div class="small muted">记录：是否认识 / 复习时间 / 教师 / 轮次 / 备注</div>
      <button class="btn btn-ghost btn-sm" onclick="next()">下一个 →</button>
    </div>`;
}

function reveal() { S.revealed = true; render(); }
function prev() { if (S.i > 0) { S.i--; S.revealed = false; render(); } }
function next() { if (S.i < LIST.length - 1) { S.i++; S.revealed = false; render(); } }

function ans(v) {
  S.ans[S.i] = v;
  const w = LIST[S.i];
  Proto.toast(`${w.en}：${v === 'yes' ? '认识' : '不认识'} · 已记录到第 10 天任务`);
  if (S.i < LIST.length - 1) { S.i++; S.revealed = false; render(); }
  else { S.stage = 'done'; render(); }
}

function renderDone() {
  const yes = Object.values(S.ans).filter(v => v === 'yes').length;
  const no = Object.values(S.ans).filter(v => v === 'no').length;

  el().innerHTML = `
    <div class="card">
      <div class="card-head"><div class="card-title">第 10 天复习完成</div>
        <span class="tag tag-green nodot">${LIST.length} 个单词</span></div>
      <div class="card-body">
        <div class="grid g3 mb16">
          <div class="card stat"><div class="stat-label">今日任务</div><div class="stat-value">${LIST.length}</div></div>
          <div class="card stat"><div class="stat-label">认识</div>
            <div class="stat-value" style="color:var(--success)">${yes}</div></div>
          <div class="card stat"><div class="stat-label">不认识</div>
            <div class="stat-value" style="color:var(--danger)">${no}</div></div>
        </div>

        <div class="alert alert-info mb12"><span class="ico">i</span>
          <div>已保存单词级复习结果，并更新第 10 天节点的完成情况。
            后续节点是否因此调整（如答错追加复习）由<b>机构配置</b>决定。</div></div>
        <div class="alert alert-warn mb12"><span class="ico">!</span>
          <div>本次结果<b>不影响莱特纳盒子状态</b>；莱特纳体系的复习计划保持不变。</div></div>

        <div class="progress-summary mb16">
          <div class="flex jcb small mb8"><span>计划整体进度</span><span class="mono">第 10 / 21 天</span></div>
          <div class="bar green"><i style="width:48%"></i></div>
        </div>

        <div class="flex gap8" style="justify-content:flex-end">
          <a class="btn" href="memory21.html">返回计划</a>
          <a class="btn btn-primary" href="student-profile.html">返回学习档案</a>
        </div>
      </div>
    </div>`;
}

document.addEventListener('keydown', e => {
  if (S.stage !== 'run') return;
  if (e.key === '1') ans('no');
  if (e.key === '2') ans('yes');
});

render();
</script>
</body>
</html>
