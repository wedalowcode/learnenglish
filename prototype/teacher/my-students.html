<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的学员</title>
<link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="page">

      <div class="page-head">
        <div>
          <div class="crumb">教学工作台<span class="sep">/</span>我的学员</div>
          <h1 class="page-title">我的学员</h1>
          <div class="page-sub">当前负责 <span id="mineCount">2</span> 名学员 · 教师只能访问被授权的学员 · 待复习数来自统一数据层</div>
        </div>
        <div class="page-actions">
          <div class="flex gap8 aic">
            <input class="input" placeholder="搜索学员姓名" style="width:180px" oninput="render(this.value)">
            <button class="btn" onclick="Proto.toast('已刷新','ok')">刷新</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-body tight">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr><th>学员姓名</th><th>年级</th><th>教材版本</th><th>当前课程</th>
                  <th class="right">剩余课时</th><th>最近上课</th><th>最近学习内容</th>
                  <th class="right">待复习单词</th><th>状态</th><th style="width:260px">操作</th></tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div class="pager"><span>共 <b id="total">2</b> 条</span>
            <div class="pages"><button class="pg" disabled>‹</button><button class="pg on">1</button><button class="pg" disabled>›</button></div>
          </div>
        </div>
      </div>

      <div class="alert alert-info mt16"><span class="ico">i</span>
        <div>教师可查看学员历史记录，<b>但不能删除历史训练记录</b>；教学内容的顺序与范围由教师决定，教务不会强制改变教学进度。</div>
      </div>

    </main>
  </div>
</div>

<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script>
Proto.shell({ role: 'teacher', active: 'my-students' });

function render(kw = '') {
  const mine = DB.students.filter(s => s.teacherName === '李婉' && (!kw || s.name.includes(kw)));
  document.getElementById('total').textContent = mine.length;
  const mc = document.getElementById('mineCount');
  if (mc) mc.textContent = DB.students.filter(x => x.teacherName === '李婉').length;

  Proto.renderRows('rows', mine, s => `
    <tr>
      <td class="strong"><a href="student-profile.html">${s.name}</a></td>
      <td>${s.grade}</td>
      <td>${s.book}</td>
      <td class="small">${s.product}</td>
      <td class="right mono" ${s.remain < 10 ? 'style="color:var(--danger);font-weight:600"' : ''}>${s.remain}</td>
      <td class="small muted">${s.lastCourse}</td>
      <td class="small">${s.lastContent}</td>
      <td class="right mono" style="color:var(--warning)">${Store.stats(s.id).review}</td>
      <td><span class="tag tag-green">${s.status}</span></td>
      <td class="ops">
        <a class="btn-link" href="student-profile.html?student=${s.id}">学习档案</a>
        <a class="btn-link" href="word-training-setup.html?student=${s.id}">单词训练</a>
        <a class="btn-link" href="article-training.html">文章训练</a>
        <a class="btn-link" href="leitner.html?student=${s.id}">复习</a>
        <a class="btn-link" href="demand-center.html?tab=wbreq">申请词库</a>
      </td>
    </tr>`, 10, '暂无匹配学员');
}

render();
</script>
</body>
</html>
