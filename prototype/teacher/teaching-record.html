<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教学记录</title>
<link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div>
          <div class="crumb">教学工作台<span class="sep">/</span>教学记录</div>
          <h1 class="page-title">教学记录</h1>
          <div class="page-sub">每节课的教学汇总与家长报告 · 课程状态与报告状态分开管理</div>
        </div>
        <div class="page-actions">
          <select class="select" style="width:160px" id="fStu" onchange="render()">
            <option value="">全部学员</option>
          </select>
          <select class="select" style="width:150px" id="fSt" onchange="render()">
            <option value="">全部报告状态</option>
            <option>未生成</option>
            <option>编辑中</option>
            <option>已提交</option>
            <option>已发布</option>
          </select>
          <a class="btn btn-primary" href="course-workbench.html">去课程工作台</a>
        </div>
      </div>

      <div class="grid g4 mb16" id="statCards"></div>

      <div class="card">
        <div class="card-head"><div class="card-title">教学记录列表</div>
          <span class="small muted">报告状态与课程状态分离：课程完成 ≠ 家长可见</span></div>
        <div class="card-body tight">
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th>课程日期</th><th>学员</th><th>教学汇总</th><th class="right">单词训练</th>
                <th class="right">复习</th><th class="right">文章</th><th>课程状态</th><th>报告状态</th>
                <th style="width:180px">操作</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div class="pager"><span id="count">—</span></div>
        </div>
      </div>

      <div class="card mt16">
        <div class="card-head"><div class="card-title">状态说明</div></div>
        <div class="card-body" style="font-size:12.5px;color:var(--text-2);line-height:1.9">
          <b style="color:var(--text)">课程状态</b>：待上课 → 授课中 → 已完成（中断的教学任务不会让课程状态变形，任务各自记「已中断」）。<br>
          <b style="color:var(--text)">报告状态</b>：未生成 → 编辑中（教师补充评价）→ 已提交（内容定稿）→ 已发布（家长可见）。
          课程完成后报告不会自动公开，必须走完这两步。
        </div>
      </div>

    </main>
  </div>
</div>

<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script>
Proto.shell({ role: 'teacher', active: 'teaching-record' });

const TEACHER = Proto.teacherId();
const RTAG = { '未生成': 'tag-slate', '编辑中': 'tag-amber', '已提交': 'tag-blue', '已发布': 'tag-green' };
const CTAG = { '待上课': 'tag-slate', '授课中': 'tag-blue', '已完成': 'tag-green', '未上课': 'tag-amber', '已取消': 'tag-red' };

/* 学员下拉 */
(function initStu() {
  const sel = document.getElementById('fStu');
  Store.students().filter(s => s.teacher === TEACHER).forEach(s => {
    const o = document.createElement('option');
    o.value = s.id; o.textContent = s.name + ' · ' + s.grade;
    sel.appendChild(o);
  });
})();

function rowsData() {
  const sid = document.getElementById('fStu').value;
  const fst = document.getElementById('fSt').value;
  return Store.coursesOfTeacher(TEACHER).map(c => {
    const rp = Store.reportOfCourse(c.id);
    return { c, rp, st: rp ? rp.status : '未生成' };
  })
    /* 按上课时间倒序：最近的课在最上面 */
    .sort((a, b) => (b.c.date + ' ' + b.c.start).localeCompare(a.c.date + ' ' + a.c.start))
    .filter(r => (!sid || r.c.studentId === sid) && (!fst || r.st === fst));
}

function render() {
  const all = Store.coursesOfTeacher(TEACHER);
  const st = Store.reportStat(TEACHER);
  document.getElementById('statCards').innerHTML = `
    <div class="card stat"><div class="stat-label">我的课程</div>
      <div class="stat-value">${all.length}<small>节</small></div>
      <div class="stat-foot">已完成 ${all.filter(c => c.status === '已完成').length} 节</div></div>
    <div class="card stat"><div class="stat-label">待写报告</div>
      <div class="stat-value" style="color:var(--warning)">${st.draft}<small>份</small></div>
      <div class="stat-foot">编辑中，家长不可见</div></div>
    <div class="card stat"><div class="stat-label">已提交待发布</div>
      <div class="stat-value" style="color:var(--info)">${st.submitted}<small>份</small></div>
      <div class="stat-foot">内容定稿，尚未对家长公开</div></div>
    <div class="card stat"><div class="stat-label">已发布</div>
      <div class="stat-value" style="color:var(--success)">${st.published}<small>份</small></div>
      <div class="stat-foot">家长端已可见</div></div>`;

  const list = rowsData();
  document.getElementById('count').textContent = '共 ' + list.length + ' 条';
  document.getElementById('rows').innerHTML = list.length ? list.map(r => {
    const rec = Store.recordOfCourse(r.c.id);
    const s = rec ? Store.recordView(rec) : null;
    const stu = Store.student(r.c.studentId);
    return `<tr>
      <td class="small mono">${r.c.date} ${r.c.start}</td>
      <td class="strong"><a href="student-profile.html?student=${r.c.studentId}">${stu ? stu.name : r.c.student}</a></td>
      <td class="small">${r.rp ? r.rp.title : (r.c.subject || '一对一课程')}</td>
      <td class="right mono">${s ? s.trainWords : '—'}</td>
      <td class="right mono">${s ? (s.leitnerWords + s.plan21Words) : '—'}</td>
      <td class="right mono">${s ? s.articleSentences : '—'}</td>
      <td><span class="tag ${CTAG[r.c.status]} nodot">${r.c.status}</span></td>
      <td><span class="tag ${RTAG[r.st]} nodot">${r.st}</span></td>
      <td class="ops">
        ${r.rp ? `<a class="btn-link" href="course-report.html?report=${r.rp.id}">${r.st === '编辑中' ? '写报告' : '查看'}</a>` : ''}
        ${r.rp && r.st === '已提交' ? `<a class="btn-link" href="course-report.html?report=${r.rp.id}">发布</a>` : ''}
        ${r.st === '已发布' ? `<a class="btn-link" href="../parent/report.html?student=${r.c.studentId}&report=${r.rp.id}">家长视角</a>` : ''}
        <a class="btn-link" href="course-workbench.html?course=${r.c.id}">课程</a>
      </td>
    </tr>`;
  }).join('') : '<tr><td colspan="9" class="empty">没有符合条件的教学记录</td></tr>';
}

render();
</script>
</body>
</html>
