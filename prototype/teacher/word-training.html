<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>单词训练</title>
<link rel="stylesheet" href="../assets/css/common.css">
<style>
  .fjudge { border:1px solid var(--border); background:#fff; color:var(--text-2); font-size:12px;
    padding:5px 10px; border-radius:6px; cursor:pointer; margin-right:4px; }
  .fjudge:hover { border-color:var(--primary); color:var(--primary-dark); }
  .fjudge.on-yes { background:#ecfdf5; border-color:#10b981; color:#047857; font-weight:600; }
  .fjudge.on-mid { background:#fffbeb; border-color:#f59e0b; color:#b45309; font-weight:600; }
  .fjudge.on-no { background:#fef2f2; border-color:#ef4444; color:#b91c1c; font-weight:600; }
</style>
</head>
<body class="focus-page">

<div class="focus-top">
  <a class="btn btn-sm" href="word-training-setup.html" id="backLink">← 退出</a>
  <div>
    <div class="ft-title" id="topTitle">单词训练</div>
    <div class="ft-sub" id="topSub">—</div>
  </div>
  <div class="grow"></div>
  <div class="text-r" style="margin-right:12px">
    <div class="small muted" id="topProgLabel">整体进度</div>
    <div style="font-size:15px;font-weight:600" id="topProg">0 / 0</div>
  </div>
  <button class="btn btn-sm" onclick="openPause()">暂停训练</button>
</div>

<div class="focus-main">
  <div class="focus-wrap" id="stage"></div>
</div>

<!-- 暂停 -->
<div class="mask" id="pauseModal">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">暂停训练</div>
      <button class="modal-close" onclick="Proto.closeModal('pauseModal')">×</button></div>
    <div class="modal-body">
      <div class="alert alert-info mb16"><span class="ico">i</span>
        <div>任务会保存为<b>未完成</b>状态，已产生的每个单词判断结果都已单独落库，下次可从词库选择页或本页继续。</div></div>
      <div class="desc g1">
        <div class="desc-item"><span class="k">任务编号</span><span class="v mono" id="pNo">—</span></div>
        <div class="desc-item"><span class="k">本次队列</span><span class="v" id="pQueue">—</span></div>
        <div class="desc-item"><span class="k">已完成判断</span><span class="v" id="pDone">—</span></div>
        <div class="desc-item"><span class="k">恢复方式</span><span class="v">词库选择页「有未完成的训练任务」→ 继续</span></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="Proto.closeModal('pauseModal')">继续训练</button>
      <button class="btn" onclick="saveExit()">保存并退出</button>
      <button class="btn btn-primary" onclick="doPause()">仅暂停</button>
    </div>
  </div>
</div>

<!-- 提前结束 -->
<div class="mask" id="endModal">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">结束本次训练</div>
      <button class="modal-close" onclick="Proto.closeModal('endModal')">×</button></div>
    <div class="modal-body">
      <div class="alert alert-warn mb16"><span class="ico">!</span>
        <div>结束原因<b>必填</b>。任务将标记为<b>已中断</b>，未完成的单词保留为「待强化训练」，不会被静默跳过。</div></div>
      <div class="form-grid g1">
        <div class="field"><label>结束原因 <span class="req">*</span></label>
          <select class="select" id="endReason">
            <option value="">请选择</option>
            <option>课堂时间不足</option>
            <option>学员状态不佳</option>
            <option>临时调整教学内容</option>
            <option>音频/设备异常</option>
            <option>其他</option>
          </select></div>
        <div class="field"><label>补充说明</label><textarea class="textarea" id="endNote" placeholder="选填"></textarea></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="Proto.closeModal('endModal')">取消</button>
      <button class="btn btn-danger" onclick="doEnd()">确认结束</button>
    </div>
  </div>
</div>

<!-- 误判修正 -->
<div class="mask" id="fixModal">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">修正判断结果</div>
      <button class="modal-close" onclick="Proto.closeModal('fixModal')">×</button></div>
    <div class="modal-body">
      <div class="alert alert-info mb16"><span class="ico">i</span>
        <div>修正会<b>追加一条新记录</b>，原始判断记录保留，便于复盘教学偏差。</div></div>
      <div class="desc g1 mb16" id="fixInfo"></div>
      <div class="field mb12"><label>改为 <span class="req">*</span></label>
        <div class="radio-row">
          <label class="radio"><input type="radio" name="fixTo" value="yes"> 认识</label>
          <label class="radio"><input type="radio" name="fixTo" value="no"> 不认识</label>
        </div></div>
      <div class="field"><label>修正原因 <span class="req">*</span></label>
        <input class="input" id="fixNote" placeholder="如：误点 / 学员当时注意力分散 / 教师重复提示"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="Proto.closeModal('fixModal')">取消</button>
      <button class="btn btn-primary" onclick="doFix()">确认修正</button>
    </div>
  </div>
</div>

<!-- 最后一轮复习修正 -->
<div class="mask" id="finalFixModal">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">修正最后一轮复习结果</div>
      <button class="modal-close" onclick="Proto.closeModal('finalFixModal')">×</button></div>
    <div class="modal-body">
      <div class="alert alert-info mb16"><span class="ico">i</span>
        <div>修正会<b>追加修正记录</b>并保留原始判断，当前有效结果以最新一次为准。修正后仍不可重复提交。</div></div>
      <div class="desc g2 mb16">
        <div class="desc-item"><span class="k">单词</span><span class="v strong" id="ff_word">—</span></div>
        <div class="desc-item"><span class="k">原始结果</span><span class="v" id="ff_from">—</span></div>
      </div>
      <div class="field mb12"><label>改为 <span class="req">*</span></label>
        <div class="radio-row">
          <label class="radio"><input type="radio" name="ffRes" value="yes"> 认识</label>
          <label class="radio"><input type="radio" name="ffRes" value="mid"> 暂不确定</label>
          <label class="radio"><input type="radio" name="ffRes" value="no"> 不认识</label>
        </div></div>
      <div class="field"><label>修正原因 <span class="req">*</span></label>
        <input class="input" id="ff_note" placeholder="如：误点 / 学员当时注意力分散 / 教师重复提示"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="Proto.closeModal('finalFixModal')">取消</button>
      <button class="btn btn-primary" onclick="doFinalFix()">确认修正</button>
    </div>
  </div>
</div>

<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script>
const params = new URLSearchParams(location.search);
const courseId = params.get('course') || '';   // 课程上下文：判断记录会归属到本节课
let task = null, groups = [], ids = [], view = 'group';
let gi = 0, wi = 0, revealed = false, fixTarget = null, submitting = false;

const el = () => document.getElementById('stage');

function boot() {
  const tid = params.get('task');
  task = tid ? Store.trainTask(tid) : Store.activeTask(params.get('student') || 'S2026001');
  if (!task) { location.replace('word-training-setup.html'); return; }
  if (task.status === '预筛选中') { location.replace('word-training-prescreen.html?task=' + task.id); return; }

  ids = task.queueWordIds.slice();
  groups = Store.groupsOfTask(task);
  gi = Math.min(task.groupIndex || 0, Math.max(groups.length - 1, 0));
  wi = Math.min(task.wordIndex || 0, Math.max((groups[gi] || []).length - 1, 0));

  const stu = Store.student(task.studentId);
  document.getElementById('topTitle').textContent = '单词训练 · ' + stu.name;
  document.getElementById('backLink').href = 'word-training-setup.html?student=' + task.studentId;

  // 依据统一状态（status）与阶段（phase）决定进入哪个视图（刷新恢复的关键）
  if (Store.isDone(task.status)) view = 'summary';
  else if (task.status === '已取消') view = 'summary';
  else if (task.status === '已中断') view = 'interrupted';
  else if (task.phase === '最后复习') {
    view = Object.keys(task.finalResults).length >= ids.length ? 'finalDone' : 'final';
  } else if (task.phase === '强化训练') {
    /* 展示循环任务走列表式展示页；历史逐词判断任务保留旧卡片流程 */
    view = task.displayFlow ? 'display' : (allDone(gi) ? 'groupDone' : 'group');
  } else view = allDone(gi) ? 'groupDone' : 'group';

  render();
}

/* ---------- 工具 ---------- */
function curGroup() { return groups[gi] || []; }
function allDone(i) {
  const g = groups[i] || [];
  return g.length > 0 && g.every(id => !!task.results[id]);
}
function allGroupsDone() { return groups.every((g) => g.every(id => task.results[id])); }
function word(id) { return Store.word(id); }
function meanHtml(w) { return w.mean.map(m => `<div><span class="pos">${m.pos}</span> ${m.cn}</div>`).join(''); }

function updateTop() {
  const done = Object.keys(task.results).length;
  const finalDone = Object.keys(task.finalResults).length;
  const sub = document.getElementById('topSub');

  if (view === 'final' || view === 'finalDone') {
    document.getElementById('topTitle').textContent = '最后一轮复习 · ' + Store.student(task.studentId).name;
    sub.textContent = `任务 ${task.id} · 本次队列 ${ids.length} 个单词 · 不直接显示答案`;
    document.getElementById('topProgLabel').textContent = '最后复习进度';
    document.getElementById('topProg').textContent = finalDone + ' / ' + ids.length;
  } else if (view === 'display') {
    const st2 = Store.displayStat(task.id) || { total: 0, done: 0, groupIndex: 0, groupCount: 0 };
    document.getElementById('topTitle').textContent = '强化训练 · ' + Store.student(task.studentId).name;
    sub.textContent = `任务 ${task.id} · 第 ${st2.groupIndex + 1} / ${st2.groupCount} 组 · 每组最多 5 个单词`;
    document.getElementById('topProgLabel').textContent = '强化展示进度';
    document.getElementById('topProg').textContent = st2.done + ' / ' + st2.total;
  } else if (view === 'summary') {
    document.getElementById('topTitle').textContent = '训练已提交 · ' + Store.student(task.studentId).name;
    sub.textContent = `任务 ${task.id} · 已完成`;
    document.getElementById('topProgLabel').textContent = '最后复习';
    document.getElementById('topProg').textContent = ids.length + ' / ' + ids.length;
  } else {
    document.getElementById('topTitle').textContent = '单词训练 · ' + Store.student(task.studentId).name;
    sub.textContent = `${task.wordbookName} · 任务 ${task.id} · 第 ${gi + 1} / ${groups.length} 组`;
    document.getElementById('topProgLabel').textContent = '整体进度';
    document.getElementById('topProg').textContent = done + ' / ' + ids.length;
  }
}

function dotsHtml() {
  return groups.map((g, i) => {
    const d = g.every(id => task.results[id]);
    const cls = d ? 'done' : (i === gi && view !== 'final' && view !== 'summary') ? 'cur' : '';
    return `<span class="gdot ${cls}">${i + 1}</span>`;
  }).join('');
}

function render() {
  updateTop();
  if (view === 'display') renderDisplay();
  else if (view === 'group') renderGroup();
  else if (view === 'groupDone') renderGroupDone();
  else if (view === 'final') renderFinal();
  else if (view === 'finalDone') renderFinalDone();
  else if (view === 'interrupted') renderInterrupted();
  else renderSummary();
}

/* ---------- 强化训练：列表式展示循环 ----------
   每组最多5词，每词独立走 displayStep 0→1→2→3（英文→中文→隐藏→本轮完成）。
   进度完全来自 Store.displayStat() 持久化的 trainDisplays，
   不在此维护与 Store 不一致的副本，也不调用旧版 trainJudge。 */
function renderDisplay() {
  let st;
  try { st = Store.displayStat(task.id); }
  catch (e) { Proto.toast(e.message, 'err'); return; }
  if (!st || !st.groupCount) {
    el().innerHTML = `<div class="card"><div class="card-body"><div class="small muted">本次任务还没有训练队列。</div></div></div>`;
    return;
  }
  const g = st.currentGroup || { words: [], total: 0, done: 0, allDone: false };
  const lastGroup = st.groupIndex === st.groupCount - 1;

  const dots = Array.from({ length: st.groupCount }, (_, i) =>
    `<span class="gdot ${i < st.groupIndex ? 'done' : ''} ${i === st.groupIndex ? 'cur' : ''}">${i + 1}</span>`).join('');

  const rows = g.words.map(wt => {
    const w = Store.word(wt.id);
    const s = wt.step || 0;
    const en = (s >= 1 && s <= 2) ? (w ? w.en : wt.id) : '';
    const ph = (s >= 1 && s <= 2) ? (w ? w.ph : '') : '';
    const cn = (s === 2) ? (w ? w.mean.map(m => `${m.pos} ${m.cn}`).join('；') : '') : '';
    const status = s >= 3
      ? '<span class="tag tag-green nodot">已完成</span>'
      : `<span class="tag tag-slate nodot">${['未开始', '显示英文', '显示中文'][s] || '未开始'}</span>`;
    const btn = s >= 3 ? ''
      : `<button class="btn btn-sm btn-primary" onclick="tap('${wt.id}')">${['显示英文', '显示中文', '隐藏'][s]}</button>`;
    return `<tr>
      <td style="font-weight:600">${en || '<span class="muted">———</span>'}</td>
      <td style="color:#475569;font-family:'Times New Roman',serif">${ph || '—'}</td>
      <td style="color:#475569">${cn || (s === 3 ? '' : '<span class="muted">———</span>')}</td>
      <td class="nowrap">
        ${btn}
        ${s >= 3 ? '' : `<button class="btn btn-sm" style="margin-left:4px" title="播放发音" onclick="playWord(this,'${wt.id}')">🔊</button>
        <button class="btn btn-sm ${wt.needsReinforce ? 'btn-danger' : ''}" style="margin-left:4px" onclick="reinforce('${wt.id}')">${wt.needsReinforce ? '已标强化' : '标强化'}</button>`}
      </td>
      <td>${status}</td>
    </tr>`;
  }).join('');

  el().innerHTML = `
    <div class="flex jcb aic mb12">
      <div class="group-dots">${dots}</div>
      <div class="small muted">第 ${st.groupIndex + 1} / ${st.groupCount} 组 · 已完成 ${st.done} / ${st.total} 个单词</div>
    </div>
    <div class="alert alert-info mb12"><span class="ico">i</span>
      <div>强化训练为<b>带读展示</b>：每个单词独立完成「显示英文 → 显示中文 → 隐藏」三步即完成本轮，
        单次完成不代表掌握，最终掌握由「最后一轮复习」判断。</div></div>
    <div class="card" style="padding:0">
      <div class="table-wrap" style="margin:0">
        <table class="table compact">
          <thead><tr><th>单词</th><th>音标</th><th>中文释义</th><th style="width:120px">展示操作</th><th style="width:110px">状态</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="flex jcb aic mt12" style="padding:12px 14px">
        <button class="btn btn-ghost btn-sm" onclick="Proto.openModal('endModal')">结束本次训练</button>
        ${st.currentComplete
          ? (lastGroup
              ? `<button class="btn btn-primary btn-lg" onclick="goFinal()">全部单词展示完成 → 进入最后一轮复习</button>`
              : `<button class="btn btn-primary btn-lg" onclick="nextDisplayGroup(${st.groupIndex + 1})">第 ${st.groupIndex + 2} 组 →</button>`)
          : '<span class="small muted">完成本组全部单词后可进入下一组</span>'}
      </div>
    </div>`;
}

function tap(wordId) {
  try { Store.trainDisplayTap(task.id, wordId); }
  catch (e) { Proto.toast(e.message, 'err'); }
  render();
}

function playWord(btn, wordId) {
  const w = word(wordId);
  if (w) Proto.playAudio(btn, w.en, 'en-US');
}
function reinforce(wordId) {
  const d = Store.trainDisplayOf(task.id, wordId);
  const next = !(d && d.needsReinforce);
  try { Store.markTrainReinforce(task.id, wordId, next); }
  catch (e) { Proto.toast(e.message, 'err'); return; }
  Proto.toast(next ? '已标记需要强化（可反复带读）' : '已取消强化标记', next ? 'ok' : 'warn');
  render();
}

function nextDisplayGroup(index) {
  try { Store.setTrainGroup(task.id, index); }
  catch (e) { Proto.toast(e.message, 'err'); return; }
  render();
}

function goFinal() {
  const r = Store.toFinalStage(task.id);
  if (!r.ok) { Proto.toast(r.reason || '还有单词未完成展示', 'err'); render(); return; }
  task = Store.trainTask(task.id);
  view = 'final';
  Proto.toast('全部单词展示完成，进入最后一轮复习', 'ok');
  render();
}

/* ---------- 分组训练（历史逐词判断任务，旧流程保留） ---------- */
function renderGroup() {
  const g = curGroup();
  const id = g[wi];
  if (!id) { view = 'groupDone'; render(); return; }
  const w = word(id);
  const inGroupDone = g.filter(x => task.results[x]).length;

  let front, back;
  if (task.mode === 'cn2en') {
    front = `<div class="wc-cn" style="font-size:22px">${meanHtml(w)}</div>`;
    back = revealed ? `<div class="wc-en">${w.en}</div><div class="wc-ph">${w.ph}</div>`
      : `<div class="wc-en muted" style="font-size:15px">（点击「显示答案」查看英文）</div>`;
  } else if (task.mode === 'listen') {
    front = `<div class="wc-en" style="font-size:22px;color:var(--text-3)">♪ 听发音判断</div>`;
    back = revealed ? `<div class="wc-en">${w.en}</div><div class="wc-ph">${w.ph}</div><div class="wc-cn">${meanHtml(w)}</div>`
      : `<div class="wc-en muted" style="font-size:15px">（聆听发音后判断，需要时显示答案）</div>`;
  } else {
    front = `<div class="wc-en">${w.en}</div><div class="wc-ph">${w.ph}</div>`;
    back = revealed ? `<div class="wc-cn">${meanHtml(w)}</div>`
      : `<div class="wc-cn muted" style="font-size:14px">（点击「显示答案」查看中文释义）</div>`;
  }

  const cur = task.results[id];
  el().innerHTML = `
    <div class="flex jcb aic mb12">
      <div class="group-dots">${dotsHtml()}</div>
      <div class="small muted">第 ${gi + 1} 组 · 本组 ${inGroupDone} / ${g.length} 已完成
        ${cur && cur.corrected ? ' · <span class="tag tag-amber nodot">已修正</span>' : ''}</div>
    </div>

    <div class="word-card">
      ${front}${back}
      <div class="mt12">
        <button class="audio-btn" data-label="▶ 播放发音" onclick="Proto.playAudio(this,'${w.en}')">▶ 播放发音</button>
        ${revealed ? '' : `<button class="btn btn-sm" style="margin-left:8px" onclick="reveal()">显示答案</button>`}
      </div>
    </div>

    <div class="flex jcb aic mt16">
      <div class="pill-tabs">
        <button class="pill-tab ${task.mode === 'en2cn' ? 'on' : ''}" onclick="setMode('en2cn')">看英文 · 理解中文</button>
        <button class="pill-tab ${task.mode === 'cn2en' ? 'on' : ''}" onclick="setMode('cn2en')">看中文 · 回忆英文</button>
        <button class="pill-tab ${task.mode === 'listen' ? 'on' : ''}" onclick="setMode('listen')">听发音 · 识别单词</button>
      </div>
      <button class="btn btn-sm btn-ghost" onclick="Proto.openModal('endModal')">结束本次训练</button>
    </div>

    <div class="judge-row">
      <button class="judge no" onclick="judge('no')">不认识 <kbd>1</kbd></button>
      <button class="judge yes" onclick="judge('yes')">认识 <kbd>2</kbd></button>
    </div>

    <div class="flex jcb mt12">
      <button class="btn btn-ghost btn-sm" onclick="move(-1)">← 上一个</button>
      <div class="small muted">点击下方已判断的单词可<b>修正</b>（追加记录，不覆盖原始）</div>
      <button class="btn btn-ghost btn-sm" onclick="move(1)">下一个 →</button>
    </div>

    <div class="mini-words mt16">
      ${g.map((x, i) => {
        const r = task.results[x];
        const cls = r ? (r.result === 'yes' ? 'ok' : 'no') : '';
        return `<span class="mini-word ${cls}" style="cursor:${r ? 'pointer' : 'default'};${i === wi ? 'outline:2px solid var(--primary);outline-offset:1px' : ''}"
          onclick="${r ? `openFix('${x}')` : `jump(${i})`}" title="${r ? '已判断：' + (r.result === 'yes' ? '认识' : '不认识') + '（点击修正）' : '未判断'}">${word(x).en}</span>`;
      }).join('')}
    </div>`;
}

function setMode(m) { task = Store.setTaskPos(task.id, { mode: m }); revealed = false; render(); }
function reveal() { revealed = true; render(); }
function jump(i) { wi = i; revealed = false; Store.setTaskPos(task.id, { wordIndex: wi }); render(); }
function move(d) {
  const n = wi + d;
  if (n < 0 || n >= curGroup().length) return;
  wi = n; revealed = false;
  Store.setTaskPos(task.id, { wordIndex: wi });
  render();
}

function judge(v) {
  const id = curGroup()[wi];
  try {
    Store.trainJudge(task.id, id, v, task.mode, gi, courseId);
  } catch (e) {
    Proto.toast(e.message, 'err');
    task = Store.trainTask(task.id);
    render();
    return;
  }
  task = Store.trainTask(task.id);

  if (allDone(gi)) {
    view = 'groupDone';
    Store.setTaskPos(task.id, { groupIndex: gi, wordIndex: wi });
    render();
    return;
  }
  const firstEmpty = curGroup().findIndex(x => !task.results[x]);
  if (firstEmpty >= 0) wi = firstEmpty;
  revealed = false;
  Store.setTaskPos(task.id, { groupIndex: gi, wordIndex: wi });
  render();
}

/* ---------- 本组完成 ---------- */
function renderGroupDone() {
  const g = curGroup();
  const yes = g.filter(id => task.results[id] && task.results[id].result === 'yes').length;
  const no = g.length - yes;
  const isLast = gi === groups.length - 1 && allGroupsDone();

  el().innerHTML = `
    <div class="flex jcb aic mb12">
      <div class="group-dots">${dotsHtml()}</div>
      <div class="small muted">第 ${gi + 1} / ${groups.length} 组</div>
    </div>

    <div class="card">
      <div class="card-head"><div class="card-title">第 ${gi + 1} 组训练完成</div>
        <span class="tag tag-green nodot">${g.length} / ${g.length}</span></div>
      <div class="card-body">
        <div class="grid g3 mb16">
          <div class="card stat"><div class="stat-label">本组单词</div><div class="stat-value">${g.length}</div>
            <div class="stat-foot">每组最多 5 个</div></div>
          <div class="card stat"><div class="stat-label">认识</div>
            <div class="stat-value" style="color:var(--success)">${yes}</div></div>
          <div class="card stat"><div class="stat-label">不认识</div>
            <div class="stat-value" style="color:var(--danger)">${no}</div></div>
        </div>

        <div class="mini-words mb16">
          ${g.map(id => {
            const r = task.results[id];
            return `<span class="mini-word ${r.result === 'yes' ? 'ok' : 'no'}" style="cursor:pointer"
              onclick="openFix('${id}')" title="点击修正">${word(id).en}</span>`;
          }).join('')}
        </div>

        <div class="alert alert-info"><span class="ico">i</span>
          <div>每个单词的判断已单独记录（任务 / 学员 / 单词 / 组别 / 模式 / 结果 / 时间 / 教师 / 轮次）。
            未判断的单词不会被跳过进入下一组。</div></div>

        <div class="flex gap8 mt16" style="justify-content:flex-end">
          <button class="btn" onclick="Proto.openModal('endModal')">结束本次训练</button>
          <button class="btn btn-primary btn-lg" onclick="nextGroup()">
            ${isLast ? '进入最后一轮复习 →' : `继续第 ${gi + 2} 组 →`}</button>
        </div>
      </div>
    </div>`;
}

function nextGroup() {
  if (gi === groups.length - 1) {
    const r = Store.toFinalStage(task.id);
    if (!r.ok) {
      Proto.toast('还有 ' + r.missing.length + ' 个单词未完成判断，不能进入最后一轮复习', 'err');
      const firstMissing = groups.findIndex(g => g.some(id => !task.results[id]));
      if (firstMissing >= 0) { gi = firstMissing; view = 'group'; wi = 0; render(); }
      return;
    }
    task = r.task;
    view = 'final';
    Proto.toast('全部 ' + groups.length + ' 组完成，进入最后一轮复习', 'ok');
  } else {
    gi++;
    wi = 0;
    view = 'group';
    Store.setTaskPos(task.id, { groupIndex: gi, wordIndex: 0 });
  }
  revealed = false;
  render();
}

/* ---------- 最后一轮复习（列表式逐行判断） ---------- */
const FR_TXT = { yes: '掌握', mid: '待加强', no: '未掌握' };
const FR_TONE = { yes: 'green', mid: 'amber', no: 'red' };
function renderFinal() {
  const judgedCount = ids.filter(id => task.finalResults[id]).length;
  const allJudged = judgedCount === ids.length;

  const rows = ids.map(id => {
    const w = word(id);
    const cur = task.finalResults[id];
    const picked = cur ? cur.result : '';
    const btn = res => `<button class="fjudge ${picked === res ? 'on-' + res : ''}"
      onclick="judgeFinalList('${id}','${res}')">${FR_TXT[res]}</button>`;
    const status = cur
      ? `<span class="tag tag-${FR_TONE[cur.result]} nodot">${FR_TXT[cur.result]}${cur.correctedFrom ? ' · 已改' : ''}</span>`
      : '<span class="tag tag-slate nodot">待判断</span>';
    return `<tr>
      <td style="font-weight:600">${w ? w.en : id}</td>
      <td style="color:#475569;font-family:'Times New Roman',serif">${w ? w.ph : ''}</td>
      <td style="color:#475569">${w ? meanHtml(w) : ''}</td>
      <td class="nowrap">${btn('yes')}${btn('mid')}${btn('no')}</td>
      <td>${status}</td>
    </tr>`;
  }).join('');

  el().innerHTML = `
    <div class="alert alert-warn mb16"><span class="ico">!</span>
      <div><b>最后一轮复习：</b>覆盖本次强化训练的 ${ids.length} 个队列单词（初筛认识的单词不在其中）。
        逐行判断<b>掌握 / 待加强 / 未掌握</b>，提交前可随时修改，无需审批；「待加强」「未掌握」按待复习进入后续计划，掌握的不重复安排。</div></div>
    <div class="card" style="padding:0">
      <div class="table-wrap" style="margin:0">
        <table class="table compact">
          <thead><tr><th>单词</th><th>音标</th><th>中文释义</th><th style="width:228px">教师判断</th><th style="width:110px">状态</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="flex jcb aic mt12" style="padding:12px 14px">
        <div class="small muted">已判断 <b>${judgedCount} / ${ids.length}</b></div>
        ${allJudged
          ? `<button class="btn btn-primary btn-lg" onclick="view='finalDone';render()">确认结果并提交 →</button>`
          : '<span class="btn btn-primary btn-lg" style="pointer-events:none;opacity:.5">请完成全部单词判断后提交</span>'}
      </div>
    </div>`;
}

function judgeFinalList(id, res) {
  try { Store.finalJudge(task.id, id, res, courseId); }
  catch (e) { Proto.toast(e.message, 'err'); }
  task = Store.trainTask(task.id);
  render();
}

function finalReveal() { revealed = true; render(); }

/** 最后一轮复习的首次判断（已判断必须走修正） */
function finalJudge(v) {
  const id = ids[task.finalIndex || 0];
  try {
    Store.finalJudge(task.id, id, v, courseId);
  } catch (e) {
    Proto.toast(e.message, 'err');
    task = Store.trainTask(task.id);
    render();
    return;
  }
  task = Store.trainTask(task.id);
  const nextIdx = (task.finalIndex || 0) + 1;
  if (nextIdx < ids.length) {
    task = Store.setTaskPos(task.id, { finalIndex: nextIdx });
    revealed = false;
    render();
  } else {
    const st = Store.trainTaskStat(task.id);
    view = st.finalMissing.length ? 'final' : 'finalDone';
    if (st.finalMissing.length) {
      task = Store.setTaskPos(task.id, { finalIndex: ids.indexOf(st.finalMissing[0]) });
      Proto.toast('还有 ' + st.finalMissing.length + ' 个单词未判断', 'warn');
    }
    render();
  }
}

/** 最后一轮复习修正：必填原因 */
let finalFixTarget = null;
function openFinalFix(wordId) {
  finalFixTarget = wordId;
  const cur = task.finalResults[wordId];
  if (!cur) { Proto.toast('该单词尚无判断记录', 'err'); return; }
  document.getElementById('ff_word').textContent = word(wordId).en;
  document.getElementById('ff_from').textContent =
    cur.result === 'yes' ? '认识' : cur.result === 'mid' ? '暂不确定' : '不认识';
  document.querySelectorAll('input[name=ffRes]').forEach(r => r.checked = false);
  document.getElementById('ff_note').value = '';
  Proto.openModal('finalFixModal');
}

function doFinalFix() {
  const picked = document.querySelector('input[name=ffRes]:checked');
  const note = document.getElementById('ff_note').value.trim();
  if (!picked) { Proto.toast('请选择修正后的结果', 'err'); return; }
  if (!note) { Proto.toast('修正必须填写原因', 'err'); return; }
  try {
    Store.finalCorrect(task.id, finalFixTarget, picked.value, note, courseId);
    Proto.closeModal('finalFixModal');
    Proto.toast('已修正最后一轮复习结果（原始判断保留）', 'ok');
    task = Store.trainTask(task.id);
    finalFixTarget = null;
    view = Store.trainTaskStat(task.id).finalMissing.length ? 'final' : 'finalDone';
    render();
  } catch (e) {
    Proto.toast(e.message, 'err');
  }
}

function finalMove(d) {
  const n = (task.finalIndex || 0) + d;
  if (n < 0 || n >= ids.length) return;
  task = Store.setTaskPos(task.id, { finalIndex: n });
  revealed = false;
  render();
}

function renderFinalDone() {
  const yes = ids.filter(id => task.finalResults[id] && task.finalResults[id].result === 'yes').length;
  const no = ids.filter(id => task.finalResults[id] && task.finalResults[id].result === 'no').length;
  const mid = ids.filter(id => task.finalResults[id] && task.finalResults[id].result === 'mid').length;
  const need = no + mid;

  el().innerHTML = `
    <div class="card">
      <div class="card-head"><div class="card-title">最后一轮复习完成 · 请确认结果</div>
        <span class="tag tag-green nodot">${ids.length} 个队列单词</span></div>
      <div class="card-body">
        <div class="grid g4 mb16">
          <div class="card stat"><div class="stat-label">本次队列</div><div class="stat-value">${ids.length}</div>
            <div class="stat-foot">初筛认识 ${task.knownWordIds.length} 个未进入</div></div>
          <div class="card stat"><div class="stat-label">本次通过</div>
            <div class="stat-value" style="color:var(--success)">${yes}</div></div>
          <div class="card stat"><div class="stat-label">待复习</div>
            <div class="stat-value" style="color:var(--danger)">${no}</div></div>
          <div class="card stat"><div class="stat-label">暂不确定</div>
            <div class="stat-value" style="color:var(--warning)">${mid}</div></div>
        </div>

        <div class="alert alert-info mb16"><span class="ico">i</span>
          <div>「本次通过」<b>不等于永久掌握</b>：学员正式掌握状态与训练任务状态分开保存，一次通过不意味着永远记住。
            「暂不确定」保留待确认状态，不能直接视为掌握。</div></div>

        <div class="section-title">加入复习体系</div>
        ${need === 0 ? `<div class="alert alert-warn mb16"><span class="ico">!</span>
          <div><b>本次没有待复习单词</b>：${yes} 个队列单词全部通过最后复习。
            提交后<b>不会</b>创建空 21 天计划，也<b>不会</b>生成空莱特纳任务，直接完成本次训练。</div></div>` : `
        <div class="alert alert-warn mb16"><span class="ico">!</span>
          <div>加入范围：本次 <b>待复习 ${need} 个</b>（不认识 ${no} + 暂不确定 ${mid}）。
            <b>本次通过</b>的 ${yes} 个单词不加入。<br>
            两套体系是否默认勾选由<b>机构配置</b>决定，此处互不联动，可只选一套或都不选。</div></div>`}

        <div class="field mb12" ${need === 0 ? 'style="display:none"' : ''}>
          <label class="check"><input type="checkbox" id="cb_leitner"> 加入 <b>莱特纳复习体系</b>（待复习单词进入红盒，今日起可复习）</label>
        </div>
        <div class="field mb12" ${need === 0 ? 'style="display:none"' : ''}>
          <label class="check"><input type="checkbox" id="cb_21"> 加入 <b>21 天记忆复习体系</b>（以本次待复习单词生成独立 21 天计划）</label>
        </div>
        <div class="field" ${need === 0 ? 'style="display:none"' : ''}>
          <label class="check"><input type="checkbox" id="cb_green"> 同时将待复习单词放入 <b>绿盒子</b>（教师自主复习）</label>
        </div>

        <div class="divider"></div>
        <div class="flex jcb aic">
          <span class="small muted">提交后本次任务标记为「已完成」，不可重复提交</span>
          <div class="flex gap8">
            <button class="btn" onclick="view = 'final'; render()">返回修改判断</button>
            <button class="btn btn-primary btn-lg" onclick="submitAll()">提交并保存</button>
          </div>
        </div>
      </div>
    </div>`;
}

function submitAll() {
  if (submitting) { Proto.toast('正在提交，请勿重复点击', 'warn'); return; }
  submitting = true;
  let res;
  try {
    res = Store.completeTask(task.id, {
      joinLeitner: document.getElementById('cb_leitner').checked,
      joinPlan21: document.getElementById('cb_21').checked,
      joinGreen: document.getElementById('cb_green').checked,
      by: Proto.teacherName()
    });
  } catch (e) {
    submitting = false;
    Proto.toast(e.message, 'err');
    return;
  }
  submitting = false;
  if (!res.ok) { Proto.toast(res.reason, 'err'); return; }
  if (res.noReview) {
    Proto.toast(res.message, 'warn');
  } else if (res.warnings && res.warnings.length) {
    Proto.toast('已提交，但有 1 项未写入：' + res.warnings[0], 'warn');
  } else {
    Proto.toast('训练结果已提交并写入复习体系', 'ok');
  }
  task = Store.trainTask(task.id);
  view = 'summary';
  render();
}

function renderSummary() {
  const yes = ids.filter(id => task.finalResults[id] && task.finalResults[id].result === 'yes').length;
  const no = ids.filter(id => task.finalResults[id] && task.finalResults[id].result === 'no').length;
  const mid = ids.filter(id => task.finalResults[id] && task.finalResults[id].result === 'mid').length;
  const j = task.joins || { leitner: [], plan21: [], green: [], planIds: [] };
  const empty = !!j.empty || (ids.length > 0 && no + mid === 0);

  el().innerHTML = `
    <div class="card">
      <div class="card-head"><div class="card-title">训练完成并已提交</div>
        <span class="tag tag-green nodot">任务 ${task.id} 已完成</span></div>
      <div class="card-body">
        <div class="grid g4 mb16">
          <div class="card stat"><div class="stat-label">本次队列</div><div class="stat-value">${ids.length}</div>
            <div class="stat-foot">初筛认识 ${task.knownWordIds.length} 个未训练</div></div>
          <div class="card stat"><div class="stat-label">本次通过</div>
            <div class="stat-value" style="color:var(--success)">${yes}</div></div>
          <div class="card stat"><div class="stat-label">待复习</div>
            <div class="stat-value" style="color:var(--danger)">${no}</div></div>
          <div class="card stat"><div class="stat-label">暂不确定</div>
            <div class="stat-value" style="color:var(--warning)">${mid}</div></div>
        </div>

        ${empty ? `<div class="alert alert-warn mb16"><span class="ico">!</span>
          <div><b>本次没有待复习单词，无需加入复习体系。</b>队列中 ${yes} 个单词全部通过最后复习，
            系统<b>没有</b>创建空的 21 天计划，也<b>没有</b>生成空的莱特纳任务。
            通过的单词只记录在训练任务与单词档案中，不进入复习体系。</div></div>` : ''}

        <div class="section-title">本次写入的复习体系</div>
        <div class="table-wrap mb16">
          <table class="table compact">
            <thead><tr><th>体系</th><th class="right">单词数</th><th>结果</th></tr></thead>
            <tbody>
              <tr><td>莱特纳复习体系</td><td class="right mono">${j.leitner.length}</td>
                <td>${j.leitner.length ? '<span class="tag tag-green nodot">已进入红盒，今日可复习</span>'
                  : empty ? '<span class="tag tag-slate nodot">无待复习单词，未创建任务</span>'
                  : '<span class="tag tag-slate nodot">未勾选加入</span>'}</td></tr>
              <tr><td>21 天记忆复习体系</td><td class="right mono">${j.plan21.length}</td>
                <td>${j.plan21.length
                  ? `<span class="tag tag-green nodot">已生成独立计划 ${j.planIds.join('、')}</span>`
                  : empty ? '<span class="tag tag-slate nodot">无待复习单词，未创建计划</span>'
                  : '<span class="tag tag-slate nodot">未勾选加入</span>'}</td></tr>
              <tr><td>绿盒子</td><td class="right mono">${j.green.length}</td>
                <td>${j.green.length ? '<span class="tag tag-green nodot">已加入，教师自主复习</span>'
                  : empty ? '<span class="tag tag-slate nodot">无待复习单词，未加入</span>'
                  : '<span class="tag tag-slate nodot">未勾选加入</span>'}</td></tr>
            </tbody>
          </table>
        </div>

        <div class="alert alert-info mb16"><span class="ico">i</span>
          <div>本次训练的每个单词判断、修正记录、预筛结果都已写入统一数据层。
            学习档案、单词档案、莱特纳盒子、21 天计划现在都能读到同一份结果。</div></div>

        <div class="flex gap8" style="justify-content:flex-end">
          <a class="btn" href="word-training-setup.html?student=${task.studentId}">返回词库选择</a>
          <a class="btn" href="word-detail.html?student=${task.studentId}&word=${ids[0] || ''}">查看单词档案</a>
          <a class="btn btn-primary" href="student-profile.html?student=${task.studentId}">返回学习档案</a>
        </div>
      </div>
    </div>`;
}

/* ---------- 中断视图 ---------- */
function renderInterrupted() {
  const done = Object.keys(task.results).length;
  const left = ids.length - done;
  el().innerHTML = `
    <div class="card">
      <div class="card-head"><div class="card-title">训练已中断</div>
        <span class="tag tag-amber nodot">${task.status}</span></div>
      <div class="card-body">
        <div class="alert alert-warn mb16"><span class="ico">!</span>
          <div>中断原因：<b>${task.interruptReason || '—'}</b>${task.interruptNote ? '（' + task.interruptNote + '）' : ''}
            <br>已判断的 ${done} 个单词记录已保留；未完成的 ${left} 个单词仍为「待强化训练」。</div></div>
        <div class="grid g3 mb16">
          <div class="card stat"><div class="stat-label">本次队列</div><div class="stat-value">${ids.length}</div></div>
          <div class="card stat"><div class="stat-label">已判断</div><div class="stat-value">${done}</div></div>
          <div class="card stat"><div class="stat-label">未完成</div>
            <div class="stat-value" style="color:var(--warning)">${left}</div></div>
        </div>
        <div class="flex gap8" style="justify-content:flex-end">
          <a class="btn" href="word-training-setup.html?student=${task.studentId}">返回词库选择</a>
          <button class="btn btn-primary btn-lg" onclick="resumeNow()">恢复并继续训练 →</button>
        </div>
      </div>
    </div>`;
}

function resumeNow() {
  task = Store.resumeTask(task.id);
  /* 展示循环任务：恢复后由 Store 的 trainDisplays 保留每词步进，直接回到列表视图 */
  if (task.phase === '强化训练' && task.displayFlow) { view = 'display'; render(); return; }
  const firstMissing = groups.findIndex(g => g.some(id => !task.results[id]));
  gi = firstMissing >= 0 ? firstMissing : groups.length - 1;
  wi = Math.max(curGroup().findIndex(id => !task.results[id]), 0);
  view = allDone(gi) ? 'groupDone' : 'group';
  Store.setTaskPos(task.id, { groupIndex: gi, wordIndex: wi });
  Proto.toast('已恢复训练任务 ' + task.id, 'ok');
  render();
}

/* ---------- 修正 / 暂停 / 结束 ---------- */
function openFix(wordId) {
  fixTarget = wordId;
  const r = task.results[wordId];
  const w = word(wordId);
  document.getElementById('fixInfo').innerHTML = `
    <div class="desc-item"><span class="k">单词</span><span class="v strong">${w.en} <span class="mono small muted">${w.ph}</span></span></div>
    <div class="desc-item"><span class="k">原始判断</span><span class="v">
      <span class="tag tag-${r.result === 'yes' ? 'green' : 'red'} nodot">${r.result === 'yes' ? '认识' : '不认识'}</span>
      <span class="small muted">${r.at} · 第 ${r.groupIndex + 1} 组 · ${r.mode}</span></span></div>
    <div class="desc-item"><span class="k">已修正次数</span><span class="v mono">${Store.detailsOf(task.id).filter(d => d.wordId === wordId && d.correction).length}</span></div>`;
  document.querySelectorAll('input[name=fixTo]').forEach(x => { x.checked = false; });
  document.getElementById('fixNote').value = '';
  Proto.openModal('fixModal');
}

function doFix() {
  const to = (document.querySelector('input[name=fixTo]:checked') || {}).value;
  const note = document.getElementById('fixNote').value.trim();
  if (!to) { Proto.toast('请选择修正后的结果', 'err'); return; }
  if (!note) { Proto.toast('请填写修正原因', 'err'); return; }
  try {
    Store.trainCorrect(task.id, fixTarget, to, note, (task.results[fixTarget] || {}).groupIndex, courseId);
  } catch (e) {
    Proto.toast(e.message, 'err');
    return;
  }
  task = Store.trainTask(task.id);
  Proto.closeModal('fixModal');
  Proto.toast('已追加修正记录，原始记录保留', 'ok');
  if (view === 'groupDone' && !allDone(gi)) view = 'group';
  render();
}

function openPause() {
  document.getElementById('pNo').textContent = task.id;
  document.getElementById('pQueue').textContent = ids.length + ' 个单词 / ' + groups.length + ' 组';
  document.getElementById('pDone').textContent = Object.keys(task.results).length + ' 个';
  Proto.openModal('pauseModal');
}

function doPause() {
  task = Store.pauseTask(task.id);
  Proto.closeModal('pauseModal');
  Proto.toast('已暂停，任务保存在本机，可随时继续', 'ok');
}

function saveExit() {
  task = Store.pauseTask(task.id);
  Proto.toast('已保存并退出，可从词库选择页继续', 'ok');
  setTimeout(() => location.href = 'word-training-setup.html?student=' + task.studentId + (courseId ? '&course=' + courseId : ''), 500);
}

function doEnd() {
  const r = document.getElementById('endReason').value;
  if (!r) { Proto.toast('请选择结束原因', 'err'); return; }
  try {
    Store.endTask(task.id, r, document.getElementById('endNote').value.trim());
  } catch (e) {
    Proto.toast(e.message, 'err');
    return;
  }
  task = Store.trainTask(task.id);
  Proto.closeModal('endModal');
  view = 'interrupted';
  render();
}

/* ---------- 键盘 ---------- */
document.addEventListener('keydown', e => {
  if (document.querySelector('.mask.show')) return;
  if (view === 'group') {
    if (e.key === '1') judge('no');
    if (e.key === '2') judge('yes');
  } else if (view === 'final') {
    if (e.key === '1') finalJudge('no');
    if (e.key === '2') finalJudge('mid');
    if (e.key === '3') finalJudge('yes');
  }
});

boot();
</script>
</body>
</html>
