<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家长端 · 课程记录</title>
<link rel="stylesheet" href="../assets/css/common.css">
</head>
<body class="mobile-bg">
<div class="m-frame">
  <div class="m-status"><span>9:41</span><span>5G ▮▮▮</span></div>

  <div class="m-head">
    <a class="back" href="home.html">‹</a>
    <div class="m-title">课程记录</div>
    <div class="grow"></div>
    <span class="small muted" id="stuName">—</span>
  </div>

  <div class="m-body">
    <div class="m-seg" id="seg">
      <div class="on" data-f="all">全部</div>
      <div data-f="已完成">已完成</div>
      <div data-f="未上课">未上课</div>
      <div data-f="已取消">已取消</div>
    </div>

    <div class="small muted" style="padding:0 2px" id="count">—</div>

    <div class="m-card" style="padding:0" id="list"></div>

    <div class="m-card">
      <div class="small muted" style="line-height:1.8">
        家长可查看课程时间、教师、主题与报告状态。<br>
        报告只有在教师<b>发布</b>后才能查看内容；整理中的课程会显示「老师整理中」。<br>
        如对课程记录有疑问，请联系机构教务核对，家长端不支持修改课程与课时。
      </div>
    </div>
  </div>

  <div class="m-tabbar">
    <a class="m-tab" href="home.html"><span class="ic">⌂</span>首页</a>
    <a class="m-tab on" href="course-records.html"><span class="ic">▤</span>课程</a>
    <a class="m-tab" href="report.html"><span class="ic">✎</span>报告</a>
    <a class="m-tab" href="review-words.html"><span class="ic">A</span>单词表</a>
    <a class="m-tab" href="hours.html"><span class="ic">◷</span>课时</a>
  </div>
</div>
<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script>
/* 家长身份取自会话：只允许查看自己孩子的课程，越权参数自动回落到第一个孩子 */
const q = new URLSearchParams(location.search);
const PID = Proto.parentId();
Store.setSession({ role: 'parent', parentId: PID, operatorName: Proto.parentName() });
const KIDS = Store.parentChildren(PID);
const STUDENT = KIDS.filter(k => k.id === q.get('student'))[0]
  ? q.get('student') : (KIDS[0] ? KIDS[0].id : '');
let filter = 'all';

const CTAG = { '待上课': 'tag-slate', '授课中': 'tag-blue', '已完成': 'tag-green', '未上课': 'tag-amber', '已取消': 'tag-slate' };
const RTAG = { '未生成': 'tag-slate', '编辑中': 'tag-amber', '已提交': 'tag-blue', '已发布': 'tag-green' };
const RTXT = { '未生成': '无报告', '编辑中': '老师整理中', '已提交': '老师整理中', '已发布': '报告已发布' };

function render() {
  const stu = Store.student(STUDENT);
  document.getElementById('stuName').textContent = stu ? stu.name : '';
  document.getElementById('stuName').onclick = null;

  const list = Store.coursesOf(STUDENT).filter(c => filter === 'all' || c.status === filter);
  document.getElementById('count').textContent =
    (stu ? stu.name + ' · ' : '') + '共 ' + list.length + ' 节课（含未来排课）';

  document.getElementById('list').innerHTML = list.length ? list.map((c, i) => {
    const rp = Store.reportOfCourse(c.id);
    const canOpen = rp && rp.status === '已发布';
    const tag = rp ? `<span class="tag ${RTAG[rp.status]} nodot">${RTXT[rp.status]}</span>`
      : '<span class="tag tag-slate nodot">无报告</span>';
    const inner = `
      <div style="flex:1">
        <div style="font-size:13.5px;font-weight:600">${c.date.slice(5)} ${c.start} — ${c.end}</div>
        <div class="small muted" style="margin-top:2px">${c.teacher} · ${rp ? rp.title : '一对一课程'}</div>
        <div class="flex gap4 mt8">
          <span class="tag ${CTAG[c.status]} nodot">${c.status}</span>
          ${tag}
        </div>
      </div>
      <span class="muted">${canOpen ? '›' : ''}</span>`;
    const style = 'padding:12px 14px;align-items:flex-start' + (i === list.length - 1 ? ';border-bottom:none' : '');
    return canOpen
      ? `<a class="m-row" href="report.html?student=${STUDENT}&report=${rp.id}" style="${style}">${inner}</a>`
      : `<div class="m-row" style="${style}">${inner}</div>`;
  }).join('') : '<div class="m-row" style="justify-content:center"><span class="small muted">没有符合条件的课程</span></div>';
}

document.getElementById('seg').addEventListener('click', e => {
  const f = e.target.dataset.f;
  if (!f) return;
  filter = f;
  Array.from(document.getElementById('seg').children).forEach(x => x.classList.toggle('on', x.dataset.f === f));
  render();
});

render();
</script>
</body>
</html>
