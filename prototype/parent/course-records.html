<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家长端 · 课程记录</title>
<link rel="stylesheet" href="../assets/css/common.css">
<style>
  .c-row { padding: 12px 14px; align-items: flex-start; cursor: pointer; }
  .detail-k { color: var(--text-3); font-size: 12.5px; }
</style>
</head>
<body class="mobile-bg">
<div class="m-frame">
  <div class="m-status"><span>9:41</span><span>5G ▮▮▮</span></div>

  <div class="m-head">
    <a class="back" href="home.html">‹</a>
    <div class="m-title">课程记录</div>
    <div class="grow"></div>
    <span class="small muted" id="stuName">—</span>
  </div>

  <div class="m-body">
    <div class="m-seg" id="kidSeg" style="display:none"></div>

    <div class="m-seg" id="seg">
      <div class="on" data-f="all">全部</div>
      <div data-f="待上课">待上课</div>
      <div data-f="授课中">授课中</div>
      <div data-f="已完成">已完成</div>
      <div data-f="未上课">未上课</div>
      <div data-f="已取消">已取消</div>
    </div>

    <div class="small muted" style="padding:0 2px" id="count">—</div>

    <div class="m-card" style="padding:0" id="list">
      <div class="m-row" style="justify-content:center"><span class="small muted">加载中…</span></div>
    </div>

    <div class="m-card">
      <div class="small muted" style="line-height:1.8">
        课程状态表示实际上课进度，报告状态表示教师记录与发布进度，两者相互独立。<br>
        报告只有在教师<b>发布</b>后才能查看；历史课程保留当时授课教师。<br>
        未上课、已取消的课程<b>不扣除课时</b>；家长端不支持修改课程与课时。
      </div>
    </div>
  </div>

  <div class="m-tabbar">
    <a class="m-tab" href="home.html"><span class="ic">⌂</span>首页</a>
    <a class="m-tab on" href="course-records.html"><span class="ic">▤</span>课程</a>
    <a class="m-tab" href="report.html"><span class="ic">✎</span>报告</a>
    <a class="m-tab" href="review-words.html"><span class="ic">A</span>单词表</a>
    <a class="m-tab" href="hours.html"><span class="ic">◷</span>课时</a>
  </div>
</div>

<!-- 课程详情抽屉 -->
<div class="drawer-mask" id="detailDrawer-mask"></div>
<div class="drawer" id="detailDrawer"></div>

<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script>
/* 家长端课程记录：六状态筛选 + 课程/报告状态独立 + 课程详情 + 历史教师保留 */
const q = new URLSearchParams(location.search);
const PID = Proto.parentId();
Store.setSession({ role: 'parent', parentId: PID, operatorName: Proto.parentName() });
const KIDS = Store.parentChildren(PID);
let curKid = '';
let filter = 'all';

const CTAG = { '待上课': 'tag-slate', '授课中': 'tag-blue', '已完成': 'tag-green', '未上课': 'tag-amber', '已取消': 'tag-slate' };
const RTAG = { '未生成': 'tag-slate', '编辑中': 'tag-amber', '已提交': 'tag-blue', '已发布': 'tag-green' };
const RTXT = { '未生成': '无报告', '编辑中': '老师整理中', '已提交': '老师整理中', '已发布': '报告已发布' };

function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function initKid() {
  const fromURL = q.get('student');
  const shared = Store.parentCurrentChild(PID);
  curKid = (fromURL && KIDS.some(k => k.id === fromURL)) ? fromURL
    : (shared && KIDS.some(k => k.id === shared)) ? shared : (KIDS[0] ? KIDS[0].id : '');
  if (curKid !== shared && curKid !== fromURL) { try { Store.setParentCurrentChild(PID, curKid); } catch (e) {} }
  const seg = document.getElementById('kidSeg');
  if (KIDS.length > 1) {
    seg.style.display = 'flex';
    seg.innerHTML = KIDS.map(k => `<div class="${k.id === curKid ? 'on' : ''}" data-k="${k.id}">${esc(k.name)}</div>`).join('');
    seg.addEventListener('click', e => {
      const k = e.target.closest('[data-k]');
      if (!k) return;
      Store.setParentCurrentChild(PID, k.dataset.k);
      curKid = k.dataset.k;
      Array.from(seg.children).forEach(x => x.classList.toggle('on', x.dataset.k === curKid));
      render();
    });
  }
}

function render() {
  const stu = Store.student(curKid);
  document.getElementById('stuName').textContent = stu ? stu.name : '';

  let list = [];
  try { list = Store.parentCourses(PID, curKid, { status: filter === 'all' ? '' : filter }); }
  catch (e) {
    document.getElementById('list').innerHTML =
      `<div class="m-row" style="justify-content:center"><span class="small" style="color:var(--danger)">加载失败：${esc(e.message)}</span></div>`;
    document.getElementById('count').textContent = '';
    return;
  }

  document.getElementById('count').textContent =
    (stu ? stu.name + ' · ' : '') + '共 ' + list.length + ' 节课（含未来排课）';

  document.getElementById('list').innerHTML = list.length ? list.map((c, i) => {
    const canOpen = c.reportViewable;
    const tag = `<span class="tag ${RTAG[c.reportStatus] || 'tag-slate'} nodot">${RTXT[c.reportStatus] || c.reportStatus}</span>`;
    const style = 'padding:12px 14px;align-items:flex-start' + (i === list.length - 1 ? ';border-bottom:none' : '');
    return `<div class="m-row c-row" style="${style}" onclick="openDetail('${c.id}')">
      <div style="flex:1">
        <div style="font-size:13.5px;font-weight:600">${esc(c.date.slice(5))} ${esc(c.start)} — ${esc(c.end)}</div>
        <div class="small muted" style="margin-top:2px">${esc(c.teacherName)} · ${esc(c.topic || '一对一课程')}</div>
        <div class="flex gap4 mt8">
          <span class="tag ${CTAG[c.status] || 'tag-slate'} nodot">${c.status}</span>
          ${tag}
        </div>
      </div>
      <span class="muted">›</span>
    </div>`;
  }).join('') : '<div class="m-row" style="justify-content:center"><span class="small muted">没有符合条件的课程</span></div>';
}

function openDetail(courseId) {
  let detail;
  try { detail = Store.parentCourseDetail(PID, curKid, courseId); }
  catch (e) { Proto.toast(e.message, 'err'); return; }
  const c = detail;
  /* 有已发布报告时，抽屉内直接给出本节训练单词数与一句话总结，减少跳转 */
  let repWords = 0, repSummary = '';
  if (c.reportViewable && c.reportId) {
    try {
      const rp = Store.parentReportDetail(PID, curKid, c.reportId);
      repWords = (rp.stats && rp.stats.trainWords) || 0;
      repSummary = (String(rp.content.performance || '').split('\n').find(x => x.trim()) || '').trim();
    } catch (e) { /* 报告读取失败不影响课程详情 */ }
  }
  const reportLink = c.reportViewable
    ? `<a class="btn btn-block btn-primary" href="report.html?student=${curKid}&report=${c.reportId}">查看学习报告</a>`
    : (c.reportStatus === '未生成' ? ''
       : `<div class="small muted">报告${c.reportStatus === '编辑中' || c.reportStatus === '已提交' ? '老师整理中，发布后可查看' : ''}</div>`);
  const reason = (c.status === '未上课' || c.status === '已取消') && c.note
    ? `<div class="m-row"><span class="k">${c.status === '已取消' ? '取消原因' : '备注'}</span><span style="text-align:right;max-width:180px">${esc(c.note)}</span></div>`
    : '';
  document.getElementById('detailDrawer').innerHTML = `
    <div class="modal-head">
      <div class="modal-title">课程详情</div>
      <button class="modal-close" onclick="Proto.closeDrawer('detailDrawer')">×</button>
    </div>
    <div class="modal-body">
      <div class="m-row"><span class="k detail-k">课程日期</span><span>${esc(c.date)}</span></div>
      <div class="m-row"><span class="k detail-k">计划时间</span><span>${esc(c.start)} — ${esc(c.end)}</span></div>
      ${c.actualStart ? `<div class="m-row"><span class="k detail-k">实际上课</span><span>${esc(c.actualStart)} — ${esc(c.actualEnd || '—')}</span></div>` : ''}
      <div class="m-row"><span class="k detail-k">授课教师</span><span>${esc(c.teacherName)}</span></div>
      <div class="m-row"><span class="k detail-k">课程主题</span><span style="text-align:right;max-width:180px">${esc(c.topic || '—')}</span></div>
      <div class="m-row"><span class="k detail-k">课程状态</span><span><span class="tag ${CTAG[c.status] || 'tag-slate'} nodot">${c.status}</span></span></div>
      <div class="m-row"><span class="k detail-k">报告状态</span><span><span class="tag ${RTAG[c.reportStatus] || 'tag-slate'} nodot">${RTXT[c.reportStatus] || c.reportStatus}</span></span></div>
      ${c.reportViewable && (repWords || repSummary) ? `<div class="m-row" style="align-items:flex-start"><span class="k detail-k">报告摘要</span><span style="text-align:right;max-width:220px"><div class="small">本节训练 ${repWords} 个单词</div>${repSummary ? `<div class="small muted" style="margin-top:2px">${esc(repSummary)}</div>` : ''}</span></div>` : ''}
      <div class="m-row"><span class="k detail-k">课时</span><span>${c.status === '已完成' ? '已扣课时' : c.status === '未上课' || c.status === '已取消' ? '不扣课时' : '未扣课时'}</span></div>
      ${reason}
      ${(c.status === '未上课' || c.status === '已取消') ? `<a class="btn btn-sm btn-block mt8" href="hours.html?kid=${curKid}#iq">对本次课程有疑问？联系教务</a>` : ''}
      <div class="divider" style="margin:12px 0"></div>
      <div class="small muted" style="line-height:1.7">家长端仅可查看课程记录，不能修改课程状态与课时。</div>
      ${reportLink ? `<div style="margin-top:10px">${reportLink}</div>` : ''}
    </div>`;
  Proto.openDrawer('detailDrawer');
}

document.getElementById('seg').addEventListener('click', e => {
  const f = e.target.closest('[data-f]');
  if (!f) return;
  filter = f.dataset.f;
  Array.from(document.getElementById('seg').children).forEach(x => x.classList.toggle('on', x.dataset.f === f.dataset.f));
  render();
});

initKid();
render();
</script>
</body>
</html>
