<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家长端 · 首页</title>
<link rel="stylesheet" href="../assets/css/common.css">
<style>
  .todo-grid { display:flex; flex-direction:column; gap:8px; }
  .todo-card { display:flex; align-items:center; gap:10px; border-radius:10px; padding:11px 12px; }
  .todo-card .ti { flex:1; font-size:13px; line-height:1.5; }
  .todo-card .tg { font-size:16px; width:22px; text-align:center; }
  .todo-blue { background:#eff6ff; border:1px solid #bfdbfe; }
  .todo-amber { background:#fffbeb; border:1px solid #fde68a; }
  .todo-red { background:#fef2f2; border:1px solid #fecaca; }
  .todo-green { background:#ecfdf5; border:1px solid #bbf7d0; }
  .fb-block { margin-bottom:8px; }
  .fb-k { font-size:11px; font-weight:600; margin-bottom:2px; }
  .fb-k.good { color:var(--success); }
  .fb-k.warn { color:var(--warning); }
  .fb-k.tip { color:var(--primary-dark); }
</style>
</head>
<body class="mobile-bg">
<div class="m-frame">
  <div class="m-status"><span>9:41</span><span>5G ▮▮▮</span></div>

  <div class="m-head">
    <div class="grow">
      <div class="m-title" style="font-size:15px" id="greet">您好</div>
      <div class="small muted" id="headSub">启航英语 · 城东校区</div>
    </div>
    <div class="avatar" id="avatar">家</div>
  </div>

  <div class="m-body" id="body">
    <div class="m-card"><div class="small muted">加载中…</div></div>
  </div>

  <div class="m-tabbar">
    <a class="m-tab on" href="home.html"><span class="ic">⌂</span>首页</a>
    <a class="m-tab" href="course-records.html"><span class="ic">▤</span>课程</a>
    <a class="m-tab" href="report.html"><span class="ic">✎</span>报告</a>
    <a class="m-tab" href="review-words.html"><span class="ic">A</span>单词表</a>
    <a class="m-tab" href="hours.html"><span class="ic">◷</span>课时</a>
  </div>
</div>

<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script>
/* 家长端首页 = 家庭学习工作台（待办优先置顶）。
   统一当前孩子，走家长专用授权接口，越权由 Store 拒绝。 */
const S = Store;
const PID = Proto.parentId();
S.setSession({ role: 'parent', parentId: PID, operatorName: Proto.parentName() });
const KIDS = S.parentChildren(PID);

function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function nl(s) { return (s || '').split('\n').filter(Boolean).map(x => `<div>${esc(x)}</div>`).join('') || ''; }

let curKid = '';
function initKid() {
  const shared = S.parentCurrentChild(PID);
  curKid = (shared && KIDS.some(k => k.id === shared)) ? shared : (KIDS[0] ? KIDS[0].id : '');
  if (!KIDS.some(k => k.id === curKid)) curKid = KIDS[0] ? KIDS[0].id : '';
  if (curKid && curKid !== shared) { try { S.setParentCurrentChild(PID, curKid); } catch (e) {} }
}
function switchKid(id) {
  S.setParentCurrentChild(PID, id);
  curKid = id;
  render();
}

function render() {
  const P = S.parent(PID) || {};
  document.getElementById('greet').textContent = (P.name || '家长') + '，您好';

  if (!KIDS.length) {
    document.getElementById('body').innerHTML =
      '<div class="m-card"><div class="small muted">当前家长账号下暂无关联孩子，请联系教务。</div></div>';
    return;
  }
  if (!curKid) {
    document.getElementById('body').innerHTML =
      '<div class="m-card"><div class="small muted">暂无可展示的孩子档案。</div></div>';
    return;
  }

  let detail, courses, hoursRow, reports, fbs, notis, inqs, progress;
  try {
    detail = S.parentStudentDetail(PID, curKid);
    courses = S.parentCourses(PID, curKid, {});
    hoursRow = S.parentHours(PID).filter(x => x.studentId === curKid)[0] || null;
    reports = S.parentReports(PID, curKid, {});
    fbs = S.parentFeedbacks(PID).filter(f => f.studentId === curKid);
    notis = S.notifications({ unread: true });
    inqs = S.parentInquiries(PID).filter(x => !x.studentId || x.studentId === curKid);
    progress = S.parentReviewProgress(PID, curKid);
  } catch (e) {
    document.getElementById('body').innerHTML =
      `<div class="m-card"><div class="small" style="color:var(--danger)">加载失败：${esc(e.message)}</div></div>`;
    return;
  }

  const cur = KIDS.filter(k => k.id === curKid)[0] || {};
  document.getElementById('headSub').textContent = `${esc(cur.name || '')} · ${esc(cur.grade || '')} · 启航英语`;
  document.getElementById('avatar').textContent = (cur.name || P.name || '家').slice(0, 1);

  const doneCount = courses.filter(c => c.status === '已完成').length;
  const review = detail.reviewSummary || { today: 0, all: 0, passed: 0 };
  const latestFb = fbs[0] || null;
  const latestReport = reports[0] || null;
  const unreadReports = reports.filter(r => r.read === false);
  const newDot = unreadReports.length ? '<span class="tag tag-red nodot" style="font-size:10px">新</span>' : '';

  /* ---- 待办与消息（合并）---- */
  const todos = [];
  if (review.today > 0) todos.push({ tone: 'blue', icon: '✎', text: `今日有 ${review.today} 个单词到期待复习`, href: 'review-words.html?student=' + curKid, action: '去复习' });
  if (unreadReports.length) todos.push({ tone: 'amber', icon: '▤', text: `有 ${unreadReports.length} 份新学习报告待查看`, href: 'report.html?student=' + curKid, action: '看报告' });
  if (hoursRow && hoursRow.lowAlert) todos.push({ tone: 'red', icon: '◷', text: `课时余额不足（剩 ${hoursRow.totalRemain} 节）`, href: 'hours.html?kid=' + curKid, action: '查看课时' });
  (hoursRow && hoursRow.accounts || []).forEach(a => {
    if (a.expiring && a.daysLeft >= 0) todos.push({ tone: 'amber', icon: '◷', text: `${a.product} 套餐 ${a.daysLeft} 天后到期`, href: 'hours.html?kid=' + curKid, action: '查看课时' });
  });
  const replied = inqs.filter(x => x.status === '已回复' && x.reply);
  if (replied.length) todos.push({ tone: 'green', icon: '✉', text: `有 ${replied.length} 条教务回复待查看`, href: 'hours.html?kid=' + curKid + '#iq', action: '查看回复' });

  const todoHtml = todos.length ? `<div class="todo-grid">` + todos.map(t =>
    `<div class="todo-card todo-${t.tone}"><span class="tg">${t.icon}</span><span class="ti">${esc(t.text)}</span>
       <a class="btn btn-sm" href="${t.href}">${t.action}</a></div>`).join('') + `</div>`
    : `<div class="todo-card todo-green"><span class="tg">✓</span><span class="ti">今天没有待办，继续保持！</span></div>`;

  const notisHtml = notis.length ? `
    <div class="flex jcb aic mt8"><span class="small muted">未读消息 ${notis.length} 条</span><a class="small" onclick="markAll()">全部已读</a></div>
    ${notis.slice(0, 3).map(n => `<a class="m-row" href="javascript:void 0" onclick="markOne('${n.id}','${esc(n.link || 'home.html')}')" style="align-items:flex-start">
      <div style="flex:1"><div style="font-size:13px">${esc(n.title)}</div>
      <div class="small muted" style="margin-top:2px">${esc(n.content)} · ${esc((n.createdAt || '').slice(0, 16))}</div></div>
      <span class="muted">›</span></a>`).join('')}` : '';

  document.getElementById('body').innerHTML = `
    <div class="m-seg" id="kidSeg">
      ${KIDS.map(k => `<div class="${k.id === curKid ? 'on' : ''}" onclick="switchKid('${k.id}')">${esc(k.name)}</div>`).join('')}
    </div>

    <div class="m-card">
      <div class="m-card-title">消息与待办
        <a href="../notifications.html" class="small" style="font-weight:400">全部消息 ›</a></div>
      ${todoHtml}
      ${notisHtml}
    </div>

    <div class="m-hero">
      <div class="flex jcb aic">
        <div>
          <div class="t">当前可用课时</div>
          <div class="n">${detail.remain}</div>
          <div class="s">累计 ${detail.totalHours} 课时 · 已使用 ${detail.usedHours}${hoursRow && hoursRow.weeksEstimate != null ? ` · 按每周 ${hoursRow.weeklyEstimate} 节约可支撑 ${hoursRow.weeksEstimate} 周` : ''}</div>
        </div>
        <span class="m-chip">${esc(detail.status)}</span>
      </div>
      <div class="flex gap8 mt12">
        <a href="hours.html?kid=${curKid}" style="flex:1;background:rgba(255,255,255,.18);color:#fff;text-align:center;padding:7px 0;border-radius:8px;font-size:12px">课时明细</a>
        <a href="course-records.html?student=${curKid}" style="flex:1;background:rgba(255,255,255,.18);color:#fff;text-align:center;padding:7px 0;border-radius:8px;font-size:12px">课程记录</a>
      </div>
    </div>

    <div class="m-card">
      <div class="m-card-title">孩子信息</div>
      <div class="m-row"><span class="k">姓名</span><span>${esc(detail.name)} · ${esc(detail.grade)}</span></div>
      <div class="m-row"><span class="k">教材</span><span>${esc(detail.book)}</span></div>
      <div class="m-row"><span class="k">授课教师</span><span>${esc(detail.teacherName)}</span></div>
      <div class="m-row"><span class="k">剩余课时</span><span>${detail.remain} 节</span></div>
      <div class="m-row"><span class="k">最近一次课程</span><span>${esc(detail.lastCourseDate || '暂无')}</span></div>
    </div>

    <div class="m-card">
      <div class="m-card-title">学习概况</div>
      <div class="m-stat" style="margin:8px 0 4px">
        <div><div class="v">${doneCount}</div><div class="k">累计完成课程</div></div>
        <div><div class="v" style="font-size:14px;line-height:1.4">${esc((detail.lastCourseDate || '—').slice(5))}</div><div class="k">最近学习时间</div></div>
        <div><div class="v" style="color:var(--warning)">${review.today}</div><div class="k">今日待复习</div></div>
      </div>
      <div class="small muted mt8">指标来自真实课程记录与复习数据；待复习为当前日期到期的有效任务。</div>
      ${progress && progress.due ? `<div class="small mt8" style="color:var(--primary-dark)">家庭复习进度：已勾选 ${progress.checked} / ${progress.due}</div>` : ''}
    </div>

    <div class="m-card">
      <div class="m-card-title">最近学习反馈 ${newDot}
        <a href="report.html?student=${curKid}" class="small" style="font-weight:400">报告列表</a></div>
      ${latestFb ? `
        <div class="small muted mb8">${esc(latestFb.title)} · ${esc((latestFb.publishedAt || '').slice(0, 10))} · ${esc(latestFb.teacherName)}</div>
        <div class="fb-block"><div class="fb-k good">表现亮点</div><div class="small" style="color:var(--text-2);line-height:1.7">${nl(latestFb.performance) || '—'}</div></div>
        <div class="fb-block"><div class="fb-k warn">需要加强</div><div class="small" style="color:var(--text-2);line-height:1.7">${nl(latestFb.weak) || '暂无'}</div></div>
        <div class="fb-block"><div class="fb-k tip">家庭建议</div><div class="small" style="color:var(--text-2);line-height:1.7">${nl(latestFb.homeworkAdvice) || nl(latestFb.next) || '暂无'}</div></div>
        ${latestReport ? `<a class="btn btn-block btn-primary mt12" href="report.html?student=${curKid}&report=${latestReport.id}">查看完整报告</a>` : ''}`
        : '<div class="small muted">教师发布学习反馈后，这里会同步显示。</div>'}
    </div>

    <div class="m-card">
      <div class="m-card-title">报名订单
        <a href="hours.html?kid=${curKid}" class="small" style="font-weight:400">课时明细</a></div>
      ${(() => {
        const ord = S.parentOrders(PID).filter(o => o.studentId === curKid);
        return ord.length ? ord.slice(0, 3).map(o => `
          <div class="m-row"><span class="k">${esc(o.productName)} · ${esc((o.createdAt || '').slice(0, 10))}</span>
            <span><span class="tag tag-${S.ORDER_TONE[o.status] || 'slate'}">${o.status}</span></span></div>`).join('')
          : '<div class="small muted">暂无订单</div>';
      })()}
      <div class="small muted mt8">课时只来自订单收款入账；家长端不展示收款流水与内部操作记录。</div>
    </div>`;

  if (location.hash === '#iq') { setTimeout(() => { location.hash = ''; }, 0); }
}

function markOne(id, link) {
  try { S.markNotificationRead(id); } catch (e) {}
  if (link && link !== 'home.html') location.href = link;
  else render();
}
function markAll() {
  try { S.markAllNotificationsRead(); } catch (e) {}
  render();
}

initKid();
render();
</script>
</body>
</html>
