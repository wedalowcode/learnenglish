<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家长端 · 课时余额</title>
<link rel="stylesheet" href="../assets/css/common.css">
</head>
<body class="mobile-bg">
<div class="m-frame">
  <div class="m-status"><span>9:41</span><span>5G ▮▮▮</span></div>

  <div class="m-head">
    <a class="back" href="home.html">‹</a>
    <div class="m-title">课时余额</div>
    <div class="grow"></div>
    <span class="small muted" id="kidName">—</span>
  </div>

  <div class="m-body" id="body">
    <div class="empty" style="padding:40px 10px"><p>正在加载…</p></div>
  </div>

  <div class="m-tabbar">
    <a class="m-tab" href="home.html"><span class="ic">⌂</span>首页</a>
    <a class="m-tab" href="course-records.html"><span class="ic">▤</span>课程</a>
    <a class="m-tab" href="report.html"><span class="ic">✎</span>报告</a>
    <a class="m-tab" href="review-words.html"><span class="ic">A</span>单词表</a>
    <a class="m-tab on" href="hours.html"><span class="ic">◷</span>课时</a>
  </div>
</div>
<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script>
const S = Store;
const PID = Proto.parentId();
S.setSession({ role: 'parent', parentId: PID, operatorName: Proto.parentName() });

function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

const hours = S.parentHours(PID);
const kids = S.parentChildren(PID);
const Q = new URLSearchParams(location.search);
let cur = Q.get('kid') || (hours.length ? hours[0].studentId : '');

function render() {
  const h = hours.filter(x => x.studentId === cur)[0] || hours[0];
  const k = kids.filter(x => x.id === (h ? h.studentId : ''))[0];
  if (!h) {
    document.getElementById('body').innerHTML = '<div class="m-card"><div class="small muted">暂无课时账户</div></div>';
    return;
  }
  document.getElementById('kidName').textContent = h.studentName;
  const accs = h.accounts;
  const total = accs.reduce((a, x) => a + x.totalHours, 0);
  const used = accs.reduce((a, x) => a + x.usedHours, 0);
  document.getElementById('body').innerHTML = `
    <div class="m-hero">
      <div class="t">当前可用课时</div>
      <div class="n">${h.remain}</div>
      <div class="s">${esc(k ? k.grade : '')} · 教师 ${esc(k ? k.teacherName : '未分配')}</div>
    </div>

    ${hours.length > 1 ? `<div class="m-seg">
      ${hours.map(x => `<div class="${x.studentId === h.studentId ? 'on' : ''}" onclick="pick('${x.studentId}')">${esc(x.studentName)}</div>`).join('')}
    </div>` : ''}

    <div class="m-card">
      <div class="m-card-title">课时汇总</div>
      <div class="m-stat">
        <div><div class="v">${total}</div><div class="k">累计购买 / 赠送</div></div>
        <div><div class="v" style="color:var(--danger)">${used}</div><div class="k">累计消耗</div></div>
        <div><div class="v" style="color:var(--success)">${h.remain}</div><div class="k">当前余额</div></div>
      </div>
      <div class="divider" style="margin:12px 0"></div>
      <div class="small muted" style="line-height:1.75">
        课时只在课程实际上课后扣除；预约、进入课堂、开始训练都不会扣课时。
        课时只来自订单收款入账，家长端不可调整。
      </div>
    </div>

    <div class="m-card" style="padding:0">
      <div class="m-card-title" style="padding:12px 14px 4px">课时账户</div>
      ${accs.length ? accs.map((a, i) => `
        <div class="m-row" style="padding:10px 14px${i === accs.length - 1 ? ';border-bottom:none' : ''}">
          <div>
            <div style="font-size:13px">${esc(a.product)}</div>
            <div class="small muted">${esc(a.id)} · 到期 ${esc(a.expireAt || '—')} · ${esc(a.status)}</div>
          </div>
          <div style="text-align:right">
            <div class="mono" style="color:var(--success);font-weight:600">${a.remain} 剩余</div>
            <div class="small muted">总额 ${a.totalHours} / 已用 ${a.usedHours}</div>
          </div>
        </div>`).join('')
        : '<div class="m-row" style="border-bottom:none"><span class="small muted">暂无账户</span></div>'}
      <div class="small muted" style="padding:4px 14px 12px">家长端不展示内部课时流水与收款流水。</div>
    </div>

    <div class="m-card">
      <div class="m-card-title">续费与咨询</div>
      <div class="small muted mb12">剩余课时低于 5 课时或套餐临期时，教务会主动联系您。</div>
      <button class="btn btn-block btn-primary" onclick="Proto.toast('已向教务发送续费咨询（示意）','ok')">联系教务续费</button>
      <div class="small muted mt8" style="text-align:center">家长端仅可查看，不能调整课时</div>
    </div>`;
}
function pick(id) { cur = id; render(); }
render();
</script>
</body>
</html>
