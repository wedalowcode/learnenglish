<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>订单详情</title>
<link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="page">
      <div class="empty" style="padding:60px 20px"><div class="e-ico">▤</div><p>正在加载订单…</p></div>
    </main>
  </div>
</div>

<div class="mask" id="payModal">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">确认收款并入账</div>
      <button class="modal-close" onclick="Proto.closeModal('payModal')">×</button></div>
    <div class="modal-body">
      <div class="alert alert-warn mb16"><span class="ico">!</span><div id="payTip">—</div></div>
      <div class="form-grid">
        <div class="field"><label>收款方式 <span class="req">*</span></label>
          <select class="select" id="p_method"></select></div>
        <div class="field"><label>收款金额（必须与订单一致）<span class="req">*</span></label>
          <input class="input" id="p_amount" type="number"></div>
        <div class="field full"><label>备注</label><input class="input" id="p_note"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="Proto.closeModal('payModal')">取消</button>
      <button class="btn btn-primary" onclick="confirmPay()">确认收款并入账</button>
    </div>
  </div>
</div>

<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script>
const S = Store;
S.setSession({ role: 'admin' });
Proto.shell({ role: 'admin', active: 'order-list' });

const ID = new URLSearchParams(location.search).get('id') || '';
document.getElementById('p_method').innerHTML = S.dictionaryOptions('pay_method').map(m => `<option>${m}</option>`).join('');

function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function render() {
  let V;
  try { V = S.orderView(ID); }
  catch (e) {
    document.getElementById('page').innerHTML =
      `<div class="card"><div class="card-body"><div class="alert alert-warn"><span class="ico">!</span><div>${esc(e.message)}</div></div>
       <a class="btn mt12" href="order-list.html">返回订单列表</a></div></div>`;
    return;
  }
  const o = V.order, st = V.student, ck = S.orderCheck(ID);
  const regs = S.paymentRegistrationsOf(ID);
  const pendingRegs = regs.filter(r => r.status === S.PAY_REG.PENDING);
  const refunds = S.refundRequestsOf({ orderId: ID });
  const pendingRefunds = refunds.filter(x => x.request.status === S.REFUND.PENDING);
  const canReview = o.status === S.ORDER.PENDING;
  const canPay = [S.ORDER.PENDING, S.ORDER.REVIEWED].indexOf(o.status) >= 0 && o.paidAmount < o.amount;
  document.getElementById('page').innerHTML = `
    <div class="page-head">
      <div>
        <div class="crumb">商品订单<span class="sep">/</span><a href="order-list.html">订单管理</a><span class="sep">/</span>订单详情</div>
        <h1 class="page-title">${o.id} <span class="tag tag-${S.ORDER_TONE[o.status] || 'slate'}" style="font-size:12px;vertical-align:middle">${o.status}</span></h1>
        <div class="page-sub">${esc(o.type)} · ${esc(o.productName)} · 学员 ${esc(st ? st.name : '—')} · 下单 ${esc(o.createdAt)}</div>
      </div>
      <div class="page-actions">
        <a class="btn" href="order-list.html">返回</a>
        ${canReview ? `<button class="btn" onclick="review(true)">审核通过</button>
          <button class="btn" onclick="review(false)">驳回</button>` : ''}
        ${canPay ? '<button class="btn btn-primary" onclick="openPay()">确认收款并入账</button>' : ''}
        ${[S.ORDER.CREDITED, S.ORDER.REFUNDED].indexOf(o.status) >= 0 ? '<button class="btn" onclick="askRefund()">发起退款申请</button>' : ''}
        ${pendingRefunds.length ? '<button class="btn" onclick="reviewRefundNow()">审核退款</button>' : ''}
      </div>
    </div>

    <div class="grid g-2-1" style="align-items:start">
      <div>
        <div class="card">
          <div class="card-head"><div class="card-title">订单信息</div>
            <span class="tag tag-${ck.ok ? 'green' : 'red'} nodot">${ck.ok ? '账实一致' : '存在差异'}</span></div>
          <div class="card-body"><div class="desc g3">
            <div class="desc-item"><span class="k">订单编号</span><span class="v mono">${o.id}</span></div>
            <div class="desc-item"><span class="k">订单类型</span><span class="v">${esc(o.type)}</span></div>
            <div class="desc-item"><span class="k">课程商品</span><span class="v">${esc(o.productName)}</span></div>
            <div class="desc-item"><span class="k">购买课时</span><span class="v mono">${o.hours}</span></div>
            <div class="desc-item"><span class="k">赠送课时</span><span class="v mono">${o.gift}</span></div>
            <div class="desc-item"><span class="k">总课时</span><span class="v mono">${o.totalHours}</span></div>
            <div class="desc-item"><span class="k">订单金额</span><span class="v mono">${Proto.money(o.amount)}</span></div>
            <div class="desc-item"><span class="k">已收金额</span><span class="v mono">${o.paidAmount ? Proto.money(o.paidAmount) + ' / ' + Proto.money(o.amount) : '—'}</span></div>
            <div class="desc-item"><span class="k">累计入账课时</span><span class="v mono">${o.creditedHours} / ${o.totalHours}</span></div>
            <div class="desc-item"><span class="k">已退金额</span><span class="v mono">${o.refundedAmount ? Proto.money(o.refundedAmount) : '—'}</span></div>
            <div class="desc-item"><span class="k">订单状态</span><span class="v">${esc(o.status)}${o.partialRefund ? '（部分退款）' : ''}</span></div>
            <div class="desc-item"><span class="k">收款方式</span><span class="v">${esc(o.payMethod || '—')}</span></div>
            <div class="desc-item"><span class="k">审核人</span><span class="v">${esc(o.reviewedBy || '—')}</span></div>
            <div class="desc-item"><span class="k">入账时间</span><span class="v">${esc(o.creditedAt || '—')}</span></div>
            <div class="desc-item"><span class="k">入账操作人</span><span class="v">${esc(o.creditBy || '—')}</span></div>
          </div></div>
        </div>

        <div class="card">
          <div class="card-head"><div class="card-title">归属追溯</div></div>
          <div class="card-body"><div class="desc g3">
            <div class="desc-item"><span class="k">代理归属</span><span class="v">${V.agent ? esc(V.agent.name) + '（' + V.agent.id + '）' : '机构直营'}</span></div>
            <div class="desc-item"><span class="k">关联线索</span><span class="v mono">${esc(o.leadId || '—')}</span></div>
            <div class="desc-item"><span class="k">续费来源</span><span class="v mono">${esc(o.renewalOpportunityId || '—')}</span></div>
            <div class="desc-item"><span class="k">家长账号</span><span class="v">${V.parent ? esc(V.parent.name) + '（' + V.parent.id + '）' : '—'}</span></div>
            <div class="desc-item"><span class="k">当前教师</span><span class="v">${esc(st ? st.teacherName : '—')}</span></div>
            <div class="desc-item"><span class="k">课时账户</span><span class="v mono">${esc(o.lessonAccountId || '—')}</span></div>
          </div></div>
        </div>

        <div class="card">
          <div class="card-head"><div class="card-title">课时核对<span class="hint">订单 / 收款 / 账户 / 流水</span></div>
            <span class="tag tag-${ck.ok ? 'green' : 'red'} nodot">${ck.ok ? '通过' : '不通过'}</span></div>
          <div class="card-body">
            ${ck.reasons.length ? `<div class="alert alert-warn mb16"><span class="ico">!</span><div>${ck.reasons.map(esc).join('<br>')}</div></div>` : ''}
            <div class="desc g3">
              <div class="desc-item"><span class="k">订单总课时</span><span class="v mono">${o.totalHours}</span></div>
              <div class="desc-item"><span class="k">入账流水合计</span><span class="v mono">${ck.flowHours}</span></div>
              <div class="desc-item"><span class="k">账户购买课时</span><span class="v mono">${ck.account ? ck.account.hours : '—'}</span></div>
              <div class="desc-item"><span class="k">账户赠送课时</span><span class="v mono">${ck.account ? ck.account.gift : '—'}</span></div>
              <div class="desc-item"><span class="k">收款记录</span><span class="v">${ck.payments.length ? ck.payments.map(p => esc(p.id) + ' · ' + Proto.money(p.amount)).join('<br>') : '无'}</span></div>
              <div class="desc-item"><span class="k">账户剩余</span><span class="v mono">${ck.account ? ck.account.remain : '—'}</span></div>
            </div>
            ${o.status !== S.ORDER.CREDITED && (o.paidAmount || 0) === 0 ? `<div class="alert alert-info mt12"><span class="ico">i</span>
              <div>未收款订单不应存在课时账户与入账流水；当前核对已确认无凭空课时。</div></div>` : ''}
            ${o.status === S.ORDER.REVIEWED && (o.paidAmount || 0) > 0 ? `<div class="alert alert-info mt12"><span class="ico">i</span>
              <div>部分收款中：已按单价折算入账 ${o.creditedHours} 课时，收满 ${Proto.money(o.amount)} 后自动转为「已入账」。</div></div>` : ''}
          </div>
        </div>
      </div>

      <div>
        <div class="card">
          <div class="card-head"><div class="card-title">收款记录</div></div>
          <div class="card-body">
            ${V.payments.length ? V.payments.map(p => `
              <div class="m-row" style="display:block">
                <div class="flex jcb aic"><b class="mono">${Proto.money(p.amount)}</b>
                  <span class="tag tag-${p.status === S.PAY.CONFIRMED ? 'green' : 'amber'}">${p.status}</span></div>
                <div class="small muted mt4">${esc(p.method)} · ${esc(p.confirmedAt || p.createdAt)} · ${esc(p.confirmedBy || '')}</div>
                <div class="small mt4">${esc(p.note || '')}</div>
              </div>`).join('')
              : '<div class="small muted">尚未收款。确认收款后才创建课时账户。</div>'}
          </div>
        </div>

        <div class="card">
          <div class="card-head"><div class="card-title">收款登记<span class="hint">登记 ≠ 入账，确认后才生成课时</span></div></div>
          <div class="card-body">
            ${regs.length ? regs.map(r => `
              <div class="m-row" style="display:block">
                <div class="flex jcb aic"><b class="mono">${Proto.money(r.amount)}</b>
                  <span class="tag tag-${r.status === S.PAY_REG.CONFIRMED ? 'green' : (r.status === S.PAY_REG.REJECTED ? 'red' : 'amber')}">${r.status}</span></div>
                <div class="small muted mt4">${esc(r.method)} · ${esc(r.registeredBy)} · ${esc(r.registeredAt)}</div>
                <div class="small mt4">${esc(r.voucherNo ? '凭证 ' + r.voucherNo + ' · ' : '')}${esc(r.note || '')}</div>
                ${r.status === S.PAY_REG.PENDING ? `<div class="mt8"><button class="btn btn-sm btn-primary" onclick="confirmReg('${r.id}')">确认并入账</button>
                  <button class="btn btn-sm" onclick="rejectReg('${r.id}')">驳回</button></div>` : ''}
              </div>`).join('')
              : '<div class="small muted">暂无待确认登记。确认收款时才写入正式收款记录。</div>'}
          </div>
        </div>

        <div class="card">
          <div class="card-head"><div class="card-title">退款记录</div></div>
          <div class="card-body">
            ${refunds.length ? refunds.map(x => `
              <div class="m-row" style="display:block">
                <div class="flex jcb aic"><b class="mono">${Proto.money(x.request.amount)}</b>
                  <span class="tag tag-${x.request.status === S.REFUND.APPROVED ? 'green' : (x.request.status === S.REFUND.REJECTED ? 'red' : 'amber')}">${x.request.status}</span></div>
                <div class="small muted mt4">${esc(x.request.reason)} · ${esc(x.request.requestedBy)} · ${esc(x.request.requestedAt)}</div>
                ${x.request.reversedHours ? `<div class="small mt4">冲回 ${x.request.reversedHours} 课时 · ${esc(x.request.reviewedBy || '')}</div>` : ''}
              </div>`).join('')
              : '<div class="small muted">暂无退款申请。退款需管理员审核后才冲回课时。</div>'}
          </div>
        </div>

        <div class="card">
          <div class="card-head"><div class="card-title">操作日志</div></div>
          <div class="card-body">
            ${V.logs.length ? `<div class="timeline">${V.logs.map(l => `
              <div class="tl-item on"><div class="tl-head"><b>${esc(l.action)}</b>
                <span class="tl-time">${esc(l.at)} · ${esc(l.by || '系统')}</span></div>
                <div class="tl-body">${esc(l.detail || '')}</div></div>`).join('')}</div>`
              : '<div class="small muted">暂无日志</div>'}
          </div>
        </div>

        <div class="card">
          <div class="card-head"><div class="card-title">边界说明</div></div>
          <div class="card-body" style="font-size:12.5px;color:var(--text-2);line-height:1.9">
            · 第三方支付接入不在本轮范围，收款方式仅做登记；<br>
            · 一个订单允许多次收款，累计不得超过订单金额；每次确认按课时单价折算入账，尾差计入最后一笔；<br>
            · 退款需管理员审核：可退金额不超过已确认收款合计，按金额比例冲回课时，账户余额不得为负。
          </div>
        </div>
      </div>
    </div>`;
}

function review(pass) {
  let remark = '';
  if (!pass) { remark = prompt('请填写驳回原因'); if (!remark) return; }
  try { S.reviewOrder(ID, { pass: pass, reason: remark }); Proto.toast(pass ? '审核通过' : '已驳回', 'ok'); render(); }
  catch (e) { Proto.toast(e.message, 'err'); }
}
function openPay() {
  const o = S.order(ID);
  document.getElementById('p_amount').value = o.amount - (o.paidAmount || 0);
  document.getElementById('payTip').textContent =
    `订单应收 ${Proto.money(o.amount)} · 已收 ${Proto.money(o.paidAmount || 0)} · ${o.totalHours} 课时。可多次收款，累计不得超过应收；确认后按单价折算入账。`;
  Proto.openModal('payModal');
}
function confirmPay() {
  try {
    const v = S.confirmOrderPayment(ID, {
      method: document.getElementById('p_method').value,
      amount: document.getElementById('p_amount').value,
      note: document.getElementById('p_note').value.trim() || '管理员确认收款'
    });
    Proto.closeModal('payModal');
    Proto.toast('已确认收款：累计 ' + Proto.money(v.order.paidAmount) + ' / ' + Proto.money(v.order.amount) +
      '，累计入账 ' + v.order.creditedHours + ' / ' + v.order.totalHours + ' 课时', 'ok');
    render();
  } catch (e) { Proto.toast(e.message, 'err'); }
}
function confirmReg(regId) {
  try {
    const v = S.confirmRegisteredPayment(regId);
    Proto.toast('已确认登记：累计入账 ' + v.order.creditedHours + ' / ' + v.order.totalHours + ' 课时', 'ok');
    render();
  } catch (e) { Proto.toast(e.message, 'err'); }
}
function rejectReg(regId) {
  const reason = prompt('请填写驳回收款登记的原因');
  if (!reason) return;
  try { S.rejectRegisteredPayment(regId, { reason: reason }); Proto.toast('已驳回收款登记', 'ok'); render(); }
  catch (e) { Proto.toast(e.message, 'err'); }
}
function askRefund() {
  const o = S.order(ID);
  const max = (o.paidAmount || 0) - (o.refundedAmount || 0);
  const amount = prompt('可退上限 ' + Proto.money(max) + '，请输入退款金额');
  if (!amount) return;
  const reason = prompt('请填写退款原因');
  if (!reason) return;
  try { S.requestOrderRefund(ID, { amount: amount, reason: reason }); Proto.toast('退款申请已登记，待管理员审核', 'ok'); render(); }
  catch (e) { Proto.toast(e.message, 'err'); }
}
function reviewRefundNow() {
  const pending = S.refundRequestsOf({ orderId: ID, status: S.REFUND.PENDING });
  if (!pending.length) return;
  const r = pending[0].request;
  if (!confirm('审批退款 ' + Proto.money(r.amount) + '：' + r.reason + '？')) return;
  try {
    const res = S.reviewRefund(r.id, { pass: true, result: '同意退款 ' + Proto.money(r.amount) });
    Proto.toast('退款通过，冲回 ' + res.reversedHours + ' 课时，账户余额 ' + res.account.remain, 'ok');
    render();
  } catch (e) { Proto.toast(e.message, 'err'); }
}
render();
</script>
</body>
</html>
