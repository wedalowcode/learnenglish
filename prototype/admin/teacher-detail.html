<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教师详情</title>
<link rel="stylesheet" href="../assets/css/common.css">
<style>
  .avail-grid { display: grid; grid-template-columns: 76px repeat(3, 1fr); gap: 6px; font-size: 12.5px; }
  .avail-grid .h { color: var(--text-3); font-size: 12px; text-align: center; padding-bottom: 2px; }
  .avail-grid .d { color: var(--text-2); line-height: 34px; }
  .avail-cell {
    height: 34px; border-radius: 6px; border: 1px dashed var(--border-2);
    display: flex; align-items: center; justify-content: center; color: var(--text-3); font-size: 12px;
  }
  .avail-cell.on {
    border: 1px solid #bbf7d0; background: var(--success-soft); color: #15803d; font-weight: 600;
  }
  .coop-row { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-bottom: 1px dashed var(--border); font-size: 12.5px; }
  .coop-row:last-child { border-bottom: none; }
  .coop-row .who { flex: 0 0 168px; color: var(--text-3); }
  .big-name { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .plan-row { display: grid; grid-template-columns: 1fr 120px 150px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 12.5px; }
  .plan-row:last-child { border-bottom: none; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="page"></main>
  </div>
</div>

<!-- 分配学员 -->
<div class="drawer-mask" id="assign-mask" onclick="Proto.closeDrawer('assign')"></div>
<div class="drawer" id="assign">
  <div class="modal-head">
    <div class="modal-title">分配学员</div>
    <button class="modal-close" onclick="Proto.closeDrawer('assign')">×</button>
  </div>
  <div class="modal-body">
    <div class="alert alert-info mb16"><span class="ico">i</span>
      <div>分配后创建一条<b>师生负责关系</b>，学员的「当前教师」随之更新。
        同一学员同一时间只有一名负责教师；已有教师的学员请使用「更换教师」，不会直接覆盖。</div></div>
    <div class="field mb12"><label>选择学员 <span class="req">*</span></label>
      <select class="select" id="as_student"></select>
      <div class="tip">只列出当前没有负责教师的学员</div></div>
    <div class="field mb12"><label>生效日期</label>
      <input class="input" type="date" id="as_date"></div>
    <div class="field"><label>分配原因 <span class="req">*</span></label>
      <textarea class="textarea" id="as_reason" placeholder="如：新签学员，按擅长年级匹配"></textarea></div>
  </div>
  <div class="modal-foot">
    <button class="btn" onclick="Proto.closeDrawer('assign')">取消</button>
    <button class="btn btn-primary" onclick="doAssign()">确认分配</button>
  </div>
</div>

<!-- 学员更换教师 / 解除关系 -->
<div class="mask" id="stuModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="stuTitle">更换负责教师</div>
      <button class="modal-close" onclick="Proto.closeModal('stuModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="alert alert-warn mb16"><span class="ico">!</span>
        <div>更换教师会结束原负责关系并新建一条关系；<b>学员的历史课程仍显示当时的授课教师</b>。</div></div>
      <div class="desc g2 mb16" id="stuInfo"></div>
      <div class="field mb12"><label>新负责教师 <span class="req">*</span></label>
        <select class="select" id="stu_new"></select></div>
      <div class="field"><label>调整原因 <span class="req">*</span></label>
        <textarea class="textarea" id="stu_reason" placeholder="将写入关系记录，可追溯"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="Proto.closeModal('stuModal')">取消</button>
      <button class="btn btn-danger" onclick="doRelease()">解除关系</button>
      <button class="btn btn-primary" onclick="doTransfer()">确认更换</button>
    </div>
  </div>
</div>

<!-- 课程改派 -->
<div class="mask" id="courseModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">改派课程教师</div>
      <button class="modal-close" onclick="Proto.closeModal('courseModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="alert alert-info mb16"><span class="ico">i</span>
        <div>只有<b>未完成</b>的课程可以改派；已完成、已取消的课程保留原授课教师。</div></div>
      <div class="desc g2 mb16" id="ct_info"></div>
      <div class="field mb12"><label>新授课教师 <span class="req">*</span></label>
        <select class="select" id="ct_new"></select></div>
      <div class="field"><label>改派原因</label>
        <textarea class="textarea" id="ct_reason" placeholder="如：原教师临时请假"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="Proto.closeModal('courseModal')">取消</button>
      <button class="btn btn-primary" onclick="doReassignCourse()">确认改派</button>
    </div>
  </div>
</div>

<!-- 暂停合作 -->
<div class="mask" id="pauseModal">
  <div class="modal wide">
    <div class="modal-head">
      <div class="modal-title">暂停合作</div>
      <button class="modal-close" onclick="Proto.closeModal('pauseModal')">×</button>
    </div>
    <div class="modal-body" id="pauseBody"></div>
    <div class="modal-foot">
      <button class="btn" onclick="Proto.closeModal('pauseModal')">取消</button>
      <button class="btn btn-primary" onclick="doPause()">确认暂停合作</button>
    </div>
  </div>
</div>

<!-- 恢复合作 -->
<div class="mask" id="resumeModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">恢复合作</div>
      <button class="modal-close" onclick="Proto.closeModal('resumeModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="alert alert-info mb16"><span class="ico">i</span>
        <div>恢复后回到「可授课」。<b>暂停期间被解除的学员关系不会自动恢复</b>，需由教务重新确认分配。</div></div>
      <div class="field mb12"><label class="check"><input type="checkbox" id="r_account" checked> 继续使用原登录账号</label></div>
      <div class="field mb12"><label class="check"><input type="checkbox" id="r_cap" checked> 保留原教学能力资料（擅长年级 / 教材 / 可授课时间）</label></div>
      <div class="field mb12"><label class="check"><input type="checkbox" id="r_sched" checked> 重新开放排课与学员分配资格</label></div>
      <div class="field"><label>恢复备注</label>
        <textarea class="textarea" id="r_remark" placeholder="如：考试结束，可正常接课"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="Proto.closeModal('resumeModal')">取消</button>
      <button class="btn btn-primary" onclick="doResume()">确认恢复</button>
    </div>
  </div>
</div>

<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script>
Proto.shell({ role: 'admin', active: 'teacher-list' });
Store.setSession({ role: 'admin', operatorName: '张敏' });
const S = Store;

const QS = new URLSearchParams(location.search);
const TID = QS.get('id') || 'T001';
let T = S.teacher(TID);

if (!T) {
  document.getElementById('page').innerHTML = `
    <div class="page-head"><div><div class="crumb">教学管理<span class="sep">/</span>
      <a href="teacher-list.html">教师资源池</a><span class="sep">/</span>未找到</div>
      <h1 class="page-title">教师不存在</h1></div></div>
    <div class="card"><div class="empty"><div class="e-ico">▤</div>
      <p>没有找到编号为 <b class="mono">${TID}</b> 的教师档案</p>
      <div class="mt16"><a class="btn btn-primary" href="teacher-list.html">返回教师列表</a></div>
    </div></div>`;
} else {
  boot();
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function coopTag(s) { return `<span class="tag tag-${S.COOP_TONE[s] || 'slate'}">${s}</span>`; }
function accTag(s) { return `<span class="tag tag-${S.ACCOUNT_TONE[s] || 'slate'} nodot">${s}</span>`; }
function dash(v) { return v ? esc(v) : '<span class="muted">未填写</span>'; }

function boot() {
  T = S.teacher(TID);
  const st = S.teacherStat(TID);
  const acc = S.accountOf(TID);
  const chk = S.activationCheck(TID);
  const alerts = S.teacherAlerts(TID);

  document.getElementById('page').innerHTML = `
    <div class="page-head">
      <div>
        <div class="crumb">教学管理<span class="sep">/</span>
          <a href="teacher-list.html">教师资源池</a><span class="sep">/</span>${esc(T.name)}</div>
        <h1 class="page-title">${esc(T.name)}
          ${coopTag(T.cooperationStatus)}
          ${accTag(st.accountStatus)}
        </h1>
        <div class="page-sub">
          ${T.code} · ${T.grades.length ? T.grades.join(' / ') : '年级未填写'} ·
          ${T.textbooks.length ? T.textbooks.join('、') : '教材未填写'} ·
          合作开始 ${T.lastCooperationStartAt || '—'} · ${T.phone}
        </div>
      </div>
      <div class="page-actions">
        <a class="btn" href="teacher-list.html">返回</a>
        <a class="btn" href="teacher-form.html?id=${T.id}">编辑资料</a>
        ${T.cooperationStatus === S.COOP.READY
          ? `<button class="btn" onclick="openAssign()">分配学员</button>
             <button class="btn" onclick="openPause()">暂停合作</button>`
          : ''}
        ${T.cooperationStatus === S.COOP.PENDING
          ? `${st.accountStatus === S.ACCOUNT.NONE
              ? `<button class="btn" onclick="doOpenAccount()">开通账号</button>` : ''}
             <button class="btn btn-primary" onclick="doActivate()">启用教师</button>`
          : ''}
        ${T.cooperationStatus === S.COOP.PAUSED
          ? `<button class="btn btn-primary" onclick="openResume()">恢复合作</button>
             <a class="btn btn-danger" href="teacher-exit.html?id=${T.id}">退出合作</a>`
          : ''}
        ${T.cooperationStatus === S.COOP.EXITED
          ? `<button class="btn btn-primary" onclick="doRejoin()">重新加入</button>` : ''}
      </div>
    </div>

    ${statusBanner(chk, alerts, acc)}

    <div class="grid g4 mb16">
      <div class="card stat"><div class="stat-label">当前负责学员</div>
        <div class="stat-value">${st.currentStudents}<small>人</small></div>
        <div class="stat-foot">${S.currentStudentsOf(TID).map(x => esc(x.student.name)).join('、') || '暂无'}</div></div>
      <div class="card stat"><div class="stat-label">本月完成课程</div>
        <div class="stat-value">${st.monthCourses}<small>节</small></div>
        <div class="stat-foot">按已完成课程统计</div></div>
      <div class="card stat"><div class="stat-label">本月授课课时</div>
        <div class="stat-value">${st.monthHours}<small>课时</small></div>
        <div class="stat-foot">按课程实际时长折算</div></div>
      <div class="card stat"><div class="stat-label">最近授课</div>
        <div class="stat-value" style="font-size:19px">${st.lastCourseAt || '从未'}</div>
        <div class="stat-foot">累计 ${st.doneCourses} 节 / ${st.doneHours} 课时</div></div>
    </div>

    <div class="card">
      <div class="tabs" id="ttabs">
        <button class="tab active" data-pane="t1">基础资料</button>
        <button class="tab" data-pane="t2">教学能力</button>
        <button class="tab" data-pane="t3">当前学员<span class="count">${st.currentStudents}</span></button>
        <button class="tab" data-pane="t4">历史学员<span class="count">${S.historyStudentsOf(TID).length}</span></button>
        <button class="tab" data-pane="t5">课程安排<span class="count">${S.coursesOfTeacher(TID).filter(c => c.date >= S.TODAY).length}</span></button>
        <button class="tab" data-pane="t6">授课记录<span class="count">${st.doneCourses}</span></button>
        <button class="tab" data-pane="t7">合作记录</button>
        <button class="tab" data-pane="t8">教学统计</button>
      </div>

      <div class="tab-pane active" id="t1">${paneBasic(acc)}</div>
      <div class="tab-pane" id="t2">${paneCapability()}</div>
      <div class="tab-pane" id="t3">${paneCurrentStudents()}</div>
      <div class="tab-pane" id="t4">${paneHistoryStudents()}</div>
      <div class="tab-pane" id="t5">${paneCourses()}</div>
      <div class="tab-pane" id="t6">${paneRecords()}</div>
      <div class="tab-pane" id="t7">${paneCoop()}</div>
      <div class="tab-pane" id="t8">${paneStats(st)}</div>
    </div>`;

  fitDrawerOptions();
  if (QS.get('assign') === '1') openAssign();
  if (QS.get('pause') === '1') openPause();
  if (QS.get('focus') === 'activation') {
    Proto.toast('已恢复原档案，请开通账号或补充资料后启用', 'warn');
  }
}

/* ---------- 顶部状态横幅 ---------- */
function statusBanner(chk, alerts, acc) {
  if (T.cooperationStatus === S.COOP.PAUSED) {
    const p = T.pauseInfo || {};
    return `<div class="alert alert-warn mb16"><span class="ico">!</span>
      <div><b>暂停合作中</b>：${esc(p.reason || '—')}<br>
        暂停开始 ${p.startAt || '—'} · 预计恢复 ${p.expectResumeAt || '未填写'} ·
        操作人 ${esc(p.by || '—')}<br>
        当前仍负责 <b>${alerts.students}</b> 名学员（已标记需教务关注），
        未来课程 <b>${alerts.future}</b> 节。暂停期间不参与新排课与新学员分配。</div></div>`;
  }
  if (T.cooperationStatus === S.COOP.EXITED) {
    return `<div class="alert alert-danger mb16"><span class="ico">!</span>
      <div><b>已退出合作</b>，账号${acc ? '已禁用' : '未开通'}，不能再分配学员或排课。
        档案、历史课程、教学记录与学习报告全部保留；如再次合作请使用「重新加入」复用本档案。</div></div>`;
  }
  if (T.cooperationStatus === S.COOP.PENDING) {
    return `<div class="alert alert-warn mb16"><span class="ico">!</span>
      <div><b>待启用</b>：${chk.ready ? '启用条件已满足，可以启用。' : '还缺少：' + esc(chk.missing.join('；'))}
        待启用期间可以查看档案、完善资料，但<b>不能分配学员、不能创建有效排课</b>。</div></div>`;
  }
  if (alerts.attention) {
    return `<div class="alert alert-info mb16"><span class="ico">i</span>
      <div>有 <b>${alerts.attention}</b> 名学员关系被标记为需教务关注。</div></div>`;
  }
  return '';
}

/* ---------- Tab 1 基础资料 ---------- */
function paneBasic(acc) {
  const logs = S.changeLogsOf(TID);
  const FIELD = {
    name: '姓名', phone: '手机号', gender: '性别', school: '学校', major: '专业',
    education: '学历', introduction: '个人简介', remark: '备注', grades: '擅长年级',
    textbooks: '擅长教材', teachingTags: '教学方向', teachingExperience: '教学经验',
    teachingStyle: '教学特点', availability: '可授课时间', accountId: '登录账号'
  };
  return `
    <div class="grid g2" style="gap:24px">
      <div>
        <div class="section-title">教师信息</div>
        <div class="desc g1">
          <div class="desc-item"><span class="k">教师编号</span><span class="v mono">${T.code}</span></div>
          <div class="desc-item"><span class="k">姓名</span><span class="v">${esc(T.name)}</span></div>
          <div class="desc-item"><span class="k">手机号</span><span class="v mono">${T.phone}</span></div>
          <div class="desc-item"><span class="k">性别</span><span class="v">${dash(T.gender)}</span></div>
          <div class="desc-item"><span class="k">学校</span><span class="v">${dash(T.school)}</span></div>
          <div class="desc-item"><span class="k">专业</span><span class="v">${dash(T.major)}</span></div>
          <div class="desc-item"><span class="k">学历</span><span class="v">${dash(T.education)}</span></div>
          <div class="desc-item"><span class="k">合作状态</span><span class="v">${coopTag(T.cooperationStatus)}</span></div>
          <div class="desc-item"><span class="k">账号状态</span><span class="v">${accTag(S.accountStatusOf(TID))}
            ${acc ? `<span class="muted small">登录名 ${acc.loginName}</span>` : ''}</span></div>
          <div class="desc-item"><span class="k">合作开始</span><span class="v">${T.lastCooperationStartAt || '—'}</span></div>
          <div class="desc-item"><span class="k">合作结束</span><span class="v">${T.cooperationEndAt || '—'}</span></div>
          <div class="desc-item"><span class="k">首次加入</span><span class="v">${T.firstCooperationAt || '—'}</span></div>
          <div class="desc-item"><span class="k">创建时间</span><span class="v small muted">${T.createdAt} · ${esc(T.createdBy || '—')}</span></div>
        </div>
      </div>
      <div>
        <div class="section-title">个人简介</div>
        <div style="background:var(--bg);border-radius:6px;padding:10px 12px;font-size:13px;color:var(--text-2);line-height:1.8">
          ${T.introduction ? esc(T.introduction) : '<span class="muted">未填写</span>'}
        </div>
        <div class="section-title mt16">备注</div>
        <div class="small muted">${T.remark ? esc(T.remark) : '无'}</div>

        <div class="section-title mt16">登录账号</div>
        <div class="small" style="line-height:1.9">
          ${acc ? `账号 ID <span class="mono">${acc.id}</span> · 登录名 <span class="mono">${acc.loginName}</span>
            · 角色 ${acc.roleId} · 开通于 ${acc.openedAt || '—'}（${esc(acc.openedBy || '—')}）
            <br>账号与教师档案通过 accountId 关联，<b>不作为教师业务标识</b>。` :
            '<span class="muted">尚未开通登录账号，教师无法进入教学工作台。</span>'}
        </div>
        <div class="mt12 flex gap8">
          ${!acc && T.cooperationStatus !== S.COOP.EXITED
            ? `<button class="btn btn-sm btn-primary" onclick="doOpenAccount()">开通登录账号</button>` : ''}
          ${acc && acc.status === S.ACCOUNT.OK && T.cooperationStatus === S.COOP.READY
            ? `<button class="btn btn-sm" onclick="doDisableAccount()">禁用登录</button>` : ''}
        </div>
      </div>
    </div>

    <div class="divider"></div>
    <div class="flex jcb aic mb12">
      <div class="section-title mt0">资料变更记录</div>
      <span class="small muted">关键字段修改留痕，历史课程不受姓名/手机号变更影响</span>
    </div>
    <div class="table-wrap">
      <table class="table compact">
        <thead><tr><th style="width:180px">时间</th><th style="width:110px">字段</th>
          <th>修改前</th><th>修改后</th><th style="width:110px">操作人</th></tr></thead>
        <tbody>
          ${logs.length ? logs.slice(0, 20).map(l => `
            <tr>
              <td class="small muted mono">${l.createdAt}</td>
              <td>${FIELD[l.fieldName] || l.fieldName}</td>
              <td class="small muted">${esc(l.oldValue) || '—'}</td>
              <td class="small">${esc(l.newValue) || '—'}</td>
              <td class="small">${esc(l.operatorId)}</td>
            </tr>`).join('') :
            `<tr><td colspan="5"><div class="empty"><div class="e-ico">▤</div><p>还没有资料变更记录</p></div></td></tr>`}
        </tbody>
      </table>
    </div>`;
}

/* ---------- Tab 2 教学能力 ---------- */
function paneCapability() {
  const has = (d, p) => T.availability.some(a => a.weekday === d && a.period === p);
  const rows = S.WEEKDAYS.map(d => `
    <div class="d">${d}</div>
    ${S.PERIODS.map(p => `<div class="avail-cell ${has(d, p) ? 'on' : ''}">
      ${has(d, p) ? '可授课' : '—'}</div>`).join('')}`).join('');
  return `
    <div class="grid g2" style="gap:24px">
      <div>
        <div class="section-title">擅长与方向</div>
        <div class="desc g1">
          <div class="desc-item"><span class="k">擅长年级</span><span class="v">
            ${T.grades.length ? T.grades.join('、') : '<span class="muted">未填写</span>'}</span></div>
          <div class="desc-item"><span class="k">擅长教材</span><span class="v">
            ${T.textbooks.length ? T.textbooks.join('、') : '<span class="muted">未填写</span>'}</span></div>
          <div class="desc-item"><span class="k">教学方向</span><span class="v">
            ${T.teachingTags.length

function paneStats(st) {
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(S.TODAY.slice(0, 4), Number(S.TODAY.slice(5, 7)) - 1 - i, 1);
    months.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
  }
  const vals = months.map(m => (st.monthsBy[m] ? st.monthsBy[m].count : 0));
  const max = Math.max.apply(null, vals.concat([1]));
  return `
    <div class="grid g4 mb16">
      <div class="card stat"><div class="stat-label">累计授课课程</div>
        <div class="stat-value">${st.doneCourses}<small>节</small></div>
        <div class="stat-foot">全部已完成课程</div></div>
      <div class="card stat"><div class="stat-label">累计授课课时</div>
        <div class="stat-value">${st.doneHours}<small>课时</small></div>
        <div class="stat-foot">按课程时长折算</div></div>
      <div class="card stat"><div class="stat-label">累计负责学员</div>
        <div class="stat-value">${st.totalStudents}<small>人</small></div>
        <div class="stat-foot">当前负责 ${st.currentStudents} 人</div></div>
      <div class="card stat"><div class="stat-label">最近授课日期</div>
        <div class="stat-value" style="font-size:19px">${st.lastCourseAt || '从未'}</div>
        <div class="stat-foot">课程完成率 ${st.completionRate}%</div></div>
    </div>
    <div class="grid g2">
      <div class="card">
        <div class="card-head"><div class="card-title">近 6 个月完成课程</div>
          <span class="small muted">按课程表实时统计</span></div>
        <div class="card-body">
          <div class="bars">
            ${months.map((m, i) => `
              <div class="b"><i style="height:${Math.round(vals[i] / max * 88)}%"></i>
                <span>${Number(m.slice(5))}月</span></div>`).join('')}
          </div>
          <div class="small muted mt8">对应节数：${months.map((m, i) => Number(m.slice(5)) + '月 ' + vals[i] + ' 节').join(' · ')}</div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">课程质量指标</div></div>
        <div class="card-body">
          <div class="flex jcb small mb8"><span>课程完成率</span><span class="mono">${st.completionRate}%</span></div>
          <div class="bar green mb16"><i style="width:${st.completionRate}%"></i></div>
          <div class="flex jcb small mb8"><span>取消 / 未上课</span>
            <span class="mono">${st.cancelledCourses} / ${st.missedCourses} 节</span></div>
          <div class="bar amber mb16"><i style="width:${st.courses ? Math.round((st.cancelledCourses + st.missedCourses) / st.courses * 100) : 0}%"></i></div>
          <div class="flex jcb small mb8"><span>已生成学习报告</span><span class="mono">${st.reportCount} 份</span></div>
          <div class="bar mb16"><i style="width:${st.reportCount ? Math.min(100, Math.round(st.reportCount / Math.max(1, st.doneCourses) * 100)) : 0}%"></i></div>
          <div class="small muted">口径：完成率 = 已完成 /（已完成 + 取消 + 未上课）；所有数字来自课程表与师生关系，不存静态值。</div>
        </div>
      </div>
    </div>`;
}

function openPause() {
  const future = S.futureCoursesOf(TID);
  const pool = S.teacherPool();
  const students = S.currentStudentsOf(TID);
  const rows = future.map(c => `
    <div class="plan-row" data-course="${c.id}">
      <div>
        <div class="strong small">${c.date} ${c.start}-${c.end} · ${esc(c.student)}</div>
        <div class="small muted">${c.id} · ${c.type} · ${c.status}</div>
      </div>
      <select class="select" data-act="${c.id}" onchange="togglePauseTarget('${c.id}')">
        <option value="keep">保留（待确认）</option>
        <option value="reassign">改派教师</option>
        <option value="cancel">取消课程</option>
      </select>
      <select class="select" data-to="${c.id}" disabled>
        <option value="">选择接替教师</option>
        ${pool.map(p => `<option value="${p.teacher.id}">${esc(p.teacher.name)}（${p.stat.currentStudents} 人）</option>`).join('')}
      </select>
    </div>`).join('');

  document.getElementById('pauseBody').innerHTML = `
    <div class="alert alert-warn mb16"><span class="ico">!</span>
      <div>暂停<b>不是</b>退出：档案、历史课程、教学记录全部保留；当前 ${students.length} 名学员关系保留并标记为需教务关注。</div></div>
    <div class="form-grid g3">
      <div class="field"><label>暂停原因 <span class="req">*</span></label>
        <input class="input" id="p_reason" placeholder="如：备考 / 实习 / 个人原因"></div>
      <div class="field"><label>暂停开始日期 <span class="req">*</span></label>
        <input class="input" type="date" id="p_start" value="${S.TODAY}"></div>
      <div class="field"><label>预计恢复日期</label>
        <input class="input" type="date" id="p_resume"></div>
      <div class="field full"><label>备注</label>
        <input class="input" id="p_remark" placeholder="补充说明，将写入合作记录"></div>
    </div>
    <div class="divider"></div>
    <div class="flex jcb aic mb8">
      <div class="section-title mt0">未来有效课程（${future.length} 节）</div>
      <span class="small muted">有未来预约时必须逐节决定保留 / 改派 / 取消</span>
    </div>
    ${future.length ? rows : '<div class="alert alert-info"><span class="ico">i</span><div>该教师没有未来有效课程，可直接暂停。</div></div>'}
    <div id="pauseErr"></div>`;
  Proto.openModal('pauseModal');
}

function togglePauseTarget(cid) {
  const act = document.querySelector(`[data-act="${cid}"]`).value;
  const sel = document.querySelector(`[data-to="${cid}"]`);
  sel.disabled = act !== 'reassign';
  if (act !== 'reassign') sel.value = '';
}

function doPause() {
  const future = S.futureCoursesOf(TID);
  const courses = {};
  for (const c of future) {
    const act = document.querySelector(`[data-act="${c.id}"]`).value;
    const to = document.querySelector(`[data-to="${c.id}"]`).value;
    if (act === 'reassign' && !to) {
      document.getElementById('pauseErr').innerHTML =
        `<div class="alert alert-danger mt12"><span class="ico">!</span><div>课程 ${c.id} 选择了改派，但还没有选择接替教师。</div></div>`;
      return;
    }
    courses[c.id] = { action: act, toTeacherId: to };
  }
  try {
    S.pauseTeacher(TID, {
      reason: document.getElementById('p_reason').value.trim(),
      startAt: document.getElementById('p_start').value,
      expectResumeAt: document.getElementById('p_resume').value,
      remark: document.getElementById('p_remark').value.trim(),
      courses: courses
    });
    Proto.closeModal('pauseModal');
    Proto.toast('已暂停合作，学员关系保留并标记关注', 'ok');
    boot();
  } catch (e) {
    document.getElementById('pauseErr').innerHTML =
      `<div class="alert alert-danger mt12"><span class="ico">!</span><div>${e.message}</div></div>`;
    Proto.toast(e.message, 'err');
  }
}

function openResume() {
  document.getElementById('r_remark').value = '';
  Proto.openModal('resumeModal');
}

function doResume() {
  try {
    S.resumeTeacher(TID, {
      useSameAccount: document.getElementById('r_account').checked,
      reason: '暂停结束，教务确认恢复',
      remark: document.getElementById('r_remark').value.trim()
    });
    Proto.closeModal('resumeModal');
    Proto.toast('已恢复合作，原学员关系不会自动恢复', 'ok');
    boot();
  } catch (e) { Proto.toast(e.message, 'err'); }
}

function doRejoin() {
  Proto.confirmBox('重新加入',
    `确认让 <b>${T.name}</b> 重新加入？<br><br>
     · 复用原教师档案与编号 <b>${T.code}</b>，不会新建重复教师<br>
     · 历史合作记录、历史课程全部保留<br>
     · 状态先回到「待启用」，需走完启用流程才能接课`,
    '确认重新加入', () => {
      try {
        S.rejoinTeacher(TID, { reason: '已退出教师再次加入，复用原档案' });
        Proto.toast('已恢复原档案，当前状态：待启用', 'ok');
        boot();
      } catch (e) { Proto.toast(e.message, 'err'); }
    });
}

/* ---------- 学员分配 / 更换 / 解除 ---------- */
function fitDrawerOptions() {
  const free = S.students().filter(s => !S.activeRelationOfStudent(s.id));
  document.getElementById('as_student').innerHTML = free.length
    ? `<option value="">请选择学员</option>` + free.map(s =>
      `<option value="${s.id}">${esc(s.name)} · ${esc(s.grade)} · 剩余 ${s.remain} 课时</option>`).join('')
    : `<option value="">没有待分配的学员</option>`;
  document.getElementById('as_date').value = S.TODAY;
  document.getElementById('as_reason').value = '';
}

function openAssign() {
  fitDrawerOptions();
  Proto.openDrawer('assign');
}

function doAssign() {
  const sid = document.getElementById('as_student').value;
  const reason = document.getElementById('as_reason').value.trim();
  if (!sid) { Proto.toast('请选择要分配的学员', 'err'); return; }
  try {
    S.assignStudent(TID, sid, { reason: reason, startAt: document.getElementById('as_date').value });
    Proto.closeDrawer('assign');
    Proto.toast('已分配，学员当前教师已更新', 'ok');
    boot();
  } catch (e) { Proto.toast(e.message, 'err'); }
}

let stuTarget = null;
function openStu(sid, releaseMode) {
  stuTarget = sid;
  const s = S.student(sid);
  const cur = S.activeRelationOfStudent(sid);
  const curT = cur ? S.teacher(cur.teacherId) : null;
  document.getElementById('stuTitle').textContent = releaseMode ? '解除师生关系' : '更换负责教师';
  document.getElementById('stuInfo').innerHTML = `
    <div class="desc-item"><span class="k">学员</span><span class="v">${esc(s.name)} · ${esc(s.grade)}</span></div>
    <div class="desc-item"><span class="k">当前教师</span><span class="v">${curT ? esc(curT.name) : '未分配'}</span></div>
    <div class="desc-item"><span class="k">负责开始</span><span class="v mono">${cur ? cur.startAt : '—'}</span></div>
    <div class="desc-item"><span class="k">分配原因</span><span class="v small muted">${cur ? esc(cur.assignReason) : '—'}</span></div>`;
  document.getElementById('stu_new').innerHTML = `<option value="">请选择教师</option>` +
    S.teacherPool().filter(p => p.teacher.id !== TID)
      .map(p => `<option value="${p.teacher.id}">${esc(p.teacher.name)}（当前 ${p.stat.currentStudents} 人 · ${p.teacher.grades.join('/')}）</option>`).join('');
  document.getElementById('stu_reason').value = '';
  Proto.openModal('stuModal');
}

function doTransfer() {
  const to = document.getElementById('stu_new').value;
  const reason = document.getElementById('stu_reason').value.trim();
  if (!to) { Proto.toast('请选择新的负责教师', 'err'); return; }
  try {
    S.transferStudent(stuTarget, to, { reason: reason });
    Proto.closeModal('stuModal');
    Proto.toast('已更换负责教师，历史课程授课教师不变', 'ok');
    boot();
  } catch (e) { Proto.toast(e.message, 'err'); }
}

function doRelease() {
  const reason = document.getElementById('stu_reason').value.trim();
  try {
    S.releaseStudent(stuTarget, { reason: reason });
    Proto.closeModal('stuModal');
    Proto.toast('已解除关系，学员进入待分配', 'ok');
    boot();
  } catch (e) { Proto.toast(e.message, 'err'); }
}

/* ---------- 课程改派 ---------- */
let courseTarget = null;
function openCourse(cid) {
  courseTarget = cid;
  const c = S.course(cid);
  document.getElementById('ct_info').innerHTML = `
    <div class="desc-item"><span class="k">课程</span><span class="v mono">${c.id}</span></div>
    <div class="desc-item"><span class="k">时间</span><span class="v">${c.date} ${c.start}-${c.end}</span></div>
    <div class="desc-item"><span class="k">学员</span><span class="v">${esc(c.student)}</span></div>
    <div class="desc-item"><span class="k">当前教师</span><span class="v">${esc(c.teacher)}</span></div>`;
  document.getElementById('ct_new').innerHTML = `<option value="">请选择教师</option>` +
    S.teacherPool().filter(p => p.teacher.id !== TID)
      .map(p => `<option value="${p.teacher.id}">${esc(p.teacher.name)}（${p.stat.currentStudents} 人）</option>`).join('');
  document.getElementById('ct_reason').value = '';
  Proto.openModal('courseModal');
}

function doReassignCourse() {
  const to = document.getElementById('ct_new').value;
  const reason = document.getElementById('ct_reason').value.trim();
  if (!to) { Proto.toast('请选择接替教师', 'err'); return; }
  try {
    S.reassignCourse(courseTarget, to, { reason: reason });
    Proto.closeModal('courseModal');
    Proto.toast('课程已改派，操作已写入改派记录', 'ok');
    boot();
  } catch (e) { Proto.toast(e.message, 'err'); }
}
</script>
</body>
</html>
