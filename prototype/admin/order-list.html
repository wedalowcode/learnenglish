<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>订单管理</title>
<link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div>
          <div class="crumb">商品订单<span class="sep">/</span>订单管理</div>
          <h1 class="page-title">订单管理</h1>
          <div class="page-sub" id="sub">—</div>
        </div>
        <div class="page-actions">
          <button class="btn" onclick="Proto.toast('导出订单（示意）','ok')">导出</button>
          <a class="btn btn-primary" href="lead-list.html">从线索创建订单</a>
        </div>
      </div>

      <div class="grid g4 mb16" id="stats"></div>

      <div class="alert alert-warn mb16"><span class="ico">!</span>
        <div><b>课时口径：</b>只有「确认收款」动作会创建课时账户并入账；待审核/待收款订单一律不产生课时。
          收款金额必须与订单金额一致，部分收款不生成课时。</div></div>

      <div class="pill-tabs mb12" id="quickTabs">
        <button class="pill-tab on" data-tab="">全部</button>
        <button class="pill-tab" data-tab="pending">待审核</button>
        <button class="pill-tab" data-tab="reviewed">待收款</button>
        <button class="pill-tab" data-tab="credited">已入账</button>
      </div>
      <div id="payResult"></div>

      <div class="card filter">
        <div class="field"><label>订单 / 学员</label><input class="input" id="kw" placeholder="订单号或学员姓名" oninput="render()"></div>
        <div class="field"><label>订单状态</label>
          <select class="select" id="st" onchange="render()"><option value="">全部</option></select></div>
        <div class="field"><label>订单类型</label>
          <select class="select" id="tp" onchange="render()"><option value="">全部</option></select></div>
        <div class="field"><label>代理归属</label>
          <select class="select" id="ag" onchange="render()"><option value="">全部</option></select></div>
        <div class="filter-actions"><button class="btn btn-primary" onclick="render()">查询</button>
          <button class="btn" onclick="reset()">重置</button></div>
      </div>

      <div class="card mt16">
        <div class="card-body tight">
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th style="width:128px">订单编号</th><th>学员</th><th>套餐</th><th>类型</th>
                <th class="right">课时</th><th class="right">金额</th><th>代理归属</th><th>状态</th>
                <th>收款</th><th>时间</th><th style="width:170px">操作</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div class="pager"><span>共 <b id="total">0</b> 条</span></div>
        </div>
      </div>

    </main>
  </div>
</div>

<div class="mask" id="payModal">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">确认收款并入账</div>
      <button class="modal-close" onclick="Proto.closeModal('payModal')">×</button></div>
    <div class="modal-body">
      <div class="alert alert-warn mb16"><span class="ico">!</span>
        <div id="payTip">—</div></div>
      <div class="form-grid">
        <div class="field"><label>收款方式 <span class="req">*</span></label>
          <select class="select" id="p_method"></select></div>
        <div class="field"><label>收款金额（必须与订单一致）<span class="req">*</span></label>
          <input class="input" id="p_amount" type="number"></div>
        <div class="field full"><label>备注</label><input class="input" id="p_note" placeholder="如：家长微信转账，已核对"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="Proto.closeModal('payModal')">取消</button>
      <button class="btn btn-primary" onclick="confirmPay()">确认收款并入账</button>
    </div>
  </div>
</div>

<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script>
const S = Store;
S.setSession({ role: 'admin' });
Proto.shell({ role: 'admin', active: 'order-list' });

document.getElementById('st').innerHTML = '<option value="">全部</option>' +
  S.ORDER_STATUS.map(s => `<option>${s}</option>`).join('');
document.getElementById('tp').innerHTML = '<option value="">全部</option>' +
  Object.keys(S.ORDER_TYPE).map(k => `<option>${S.ORDER_TYPE[k]}</option>`).join('');
document.getElementById('ag').innerHTML = '<option value="">全部</option><option value="__none">机构直营</option>' +
  S.agents().map(a => `<option value="${a.id}">${a.name}（${a.id}）</option>`).join('');
document.getElementById('p_method').innerHTML = S.dictionaryOptions('pay_method').map(m => `<option>${m}</option>`).join('');

let payId = '';
let quickTab = (function () {
  const t = new URLSearchParams(location.search).get('tab');
  return ['pending', 'reviewed', 'credited'].indexOf(t) >= 0 ? t : '';
})();
document.querySelectorAll('#quickTabs .pill-tab').forEach(x => x.classList.toggle('on', x.dataset.tab === quickTab));
document.getElementById('quickTabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]');
  if (!b) return;
  quickTab = b.dataset.tab;
  document.querySelectorAll('#quickTabs .pill-tab').forEach(x => x.classList.toggle('on', x === b));
  render();
});

function reset() {
  ['kw'].forEach(id => document.getElementById(id).value = '');
  ['st', 'tp', 'ag'].forEach(id => document.getElementById(id).value = '');
  render();
}

function stats() {
  const rows = S.orderRows();
  const credited = rows.filter(r => r.order.status === S.ORDER.CREDITED);
  const pending = rows.filter(r => r.order.status === S.ORDER.PENDING);
  const reviewed = rows.filter(r => r.order.status === S.ORDER.REVIEWED);
  document.getElementById('stats').innerHTML = `
    <div class="card stat"><div class="stat-label">订单总数</div><div class="stat-value">${rows.length}</div>
      <div class="stat-foot">已入账 ${credited.length} 笔</div></div>
    <div class="card stat"><div class="stat-label">已入账金额</div><div class="stat-value">${Proto.money(credited.reduce((a, r) => a + Number(r.order.amount), 0))}</div>
      <div class="stat-foot">仅统计确认收款订单</div></div>
    <div class="card stat"><div class="stat-label">待审核</div><div class="stat-value" style="color:var(--warning)">${pending.length}</div>
      <div class="stat-foot">需管理员审核</div></div>
    <div class="card stat"><div class="stat-label">待收款</div><div class="stat-value" style="color:var(--warning)">${reviewed.length}</div>
      <div class="stat-foot">审核通过未收款</div></div>`;
  document.getElementById('sub').textContent =
    `全部 ${rows.length} 笔 · 待审核 ${pending.length} · 待收款 ${reviewed.length} · 已入账 ${credited.length}`;
}

function render() {
  stats();
  const kw = document.getElementById('kw').value.trim();
  const st = document.getElementById('st').value;
  const tp = document.getElementById('tp').value;
  const ag = document.getElementById('ag').value;
  let rows = S.orderRows({ kw: kw, status: st, type: tp });
  if (ag === '__none') rows = rows.filter(r => !r.order.agentId);
  else if (ag) rows = rows.filter(r => r.order.agentId === ag);
  const TQ = { pending: S.ORDER.PENDING, reviewed: S.ORDER.REVIEWED, credited: S.ORDER.CREDITED };
  if (quickTab && TQ[quickTab]) rows = rows.filter(r => r.order.status === TQ[quickTab]);
  document.getElementById('total').textContent = rows.length;

  Proto.renderRows('rows', rows, r => {
    const o = r.order;
    return `<tr>
      <td class="mono small"><a href="order-detail.html?id=${o.id}">${o.id}</a></td>
      <td class="strong">${r.studentName}</td>
      <td class="small">${o.productName}</td>
      <td class="small">${o.type}</td>
      <td class="right mono">${o.totalHours}</td>
      <td class="right mono">${Proto.money(o.amount)}</td>
      <td class="small">${r.agent ? r.agent.name + '（' + r.agent.id + '）' : '<span class="muted">机构直营</span>'}</td>
      <td><span class="tag tag-${S.ORDER_TONE[o.status] || 'slate'}">${o.status}</span></td>
      <td class="small">${o.payMethod || '—'}<br><span class="muted">${o.paidAmount ? Proto.money(o.paidAmount) : ''}</span></td>
      <td class="small muted">${o.createdAt}</td>
      <td class="ops">
        ${o.status === S.ORDER.PENDING ? `<button class="btn-link" onclick="review('${o.id}',true)">审核通过</button>
          <button class="btn-link danger" onclick="review('${o.id}',false)">驳回</button>` : ''}
        ${[S.ORDER.PENDING, S.ORDER.REVIEWED].indexOf(o.status) >= 0
          ? `<button class="btn-link" onclick="openPay('${o.id}')">确认收款</button>` : ''}
        <a class="btn-link" href="order-detail.html?id=${o.id}">详情</a>
      </td>
    </tr>`;
  }, 11, '没有符合条件的订单');
}

function review(id, pass) {
  let remark = '';
  if (!pass) { remark = prompt('请填写驳回原因'); if (!remark) return; }
  try {
    S.reviewOrder(id, { pass: pass, remark: remark });
    Proto.toast(pass ? '审核通过，订单进入待收款' : '订单已驳回', 'ok');
    render();
  } catch (e) { Proto.toast(e.message, 'err'); }
}

function openPay(id) {
  const o = S.order(id);
  payId = id;
  document.getElementById('p_amount').value = o.amount;
  document.getElementById('payTip').textContent =
    `订单 ${o.id} · ${o.productName} · 应收 ${Proto.money(o.amount)} · ${o.totalHours} 课时。确认后为学员创建课时账户并入账。`;
  Proto.openModal('payModal');
}
function confirmPay() {
  try {
    const ord0 = S.order(payId);
    const stu0 = ord0 ? S.student(ord0.studentId) : null;
    const o = S.confirmOrderPayment(payId, {
      method: document.getElementById('p_method').value,
      amount: document.getElementById('p_amount').value,
      note: document.getElementById('p_note').value.trim() || '管理员确认收款'
    });
    Proto.closeModal('payModal');
    const name = stu0 ? stu0.name : '';
    document.getElementById('payResult').innerHTML = `<div class="alert alert-success mb16" style="align-items:center">
      <span class="ico">✓</span>
      <div class="grow">订单 <b>${o.id}</b> 已收款并入账：已为学员 <b>${name}</b> 入账 <b>${o.totalHours}</b> 课时。</div>
      <a class="btn btn-sm" href="hour-account.html?student=${encodeURIComponent(name)}">查看课时账户</a>
    </div>`;
    Proto.toast(`已为学员入账 ${o.totalHours} 课时`, 'ok');
    render();
  } catch (e) { Proto.toast(e.message, 'err'); }
}
render();
</script>
</body>
</html>
