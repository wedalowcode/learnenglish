<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>客户线索</title>
<link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div>
          <div class="crumb">招生管理<span class="sep">/</span>客户线索</div>
          <h1 class="page-title">客户线索</h1>
          <div class="page-sub" id="sub">—</div>
        </div>
        <div class="page-actions">
          <button class="btn" onclick="Proto.toast('导出线索（示意）','ok')">导出</button>
          <a class="btn btn-primary" href="lead-detail.html?new=1">+ 新增线索</a>
        </div>
      </div>

      <div class="card filter">
        <div class="field"><label>客户姓名 / 手机号</label><input class="input" id="kw" placeholder="输入姓名或手机号" oninput="render()"></div>
        <div class="field"><label>来源渠道</label>
          <select class="select" id="ch" onchange="render()"><option value="">全部</option></select></div>
        <div class="field"><label>所属代理</label>
          <select class="select" id="ag" onchange="render()"><option value="">全部</option></select></div>
        <div class="field"><label>线索状态</label>
          <select class="select" id="st" onchange="render()"><option value="">全部</option></select></div>
        <div class="filter-actions">
          <button class="btn" id="btnPendingOwner" onclick="togglePendingOwner()">归属待审核</button>
          <button class="btn btn-primary" onclick="render()">查询</button>
          <button class="btn" onclick="reset()">重置</button>
        </div>
      </div>

      <div class="alert alert-warn mt16"><span class="ico">!</span>
        <div>客户重复报备时，系统只提示「可能存在重复线索」，归属由有权限的管理员确认，<b>不以最后报备者作为归属判定</b>。归属变更会写入线索日志。</div>
      </div>

      <div class="card mt16">
        <div class="card-head"><div class="card-title">线索列表<span class="hint" id="cnt"></span></div>
          <div class="small muted">已成交必须关联有效订单（收款确认后自动成交）</div></div>
        <div class="card-body tight">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr><th style="width:88px">线索编号</th><th>客户</th><th>联系电话</th><th>学生年级</th><th>意向课程</th>
                  <th>来源渠道</th><th>所属代理</th><th>跟进人</th><th>最近跟进</th><th>下次跟进</th><th>订单</th><th>状态</th><th style="width:150px">操作</th></tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div class="pager"><span>共 <b id="total">0</b> 条</span></div>
        </div>
      </div>

    </main>
  </div>
</div>

<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script>
const S = Store;
S.setSession({ role: 'admin' });
Proto.shell({ role: 'admin', active: 'lead-list' });

document.getElementById('st').innerHTML = '<option value="">全部</option>' +
  S.LEAD_STATUS.map(s => `<option>${s}</option>`).join('');
document.getElementById('ch').innerHTML = '<option value="">全部</option>' +
  Store.dictionaryOptions('lead_channel').map(c => `<option>${c}</option>`).join('');
document.getElementById('ag').innerHTML = '<option value="">全部</option><option value="__none">无（机构直营）</option>' +
  S.agents().map(a => `<option value="${a.id}">${a.name}（${a.id}）</option>`).join('');

let pendingOwnerOnly = false;
function togglePendingOwner() {
  pendingOwnerOnly = !pendingOwnerOnly;
  const b = document.getElementById('btnPendingOwner');
  if (b) b.classList.toggle('on', pendingOwnerOnly);
  render();
}

function reset() {
  ['kw'].forEach(id => document.getElementById(id).value = '');
  ['ch', 'ag', 'st'].forEach(id => document.getElementById(id).value = '');
  pendingOwnerOnly = false;
  const b = document.getElementById('btnPendingOwner');
  if (b) b.classList.remove('on');
  render();
}

function render() {
  const kw = document.getElementById('kw').value.trim();
  const ch = document.getElementById('ch').value;
  const ag = document.getElementById('ag').value;
  const st = document.getElementById('st').value;

  let rows = S.leads({ kw: kw, status: st });
  if (ch) rows = rows.filter(r => r.lead.channel === ch);
  if (ag === '__none') rows = rows.filter(r => !S.leadCurrentAgentId(r.lead));
  else if (ag) rows = rows.filter(r => S.leadCurrentAgentId(r.lead) === ag);

  /* 归属待审核：存在未裁定的归属争议（leadDisputes 状态=待裁定） */
  const pendingSet = {};
  try {
    S.leadDisputesOf({ status: S.DISPUTE.OPEN }).forEach(x => { pendingSet[x.dispute.leadId] = 1; });
  } catch (e) { /* 无权限或接口异常则忽略 */ }
  if (pendingOwnerOnly) rows = rows.filter(r => pendingSet[r.lead.id]);
  const pendCnt = Object.keys(pendingSet).length;
  const pb = document.getElementById('btnPendingOwner');
  if (pb) pb.textContent = '归属待审核' + (pendCnt ? ' (' + pendCnt + ')' : '');

  const counts = S.leadRowCounts();
  document.getElementById('sub').textContent =
    `全机构线索 ${S.leads().length} 条 · 跟进中 ${counts['跟进中']} · 意向 ${counts['意向明确']} · 成交 ${counts['已成交']}`;
  document.getElementById('cnt').textContent = `筛选结果 ${rows.length} 条`;
  document.getElementById('total').textContent = rows.length;

  Proto.renderRows('rows', rows, r => {
    const l = r.lead;
    const overdue = l.nextFollowAt && l.nextFollowAt.slice(0, 10) <= S.TODAY;
    return `<tr>
      <td class="mono small">${l.id}</td>
      <td class="strong"><a href="lead-detail.html?id=${l.id}">${l.name}</a></td>
      <td class="mono">${l.phone}</td>
      <td>${l.grade || '—'}</td>
      <td class="small">${l.intent || '—'}</td>
      <td>${l.channel}</td>
      <td>${(function () {
        const cur = r.agent ? r.agent.name + '（' + r.agent.id + '）' : '机构直营';
        const src = r.sourceAgent ? r.sourceAgent.name + '（' + r.sourceAgent.id + '）' : '机构直营';
        return cur + (src !== cur ? `<div class="small muted">首次：${src}</div>` : '');
      })()}</td>
      <td class="small">${l.followerName || '—'}</td>
      <td class="small muted">${(l.lastFollowAt || '—').slice(0, 16)}</td>
      <td class="small" ${overdue ? 'style="color:var(--danger)"' : ''}>${l.nextFollowAt ? l.nextFollowAt.slice(0, 10) : '—'}</td>
      <td class="small">${r.orders ? r.credited + '/' + r.orders + ' 已入账' : '—'}</td>
      <td><span class="tag tag-${S.LEAD_TONE[l.status] || 'slate'}">${l.status}</span></td>
      <td class="ops"><a class="btn-link" href="lead-detail.html?id=${l.id}">详情</a>
        <a class="btn-link" href="lead-detail.html?id=${l.id}#follow">跟进</a></td>
    </tr>`;
  }, 13, '没有符合条件的线索，请调整筛选条件');
}
render();
</script>
</body>
</html>
