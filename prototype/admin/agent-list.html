<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>代理管理</title>
<link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div>
          <div class="crumb">招生管理<span class="sep">/</span>代理管理</div>
          <h1 class="page-title">代理管理</h1>
          <div class="page-sub" id="sub">—</div>
        </div>
        <div class="page-actions">
          <button class="btn" onclick="Proto.toast('导出代理业绩（示意）','ok')">导出业绩</button>
          <button class="btn btn-primary" onclick="openForm()">+ 招募代理</button>
        </div>
      </div>

      <div class="alert alert-warn"><span class="ico">!</span>
        <div><b>佣金规则待业务确认：</b>按订单比例还是固定金额、何时确认佣金、退款如何冲回、结算周期，均列为待确认项。
        原型只展示规则文本与佣金预估，<b>不做自动结算</b>。</div>
      </div>

      <div class="card filter mt16">
        <div class="field"><label>姓名 / 手机号</label><input class="input" id="kw" placeholder="输入姓名或手机号" oninput="render()"></div>
        <div class="field"><label>代理状态</label>
          <select class="select" id="st" onchange="render()"><option value="">全部</option></select></div>
        <div class="filter-actions"><button class="btn btn-primary" onclick="render()">查询</button></div>
      </div>

      <div class="card mt16">
        <div class="card-body tight">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr><th style="width:70px">编号</th><th>姓名</th><th>手机号</th><th>类型</th><th>客户数</th>
                  <th class="right">成交客户</th><th class="right">成交订单</th><th class="right">成交金额</th>
                  <th class="right">佣金预估</th><th>规则</th><th>状态</th><th style="width:170px">操作</th></tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div class="pager"><span>共 <b id="total">0</b> 条</span></div>
        </div>
      </div>

    </main>
  </div>
</div>

<div class="mask" id="formModal">
  <div class="modal wide">
    <div class="modal-head"><div class="modal-title">招募代理</div>
      <button class="modal-close" onclick="Proto.closeModal('formModal')">×</button></div>
    <div class="modal-body">
      <div class="form-grid g3">
        <div class="field" id="f_name"><label>姓名 <span class="req">*</span></label><input class="input" id="i_name"><div class="err">请填写姓名</div></div>
        <div class="field" id="f_phone"><label>手机号 <span class="req">*</span></label><input class="input" id="i_phone" maxlength="11"><div class="err">请填写手机号</div></div>
        <div class="field"><label>微信号</label><input class="input" id="i_wechat"></div>
        <div class="field"><label>代理类型</label><select class="select" id="i_type"></select></div>
        <div class="field"><label>规则类型</label>
          <select class="select" id="i_ruleType">
            <option value="percent">按订单比例</option><option value="fixed">固定金额 / 单</option><option value="none">暂不确定</option>
          </select></div>
        <div class="field"><label>比例 / 金额</label><input class="input" id="i_ruleValue" placeholder="如 8 或 300"></div>
        <div class="field full"><label>规则说明 <span class="req">*</span></label>
          <input class="input" id="i_ruleText" placeholder="如 成交额 8%（确认时点与结算周期待业务确认）">
          <div class="tip">本轮只展示规则，不做完整结算</div></div>
        <div class="field full"><label>备注</label><textarea class="textarea" id="i_remark"></textarea></div>
      </div>
      <div class="alert alert-info mt16"><span class="ico">i</span>
        <div>招募后代理状态为「待审核」，审核通过（启用）后才能获客与提交报名订单。</div></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="Proto.closeModal('formModal')">取消</button>
      <button class="btn btn-primary" onclick="saveAgent()">保存</button>
    </div>
  </div>
</div>

<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script>
const S = Store;
S.setSession({ role: 'admin' });
Proto.shell({ role: 'admin', active: 'agent-list' });

document.getElementById('st').innerHTML = '<option value="">全部</option>' +
  S.AGENT_STATUS.map(s => `<option>${s}</option>`).join('');
document.getElementById('i_type').innerHTML = S.dictionaryOptions('agent_type').map(t => `<option>${t}</option>`).join('');

function render() {
  const kw = document.getElementById('kw').value.trim();
  const st = document.getElementById('st').value;
  const rows = S.agentsOf({ kw: kw, status: st }).filter(x => !st || x.agent.status === st);
  const all = S.agents();
  document.getElementById('sub').textContent =
    `共 ${all.length} 位代理 · 启用 ${all.filter(a => a.status === '启用').length} · 待审核 ${all.filter(a => a.status === '待审核').length} · 停用 ${all.filter(a => a.status === '停用').length}`;
  document.getElementById('total').textContent = rows.length;

  Proto.renderRows('rows', rows, x => {
    const a = x.agent, cm = x.commission || {};
    return `<tr>
      <td class="mono small">${a.id}</td>
      <td class="strong">${a.name}</td>
      <td class="mono">${a.phone}</td>
      <td class="small">${a.type}</td>
      <td class="mono">${x.customers}</td>
      <td class="right mono">${x.deals}</td>
      <td class="right mono">${x.orders}</td>
      <td class="right mono">${Proto.money(x.amount)}</td>
      <td class="right mono" style="color:var(--warning)">${Proto.money(cm.estimatedCommission || 0)}</td>
      <td class="small">${a.ruleText || '—'}</td>
      <td><span class="tag tag-${S.AGENT_TONE[a.status] || 'slate'}">${a.status}</span></td>
      <td class="ops">
        ${a.status === '待审核' ? `<button class="btn-link" onclick="review('${a.id}',true)">审核通过</button>
          <button class="btn-link danger" onclick="review('${a.id}',false)">驳回</button>`
          : `<button class="btn-link" onclick="toggle('${a.id}','${a.status}')">${a.status === '启用' ? '停用' : '启用'}</button>`}
        <button class="btn-link" onclick="showLogs('${a.id}')">流水</button>
      </td>
    </tr>`;
  }, 12, '没有符合条件的代理');
}

function openForm() { Proto.openModal('formModal'); }
function saveAgent() {
  const name = document.getElementById('i_name').value.trim();
  const phone = document.getElementById('i_phone').value.trim();
  let bad = false;
  Proto.markInvalid('f_name', !name); if (!name) bad = true;
  Proto.markInvalid('f_phone', !Proto.isPhone(phone)); if (!Proto.isPhone(phone)) bad = true;
  if (bad) { Proto.toast('请检查标红的必填项', 'err'); return; }
  try {
    const a = S.recruitAgent({
      name: name, phone: phone,
      wechat: document.getElementById('i_wechat').value.trim(),
      type: document.getElementById('i_type').value,
      ruleType: document.getElementById('i_ruleType').value,
      ruleValue: document.getElementById('i_ruleValue').value,
      ruleText: document.getElementById('i_ruleText').value.trim(),
      remark: document.getElementById('i_remark').value.trim()
    });
    Proto.closeModal('formModal');
    Proto.toast('代理 ' + a.name + '（' + a.id + '）已建档，等待审核', 'ok');
    render();
  } catch (e) { Proto.toast(e.message, 'err'); }
}
function review(id, pass) {
  let remark = '';
  if (!pass) {
    remark = prompt('请填写驳回原因');
    if (!remark) return;
  }
  try {
    S.reviewAgent(id, { pass: pass, remark: remark });
    Proto.toast(pass ? '代理审核通过，已启用' : '代理已驳回', 'ok');
    render();
  } catch (e) { Proto.toast(e.message, 'err'); }
}
function toggle(id, cur) {
  const to = cur === '启用' ? '停用' : '启用';
  let remark = '';
  if (to === '停用') {
    remark = prompt('请填写停用原因');
    if (!remark) return;
  }
  try {
    S.setAgentStatus(id, to, { remark: remark || '恢复启用' });
    Proto.toast('代理状态已变更为「' + to + '」', 'ok');
    render();
  } catch (e) { Proto.toast(e.message, 'err'); }
}
function showLogs(id) {
  const logs = S.agentLogsOf(id);
  Proto.confirmBox('代理操作流水',
    logs.length ? logs.map(l => `<div style="margin-bottom:6px"><b>${l.action}</b> · ${l.at} · ${l.by || '系统'}<br>
      <span style="color:#64748b">${l.detail || ''}</span></div>`).join('')
      : '暂无流水', '关闭', null);
}
render();
</script>
</body>
</html>
