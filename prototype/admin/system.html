<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>系统设置</title>
<link rel="stylesheet" href="../assets/css/common.css">
<style>
  .sys-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
  .sys-card { display:flex; flex-direction:column; gap:10px; padding:18px; border:1px solid var(--border); border-radius:12px; background:var(--surface); text-decoration:none; color:inherit; transition:.15s; }
  .sys-card:hover { border-color:var(--primary); box-shadow:0 8px 24px rgba(37,99,235,.08); transform:translateY(-1px); }
  .sys-card .glyph { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--primary-soft); color:#1d4ed8; font-weight:700; }
  .sys-card h3 { margin:0; font-size:15px; }
  .sys-card p { margin:0; font-size:12px; color:var(--text-3); line-height:1.6; }
  .sys-card .metric { margin-top:auto; font-size:12px; color:var(--text-2); }
  .sys-card .metric b { color:var(--primary); }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div>
          <div class="crumb">系统设置</div>
          <h1 class="page-title">系统设置</h1>
          <div class="page-sub">账号 · 角色权限 · 数据范围 · 操作审计 · 数据字典 · 消息通知 · 机构设置</div>
        </div>
        <div class="page-actions">
          <a class="btn" href="organization-settings.html">机构设置</a>
          <a class="btn btn-primary" href="account-list.html">+ 新增账号</a>
        </div>
      </div>

      <div id="migration" class="mb16"></div>
      <div id="noAccess" class="mb16"></div>

      <div class="alert alert-info mb16"><span class="ico">i</span>
        <div>角色是业务身份，<b>不等于固定权限</b>。账号、菜单、可执行操作与数据范围全部由同一份角色权限配置决定；禁用账号无法再切换为当前身份。</div></div>

      <div class="sys-grid" id="sysGrid"></div>
    </main>
  </div>
</div>

<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script>
const PAGE_ROLE = Proto.pageRole('admin');
const SHELL_ROLE = PAGE_ROLE === 'staff' ? 'admin' : PAGE_ROLE;
Proto.shell({ role: SHELL_ROLE, identityRole: PAGE_ROLE, active: 'system' });

(function () {
  const mi = Store.migrationInfo ? Store.migrationInfo() : null;
  if (mi) {
    document.getElementById('migration').innerHTML =
      '<div class="alert ' + (mi.ok ? 'alert-info' : 'alert-warn') + '"><span class="ico">' + (mi.ok ? 'i' : '!') + '</span><div>' +
      '<b>' + (mi.ok ? '本地数据已迁移到 v9' : 'v8 → v9 迁移未完成') + '</b>：' +
      Proto.escHtml(mi.strategy || '') + (mi.reason ? '（' + Proto.escHtml(mi.reason) + '）' : '') +
      '<div class="small muted" style="margin-top:4px">旧数据保留在 ' + Proto.escHtml(mi.backupKey || '') + '，不会删除。</div></div></div>';
  }

  const canAny = ['account.view', 'role.view', 'audit.view', 'dictionary.manage', 'notification.manage', 'organization.manage']
    .some(c => Store.hasPermission('', c));
  if (!canAny) {
    document.getElementById('noAccess').innerHTML =
      '<div class="alert alert-warn"><span class="ico">!</span><div>当前身份没有系统设置权限，请联系机构管理员授权。</div></div>';
    document.getElementById('sysGrid').style.display = 'none';
    return;
  }

  const acc = Store.accountSummary();
  const cards = [
    { glyph: '账', title: '账号管理', href: 'account-list.html',
      desc: '为已有员工、教师、代理、家长档案开通/启停登录账号，角色与数据范围随账号生效。',
      metric: '<b>' + acc.total + '</b> 个账号 · 启用 <b>' + acc.enabled + '</b> · 禁用 <b>' + acc.disabled + '</b>' },
    { glyph: '角', title: '角色与权限', href: 'role-list.html',
      desc: '按角色配置菜单与操作权限、数据范围；修改后对应身份的菜单和可执行操作立即收紧或放开。',
      metric: '<b>' + Store.roleRows().length + '</b> 个角色 · <b>' + Store.permissionCatalog().length + '</b> 项权限' },
    { glyph: '审', title: '操作日志', href: 'audit-log.html',
      desc: '报名、收款、退款、课时调整、教师分配、词库审核、角色变更、账号启停等关键操作全量留痕。',
      metric: '共 <b>' + Store.auditStat().total + '</b> 条 · 今日 <b>' + Store.auditStat().today + '</b> 条' },
    { glyph: '典', title: '数据字典', href: 'dictionary-list.html',
      desc: '获客渠道、支付方式、年级、教材等业务下拉的唯一来源；新增后业务表单立即可选。',
      metric: '<b>' + Store.dictionaryTypes().length + '</b> 类 · <b>' + Store.dictionaryTypes().reduce((n, t) => n + t.enabledCount, 0) + '</b> 个启用选项' },
    { glyph: '通', title: '消息通知', href: 'notification-settings.html',
      desc: '业务事件（订单待确认、课时不足、报告发布等）按模板生成站内通知，已读/未读可追踪。',
      metric: '<b>' + Store.notificationRules().filter(r => r.enabled).length + '</b> 条启用规则 · ' +
        '<b>' + Store.notificationRules().length + '</b> 条模板' },
    { glyph: '机', title: '机构设置', href: 'organization-settings.html',
      desc: '机构名称、校区、联系方式、课时预警阈值与套餐临期提醒天数。',
      metric: Proto.escHtml(Store.organizationSettings().name + ' · ' + Store.organizationSettings().campus) }
  ];
  document.getElementById('sysGrid').innerHTML = cards.map(c =>
    '<a class="sys-card" href="' + c.href + '"><div class="glyph">' + c.glyph + '</div>' +
    '<h3>' + c.title + '</h3><p>' + c.desc + '</p><div class="metric">' + c.metric + '</div></a>'
  ).join('');
})();
</script>
</body>
</html>
