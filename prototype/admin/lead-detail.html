<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>线索详情</title>
<link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="page">
      <div class="empty" style="padding:60px 20px"><div class="e-ico">▤</div><p>正在加载线索…</p></div>
    </main>
  </div>
</div>

<div class="mask" id="followModal">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">记录跟进</div>
      <button class="modal-close" onclick="Proto.closeModal('followModal')">×</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field"><label>跟进方式 <span class="req">*</span></label>
          <select class="select" id="f_type"></select></div>
        <div class="field"><label>下次跟进时间</label><input class="input" type="date" id="f_next"></div>
        <div class="field full"><label>沟通内容 <span class="req">*</span></label>
          <textarea class="textarea" id="f_content" placeholder="必填，记录客户诉求与你的回复"></textarea></div>
        <div class="field full"><label>推进状态（只能向前流转）</label>
          <select class="select" id="f_status"></select></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="Proto.closeModal('followModal')">取消</button>
      <button class="btn btn-primary" onclick="saveFollow()">保存跟进</button>
    </div>
  </div>
</div>

<div class="mask" id="orderModal">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">提交报名订单</div>
      <button class="modal-close" onclick="Proto.closeModal('orderModal')">×</button></div>
    <div class="modal-body">
      <div class="alert alert-info mb16"><span class="ico">i</span>
        <div>订单进入「待审核」；<b>管理员确认收款后才创建课时账户并入账</b>。未收款不产生任何课时。</div></div>
      <div class="field"><label>报名套餐 <span class="req">*</span></label>
        <select class="select" id="o_product"></select></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="Proto.closeModal('orderModal')">取消</button>
      <button class="btn btn-primary" onclick="submitOrder()">提交订单</button>
    </div>
  </div>
</div>

<div class="mask" id="assignModal">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">调整客户归属</div>
      <button class="modal-close" onclick="Proto.closeModal('assignModal')">×</button></div>
    <div class="modal-body">
      <div class="alert alert-warn mb16"><span class="ico">!</span>
        <div>归属调整会写入线索日志，原归属保留可追溯；成交归属仍以实际收款订单的代理为准。</div></div>
      <div class="field"><label>调整到代理</label><select class="select" id="a_agent"></select></div>
      <div class="field"><label>调整原因 <span class="req">*</span></label>
        <textarea class="textarea" id="a_reason" placeholder="必填，例如：重复报备核对后归属原报备人"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="Proto.closeModal('assignModal')">取消</button>
      <button class="btn btn-primary" onclick="saveAssign()">确认调整</button>
    </div>
  </div>
</div>

<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script>
const S = Store;
S.setSession({ role: 'admin' });
Proto.shell({ role: 'admin', active: 'lead-list' });
document.getElementById('f_type').innerHTML = S.dictionaryOptions('follow_type')
  .map(t => `<option>${t}</option>`).join('');

const Q = new URLSearchParams(location.search);
const LEAD_ID = Q.get('id') || '';
const IS_NEW = Q.get('new') === '1';
let VIEW = null;

function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function newForm() {
  document.getElementById('page').innerHTML = `
    <div class="page-head">
      <div><div class="crumb">招生管理<span class="sep">/</span><a href="lead-list.html">客户线索</a><span class="sep">/</span>新增线索</div>
        <h1 class="page-title">新增客户线索</h1>
        <div class="page-sub">机构代录线索：可指定代理归属；手机号重复会被 Store 阻断</div></div>
      <div class="page-actions"><a class="btn" href="lead-list.html">返回</a>
        <button class="btn btn-primary" onclick="createLead()">保存线索</button></div>
    </div>
    <div class="card"><div class="card-body">
      <div class="form-grid">
        <div class="field" id="f_name"><label>家长姓名 <span class="req">*</span></label><input class="input" id="i_name"><div class="err">请填写家长姓名</div></div>
        <div class="field" id="f_phone"><label>联系电话 <span class="req">*</span></label><input class="input" id="i_phone" maxlength="11"><div class="err">请输入 11 位手机号</div></div>
        <div class="field"><label>学生姓名</label><input class="input" id="i_kid"></div>
        <div class="field"><label>学生年级</label><select class="select" id="i_grade"><option value="">请选择</option>${S.TEACHER_GRADES.map(g => `<option>${g}</option>`).join('')}</select></div>
        <div class="field"><label>意向课程</label><select class="select" id="i_product"></select></div>
        <div class="field"><label>来源渠道</label><select class="select" id="i_channel">${S.dictionaryOptions('lead_channel').map(c => `<option>${c}</option>`).join('')}</select></div>
        <div class="field"><label>代理归属</label><select class="select" id="i_agent"></select></div>
        <div class="field"><label>备注</label><input class="input" id="i_remark"></div>
      </div>
      <div class="divider"></div>
      <div class="flex gap8" style="justify-content:flex-end">
        <a class="btn" href="lead-list.html">取消</a>
        <button class="btn btn-primary" onclick="createLead()">保存线索</button>
      </div>
    </div></div>`;
  document.getElementById('i_product').innerHTML = '<option value="">暂不确定</option>' +
    S.products().filter(p => p.status !== '停用').map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  document.getElementById('i_agent').innerHTML = '<option value="">机构直营</option>' +
    S.agents().filter(a => a.status === '启用').map(a => `<option value="${a.id}">${a.name}（${a.id}）</option>`).join('');
}

function createLead() {
  const name = document.getElementById('i_name').value.trim();
  const phone = document.getElementById('i_phone').value.trim();
  let bad = false;
  Proto.markInvalid('f_name', !name); if (!name) bad = true;
  Proto.markInvalid('f_phone', !Proto.isPhone(phone)); if (!Proto.isPhone(phone)) bad = true;
  if (bad) { Proto.toast('请检查标红的必填项', 'err'); return; }
  try {
    const p = S.product(document.getElementById('i_product').value);
    const lead = S.createLead({
      name: name, phone: phone,
      kidName: document.getElementById('i_kid').value.trim(),
      grade: document.getElementById('i_grade').value,
      channel: document.getElementById('i_channel').value,
      intent: p ? p.name : '', intentProductId: p ? p.id : '',
      agentId: document.getElementById('i_agent').value,
      followerId: S.currentSession().operatorId,
      followerName: '机构',
      remark: document.getElementById('i_remark').value.trim()
    });
    Proto.toast('线索 ' + lead.id + ' 已创建', 'ok');
    location.href = 'lead-detail.html?id=' + lead.id;
  } catch (e) { Proto.toast(e.message, 'err'); }
}

function render() {
  try { VIEW = S.leadView(LEAD_ID); }
  catch (e) {
    document.getElementById('page').innerHTML =
      `<div class="card"><div class="card-body"><div class="alert alert-warn"><span class="ico">!</span><div>${esc(e.message)}</div></div>
       <a class="btn mt12" href="lead-list.html">返回线索列表</a></div></div>`;
    return;
  }
  const L = VIEW.lead, STU = VIEW.student, AG = VIEW.agent, SRC = VIEW.sourceAgent;
  const dealOrder = VIEW.orders.filter(o => o.order.status === S.ORDER.CREDITED)
    .sort((a, b) => a.order.createdAt < b.order.createdAt ? 1 : -1)[0];
  const nexts = S.LEAD_NEXT[L.status] || [];
  const closed = [S.LEAD.DEAL, S.LEAD.INVALID, S.LEAD.CLOSED].indexOf(L.status) >= 0;

  document.getElementById('page').innerHTML = `
    <div class="page-head">
      <div>
        <div class="crumb">招生管理<span class="sep">/</span><a href="lead-list.html">客户线索</a><span class="sep">/</span>线索详情</div>
        <h1 class="page-title">${esc(L.name)} <span class="tag tag-${S.LEAD_TONE[L.status] || 'slate'}" style="font-size:12px;vertical-align:middle">${L.status}</span></h1>
        <div class="page-sub">${L.id} · ${esc(L.phone)} · ${esc(L.kidName || (STU ? STU.name : '—'))} · ${esc(L.grade || '—')} · 来源 ${esc(L.channel)}</div>
      </div>
      <div class="page-actions">
        <a class="btn" href="lead-list.html">返回</a>
        <button class="btn" onclick="openAssign()">调整归属</button>
        ${closed ? '' : '<button class="btn" onclick="openFollow()">记录跟进</button>'}
        ${[S.LEAD.TO_CONTACT, S.LEAD.FOLLOWING].indexOf(L.status) >= 0
          ? '<button class="btn btn-primary" onclick="toIntent()">转为意向</button>' : ''}
        ${L.status === S.LEAD.INTENT
          ? '<button class="btn btn-primary" onclick="openOrder()">创建报名订单</button>' : ''}
      </div>
    </div>

    ${STU ? `<div class="alert alert-success mb16" style="align-items:center">
      <span class="ico">✓</span>
      <div class="grow">学员 <b>${esc(STU.name)}</b> 已建档。下一步建议：分配负责教师 → 创建首单 / 排首课。</div>
      <a class="btn btn-sm" href="student-detail.html?id=${encodeURIComponent(STU.id)}">去分配教师</a>
      <a class="btn btn-sm" href="order-create.html?studentId=${encodeURIComponent(STU.id)}">创建订单</a>
      <a class="btn btn-sm" href="schedule-calendar.html">去排课</a>
    </div>` : ''}

    <div class="grid g-2-1" style="align-items:start">
      <div>
        <div class="card">
          <div class="card-head"><div class="card-title">客户基础信息</div>
            <span class="tag tag-amber nodot">意向等级：${esc(L.level || '—')}</span></div>
          <div class="card-body"><div class="desc g3">
            <div class="desc-item"><span class="k">家长姓名</span><span class="v">${esc(L.name)}</span></div>
            <div class="desc-item"><span class="k">联系电话</span><span class="v mono">${esc(L.phone)}</span></div>
            <div class="desc-item"><span class="k">学生姓名</span><span class="v">${esc(L.kidName || (STU ? STU.name : '—'))}</span></div>
            <div class="desc-item"><span class="k">学生年级</span><span class="v">${esc(L.grade || '—')}</span></div>
            <div class="desc-item"><span class="k">意向教材</span><span class="v">${esc(L.book || '—')}</span></div>
            <div class="desc-item"><span class="k">意向课程</span><span class="v">${esc(L.intent || '—')}</span></div>
            <div class="desc-item"><span class="k">下次跟进</span><span class="v">${esc(L.nextFollowAt ? L.nextFollowAt.slice(0, 16) : '—')}</span></div>
            <div class="desc-item"><span class="k">创建时间</span><span class="v">${esc(L.createdAt)}</span></div>
          </div></div>
        </div>

        <div class="card">
          <div class="card-head"><div class="card-title">归属信息<span class="hint">三处归属分开留痕</span></div></div>
          <div class="card-body"><div class="desc g3">
            <div class="desc-item"><span class="k">首次获客代理</span><span class="v">${SRC ? esc(SRC.name) + '（' + SRC.id + '）' : '机构直营'}<div class="small muted">写入后永不覆盖</div></span></div>
            <div class="desc-item"><span class="k">当前维护代理</span><span class="v">${AG ? esc(AG.name) + '（' + AG.id + '）' : '机构直营'}<div class="small muted">可移交，改归属只改这里</div></span></div>
            <div class="desc-item"><span class="k">维护人员</span><span class="v">${esc(L.followerName || '—')}</span></div>
            <div class="desc-item"><span class="k">成交归属</span><span class="v">${dealOrder ? (S.agent(dealOrder.order.agentId) ? esc(S.agent(dealOrder.order.agentId).name) : '机构直营') + '<div class="small muted">订单快照</div>' : '待成交'}</span></div>
          </div></div>
        </div>

        <div class="card" id="follow">
          <div class="card-head"><div class="card-title">跟进时间轴<span class="hint">共 ${VIEW.followUps.length} 次</span></div>
            ${closed ? '' : '<button class="btn btn-sm" onclick="openFollow()">+ 记录跟进</button>'}</div>
          <div class="card-body">
            ${VIEW.followUps.length ? `<div class="timeline">${VIEW.followUps.map((f, i) => `
              <div class="tl-item ${i === 0 ? 'on' : ''}"><div class="tl-head"><b>${esc(f.type)}</b>
                <span class="tl-time">${esc(f.at)} · ${esc(f.by)}</span></div>
                <div class="tl-body">${esc(f.content)}${f.nextAt ? `<div class="box">下次跟进：${esc(f.nextAt)}</div>` : ''}</div></div>`).join('')}</div>`
              : '<div class="empty" style="padding:24px 8px"><p>尚未记录跟进</p><p class="small">至少一条跟进后才能转为意向</p></div>'}
          </div>
        </div>

        <div class="card">
          <div class="card-head"><div class="card-title">关联订单</div></div>
          <div class="card-body ${VIEW.orders.length ? 'tight' : ''}">
            ${VIEW.orders.length ? `<table class="table compact">
              <thead><tr><th>订单</th><th>类型</th><th>套餐</th><th class="right">课时</th><th class="right">金额</th><th>状态</th><th>下单</th></tr></thead>
              <tbody>${VIEW.orders.map(x => { const o = x.order; return `<tr>
                <td class="mono small"><a href="order-detail.html?id=${o.id}">${o.id}</a></td>
                <td class="small">${o.type}</td><td class="small">${esc(o.productName)}</td>
                <td class="right mono">${o.totalHours}</td><td class="right mono">${Proto.money(o.amount)}</td>
                <td><span class="tag tag-${S.ORDER_TONE[o.status] || 'slate'}">${o.status}</span></td>
                <td class="small muted">${esc(o.createdAt)}</td></tr>`; }).join('')}</tbody></table>`
              : '<div class="empty" style="padding:24px 8px"><div class="e-ico">▤</div><p>暂未关联订单</p><p class="small">只有「意向明确」可提交报名订单</p></div>'}
          </div>
        </div>
      </div>

      <div>
        <div class="card">
          <div class="card-head"><div class="card-title">操作日志<span class="hint">只追加</span></div></div>
          <div class="card-body">
            ${VIEW.logs.length ? `<div class="timeline">${VIEW.logs.slice(0, 8).map(l => `
              <div class="tl-item on"><div class="tl-head"><b>${esc(l.action)}</b>
                <span class="tl-time">${esc(l.at)} · ${esc(l.by || '系统')}</span></div>
                <div class="tl-body">${esc(l.detail || '')}${l.from ? `<div class="small muted">${esc(l.from)} → ${esc(l.to)}</div>` : ''}</div></div>`).join('')}</div>`
              : '<div class="small muted">暂无日志</div>'}
          </div>
        </div>

        <div class="card">
          <div class="card-head"><div class="card-title">后续动作</div></div>
          <div class="card-body" style="display:flex;flex-direction:column;gap:8px">
            ${[S.LEAD.TO_CONTACT, S.LEAD.FOLLOWING].indexOf(L.status) >= 0
              ? '<button class="btn btn-primary btn-block" onclick="toIntent()">转为意向明确</button>' : ''}
            ${L.status === S.LEAD.INTENT
              ? '<button class="btn btn-primary btn-block" onclick="openOrder()">提交报名订单</button>' : ''}
            ${closed ? '<div class="small muted">线索已结束，只能查看历史记录。</div>'
              : `<button class="btn btn-block" onclick="openFollow()">记录本次跟进</button>
                 <button class="btn btn-block" onclick="openAssign()">调整归属</button>`}
          </div>
        </div>

        <div class="card">
          <div class="card-head"><div class="card-title">学员与课时</div></div>
          <div class="card-body">
            ${STU ? `<div class="m-row"><span class="k">学员</span><b>${esc(STU.name)}</b></div>
              <div class="m-row"><span class="k">家长</span><span>${VIEW.parent ? esc(VIEW.parent.name) + '（' + VIEW.parent.id + '）' : '—'}</span></div>
              <div class="m-row"><span class="k">当前教师</span><span>${esc(STU.teacherName || '未分配')}</span></div>
              <div class="m-row" style="border-bottom:none"><span class="k">剩余课时</span><b class="mono">${STU.remain}</b></div>`
              : '<div class="small muted">成交并收款后才会创建学员档案与课时账户。</div>'}
          </div>
        </div>

        ${VIEW.disputes && VIEW.disputes.length ? `
        <div class="card">
          <div class="card-head"><div class="card-title">归属争议<span class="hint">待管理员裁定</span></div></div>
          <div class="card-body">
            ${VIEW.disputes.map(x => { const d = x.dispute; return `
              <div class="m-row" style="display:block">
                <div class="flex jcb aic"><b class="mono small">${d.id}</b>
                  <span class="tag tag-amber">${d.status}</span></div>
                <div class="small mt4">申领：${esc(x.claimantAgent ? x.claimantAgent.name + '（' + x.claimantAgent.id + '）' : '—')}
                  · 原归属：${esc(x.originalAgent ? x.originalAgent.name + '（' + x.originalAgent.id + '）' : '机构直营')}</div>
                <div class="small muted mt4">事由：${esc(d.reason)} · ${esc(d.requestedBy)} · ${esc(d.createdAt)}</div>
                ${d.status === S.DISPUTE.OPEN ? `<button class="btn btn-sm mt8" onclick="resolveDispute('${d.id}')">裁定归属</button>` : ''}
              </div>`; }).join('')}
          </div>
        </div>` : ''}

        <div class="alert alert-info mt16"><span class="ico">i</span>
          <div>「已成交」由收款确认自动推进，改状态不产生业绩；课时只能来自订单收款入账或有权限的调整流水。</div></div>
      </div>
    </div>`;

  document.getElementById('f_status').innerHTML = '<option value="">保持当前状态</option>' +
    nexts.map(s => `<option>${s}</option>`).join('');
  document.getElementById('o_product').innerHTML = S.products().filter(p => p.status !== '停用')
    .map(p => `<option value="${p.id}"${p.id === L.intentProductId ? ' selected' : ''}>${p.name} · ${p.hours}课时 · ${Proto.money(p.amount)}</option>`).join('');
  document.getElementById('a_agent').innerHTML = '<option value="">机构直营（无代理）</option>' +
    S.agents().filter(a => a.status === '启用' || a.id === L.currentAgentId)
      .map(a => `<option value="${a.id}"${a.id === L.currentAgentId ? ' selected' : ''}>${a.name}（${a.id}）</option>`).join('');
}

function openFollow() { Proto.openModal('followModal'); }
function saveFollow() {
  try {
    S.addLeadFollowUp(LEAD_ID, {
      type: document.getElementById('f_type').value,
      content: document.getElementById('f_content').value.trim(),
      nextAt: document.getElementById('f_next').value,
      status: document.getElementById('f_status').value
    });
    Proto.closeModal('followModal');
    document.getElementById('f_content').value = '';
    Proto.toast('跟进已记录', 'ok');
    render();
  } catch (e) { Proto.toast(e.message, 'err'); }
}
function toIntent() {
  try { S.markLeadIntent(LEAD_ID, { intent: VIEW.lead.intent }); Proto.toast('已转为意向明确', 'ok'); render(); }
  catch (e) { Proto.toast(e.message, 'err'); }
}
function openOrder() { Proto.openModal('orderModal'); }
function submitOrder() {
  try {
    const o = S.submitEnrollmentOrder({
      leadId: LEAD_ID, productId: document.getElementById('o_product').value,
      agentId: S.leadCurrentAgentId(VIEW.lead) || ''
    });
    Proto.closeModal('orderModal');
    Proto.toast('报名订单 ' + o.order.id + ' 已提交，等待审核收款', 'ok');
    render();
  } catch (e) { Proto.toast(e.message, 'err'); }
}
function openAssign() { Proto.openModal('assignModal'); }
function saveAssign() {
  try {
    S.assignLead(LEAD_ID, {
      agentId: document.getElementById('a_agent').value,
      reason: document.getElementById('a_reason').value.trim()
    });
    Proto.closeModal('assignModal');
    Proto.toast('归属已调整，并写入线索日志', 'ok');
    render();
  } catch (e) { Proto.toast(e.message, 'err'); }
}

function resolveDispute(disputeId) {
  const row = S.leadDisputesOf({ leadId: LEAD_ID }).filter(x => x.dispute.id === disputeId)[0];
  if (!row) return;
  const d = row.dispute;
  const toClaimant = confirm('裁定归属争议 ' + d.id + '\n\n点「确定」判给申领代理：' + d.claimantAgentId +
    '\n点「取消」维持原归属：' + (d.originalAgentId || '机构直营'));
  const result = prompt('请填写裁定结果（会写入线索日志，永久可追溯）',
    toClaimant ? '判给申领代理 ' + (d.claimantAgentId || '') : '维持原归属 ' + (d.originalAgentId || '机构直营'));
  if (!result) return;
  try {
    S.resolveLeadDispute(disputeId, {
      assignToAgentId: toClaimant ? d.claimantAgentId : d.originalAgentId,
      result: result
    });
    Proto.toast('归属争议已裁定，结果已落日志', 'ok');
    render();
  } catch (e) { Proto.toast(e.message, 'err'); }
}

if (IS_NEW || !LEAD_ID) newForm();
else render();
</script>
</body>
</html>
