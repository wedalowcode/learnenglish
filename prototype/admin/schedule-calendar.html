<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课程排课</title>
<link rel="stylesheet" href="../assets/css/common.css">
<style>
  .cal { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:#fff; }
  .cal-head { display:flex; border-bottom:1px solid var(--border); background:#f8fafc; }
  .cal-gutter { width:58px; flex:0 0 58px; border-right:1px solid var(--border); }
  .cal-day-h { flex:1; text-align:center; padding:8px 4px; font-size:12px; color:var(--text-2); border-right:1px solid var(--border); }
  .cal-day-h:last-child { border-right:none; }
  .cal-day-h b { display:block; font-size:13px; color:var(--text); }
  .cal-day-h.today { background:var(--primary-soft); }
  .cal-day-h.today b { color:var(--primary-dark); }
  .cal-day-h span { font-size:11px; color:var(--text-3); }
  .cal-body { display:flex; max-height:620px; overflow-y:auto; }
  .cal-times { width:58px; flex:0 0 58px; border-right:1px solid var(--border); }
  .cal-times div { height:56px; font-size:11px; color:var(--text-3); text-align:right; padding:2px 6px 0 0; }
  .cal-cols { flex:1; display:flex; }
  .cal-col { flex:1; position:relative; border-right:1px solid var(--border);
    background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 55px, #eef2f7 55px, #eef2f7 56px); }
  .cal-col:last-child { border-right:none; }
  .cal-col.today { background-color:#fbfdff; }
  .ev {
    position:absolute; left:3px; right:3px; border-radius:5px; padding:4px 6px;
    font-size:11px; line-height:1.35; cursor:pointer; overflow:hidden;
    border-left:3px solid; background:#fff; box-shadow:0 1px 2px rgba(15,23,42,.08);
  }
  .ev:hover { box-shadow:0 3px 10px rgba(15,23,42,.14); z-index:5; }
  .ev b { display:block; font-size:11.5px; color:var(--text); font-weight:600; }
  .ev .t { color:var(--text-3); font-size:10.5px; }
  .ev.s-done { border-color:#16a34a; background:#f0fdf4; }
  .ev.s-todo { border-color:#2563eb; background:#eff6ff; }
  .ev.s-warn { border-color:#f59e0b; background:#fffbeb; }
  .ev.s-off { border-color:#94a3b8; background:#f8fafc; }
  .month-grid { display:grid; grid-template-columns:repeat(7,1fr); border:1px solid var(--border); border-radius:8px; overflow:hidden; background:#fff; }
  .month-grid .mh { background:#f8fafc; padding:8px; text-align:center; font-size:12px; color:var(--text-2); border-bottom:1px solid var(--border); }
  .month-grid .md { min-height:84px; border-right:1px solid var(--border); border-bottom:1px solid var(--border); padding:6px; font-size:11px; }
  .month-grid .md:nth-child(7n) { border-right:none; }
  .month-grid .md .dnum { color:var(--text-3); font-weight:600; }
  .month-grid .md.today .dnum { color:var(--primary-dark); }
  .month-grid .md.today { background:#fbfdff; }
  .md-ev { display:block; font-size:10.5px; color:var(--text-2); margin-top:3px; padding:1px 4px;
    border-radius:3px; background:var(--primary-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div>
          <div class="crumb">教学管理<span class="sep">/</span>课程排课</div>
          <h1 class="page-title">课程排课</h1>
          <div class="page-sub">本周 11-02 ~ 11-08 · 共 10 节 · 待上课 8 · 已完成 1 · 待处理 1</div>
        </div>
        <div class="page-actions">
          <div class="btn-group">
            <button class="btn on" id="v-week" onclick="setView('week')">周</button>
            <button class="btn" id="v-day" onclick="setView('day')">日</button>
            <button class="btn" id="v-month" onclick="setView('month')">月</button>
          </div>
          <a class="btn" href="course-list.html">课程记录</a>
          <button class="btn btn-primary" onclick="openCreate()">+ 新增课程</button>
        </div>
      </div>

      <div class="card filter mb16">
        <div class="field"><label>教师</label>
          <select class="select" id="f_teacher" onchange="drawCal()">
            <option value="">全部教师</option><option>李婉</option><option>周雅</option><option>何俊</option><option>沈心怡</option>
          </select></div>
        <div class="field"><label>学员</label>
          <select class="select" onchange="drawCal()"><option value="">全部学员</option>
            <option>陈可欣</option><option>付嘉禾</option><option>赵一诺</option><option>林子轩</option><option>孙浩宇</option></select></div>
        <div class="field"><label>课程状态</label>
          <select class="select" id="f_status" onchange="drawCal()">
            <option value="">全部</option><option>待上课</option><option>已开始</option><option>已完成</option>
            <option>已取消</option><option>未上课</option><option>待处理</option>
          </select></div>
        <div class="field"><label>腾讯会议</label>
          <select class="select"><option value="">全部</option><option>已生成</option><option>未生成</option></select></div>
        <div class="filter-actions"><button class="btn" onclick="Proto.toast('已刷新日历','ok')">刷新</button></div>
      </div>

      <div class="flex jcb aic mb12">
        <div class="small muted" id="rangeLabel">2026-11-02（周一）~ 2026-11-08（周日）</div>
        <div class="flex gap8 aic small">
          <span class="tag tag-green nodot">已完成</span>
          <span class="tag tag-blue nodot">待上课</span>
          <span class="tag tag-amber nodot">待处理</span>
          <span class="tag tag-slate nodot">取消 / 未上</span>
        </div>
      </div>

      <div id="weekView">
        <div class="cal">
          <div class="cal-head" id="calHead"></div>
          <div class="cal-body">
            <div class="cal-times" id="calTimes"></div>
            <div class="cal-cols" id="calCols"></div>
          </div>
        </div>
      </div>

      <div id="monthView" class="hidden">
        <div class="month-grid" id="monthGrid"></div>
      </div>

      <div class="alert alert-warn mt16"><span class="ico">!</span>
        <div><b>排课校验：</b>开始时间必须早于结束时间 · 同一教师时间段不可冲突 · 同一学员时间段不可冲突 ·
          教师必须处于可授课状态 · 课程必须关联有效学员。<a href="#" onclick="demoConflict();return false">点此演示冲突拦截 →</a></div>
      </div>

    </main>
  </div>
</div>

<!-- 新增课程 -->
<div class="mask" id="createModal">
  <div class="modal wide">
    <div class="modal-head"><div class="modal-title">新增课程预约</div>
      <button class="modal-close" onclick="Proto.closeModal('createModal')">×</button></div>
    <div class="modal-body">
      <div id="conflictBox"></div>
      <div class="form-grid g3">
        <div class="field"><label>学员 <span class="req">*</span></label>
          <select class="select" id="n_student">
            <option value="">请选择学员</option>
            <option>陈可欣</option><option>付嘉禾</option><option>赵一诺</option>
            <option>林子轩</option><option>孙浩宇</option><option>林雨萱</option>
          </select></div>
        <div class="field"><label>教师 <span class="req">*</span></label>
          <select class="select" id="n_teacher">
            <option value="">请选择教师</option>
            <option>李婉</option><option>周雅</option><option>何俊</option><option>沈心怡</option>
            <option>徐峰（已停用）</option>
          </select></div>
        <div class="field"><label>课程类型</label>
          <select class="select"><option>一对一</option><option>补课</option><option>试听</option></select></div>
        <div class="field"><label>上课日期 <span class="req">*</span></label>
          <input class="input" type="date" id="n_date" value="2026-11-02"></div>
        <div class="field"><label>开始时间 <span class="req">*</span></label>
          <input class="input" type="time" id="n_start" value="09:30"></div>
        <div class="field"><label>结束时间 <span class="req">*</span></label>
          <input class="input" type="time" id="n_end" value="10:30"></div>
        <div class="field full"><label>腾讯会议链接</label>
          <input class="input" placeholder="粘贴会议链接，或留空由系统自动生成">
          <div class="tip">留空将在课程保存后自动创建会议并回填链接</div></div>
        <div class="field full"><label>教学备注</label><textarea class="textarea" placeholder="本节课计划、注意事项"></textarea></div>
        <div class="field"><label class="check"><input type="checkbox"> 通知家长（预留）</label></div>
        <div class="field"><label class="check"><input type="checkbox" checked> 通知教师（预留）</label></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="Proto.closeModal('createModal')">取消</button>
      <button class="btn" onclick="demoConflict()">填入冲突时间试试</button>
      <button class="btn btn-primary" onclick="submitCourse()">保存预约</button>
    </div>
  </div>
</div>

<!-- 课程操作 -->
<div class="mask" id="evModal">
  <div class="modal">
    <div class="modal-head"><div class="modal-title" id="evTitle">课程</div>
      <button class="modal-close" onclick="Proto.closeModal('evModal')">×</button></div>
    <div class="modal-body" id="evBody"></div>
    <div class="modal-foot">
      <button class="btn" onclick="Proto.closeModal('evModal')">关闭</button>
      <a class="btn" href="course-detail.html">课程详情</a>
      <button class="btn btn-danger" onclick="cancelCourse()">取消课程</button>
    </div>
  </div>
</div>

<!-- 改派教师 -->
<div class="mask" id="reassignModal">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">改派授课教师</div>
      <button class="modal-close" onclick="Proto.closeModal('reassignModal')">×</button></div>
    <div class="modal-body">
      <div class="alert alert-info mb16"><span class="ico">i</span>
        <div>只有<b>未完成</b>的课程可以改派；改派会记录原教师、新教师、原因与操作人。</div></div>
      <div class="desc g2 mb16" id="r_info"></div>
      <div class="field mb12"><label>新授课教师 <span class="req">*</span></label>
        <select class="select" id="r_teacher"></select></div>
      <div class="field"><label>改派原因</label>
        <textarea class="textarea" id="r_reason" placeholder="如：原教师临时请假"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="Proto.closeModal('reassignModal')">取消</button>
      <button class="btn btn-primary" onclick="doReassign()">确认改派</button>
    </div>
  </div>
</div>

<script>window.PROTO_ROOT = '../';</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script>
Proto.shell({ role: 'admin', active: 'schedule-calendar' });
Store.setSession({ role: 'admin' });
const S = Store;

/* 教师候选只来自 Store 的可授课资源池：暂停合作与已退出教师不会出现 */
(function initTeacherPool() {
  const all = S.teachers();
  document.getElementById('f_teacher').innerHTML = '<option value="">全部教师</option>' +
    all.map(t => `<option>${t.name}</option>`).join('');
  const pool = S.teacherPool();
  document.getElementById('n_teacher').innerHTML = '<option value="">请选择教师</option>' +
    pool.map(p => `<option>${p.teacher.name}</option>`).join('');
})();

const DAYS = ['2026-11-02', '2026-11-03', '2026-11-04', '2026-11-05', '2026-11-06', '2026-11-07', '2026-11-08'];
const WEEKS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
const START_H = 9, END_H = 21, ROW_H = 56;
let view = 'week';
let currentEv = null;

const sCls = s => ({ '已完成': 's-done', '待上课': 's-todo', '已开始': 's-todo', '待处理': 's-warn',
  '已取消': 's-off', '未上课': 's-off' })[s] || 's-todo';

function filtered() {
  const t = document.getElementById('f_teacher').value;
  const s = document.getElementById('f_status').value;
  return S.courses().filter(c => {
    if (t && c.teacher !== t) return false;
    if (s && c.status !== s) return false;
    return true;
  });
}

function drawCal() {
  if (view === 'month') { drawMonth(); return; }
  const days = view === 'week' ? DAYS : ['2026-11-02'];
  const labels = view === 'week' ? WEEKS : ['周一'];

  document.getElementById('calHead').innerHTML =
    `<div class="cal-gutter"></div>` +
    days.map((d, i) => `<div class="cal-day-h ${d === DB.today ? 'today' : ''}">
      <b>${labels[i]}</b><span>${d.slice(5)}</span></div>`).join('');

  document.getElementById('calTimes').innerHTML =
    Array.from({ length: END_H - START_H }, (_, i) => `<div>${String(START_H + i).padStart(2, '0')}:00</div>`).join('');

  const list = filtered();
  document.getElementById('calCols').innerHTML = days.map(d => {
    const evs = list.filter(c => c.date === d).sort((a, b) => a.start.localeCompare(b.start));
    return `<div class="cal-col ${d === DB.today ? 'today' : ''}">
      ${evs.map(c => {
        const [sh, sm] = c.start.split(':').map(Number);
        const [eh, em] = c.end.split(':').map(Number);
        const top = (sh - START_H) * ROW_H + (sm / 60) * ROW_H;
        const h = ((eh * 60 + em) - (sh * 60 + sm)) / 60 * ROW_H - 3;
        return `<div class="ev ${sCls(c.status)}" style="top:${top}px;height:${Math.max(28, h)}px"
          onclick='openEv(${JSON.stringify(c).replace(/'/g, "&#39;")})'>
          <b>${c.student}</b>
          <span class="t">${c.start}-${c.end} · ${c.teacher}</span>
          <span class="t">${c.status}${c.deduct === '扣课异常' ? ' · 扣课异常' : ''}</span>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');

  const total = list.filter(c => DAYS.includes(c.date)).length;
  document.getElementById('rangeLabel').textContent =
    view === 'week' ? `2026-11-02（周一）~ 2026-11-08（周日）· 本周 ${total} 节` : '2026-11-02（周一）· 今日 ' + total + ' 节';
}

function drawMonth() {
  const list = filtered();
  let html = WEEKS.map(w => `<div class="mh">${w}</div>`).join('');
  // 2026-11-01 是周日，从周一列开始需前置 0 空格（11-02 为周一）
  html += '<div class="md" style="background:#fafbfc"></div>';
  for (let d = 1; d <= 30; d++) {
    const date = '2026-11-' + String(d).padStart(2, '0');
    const evs = list.filter(c => c.date === date);
    html += `<div class="md ${d === 2 ? 'today' : ''}">
      <div class="dnum">${d}</div>
      ${evs.slice(0, 3).map(c => `<span class="md-ev">${c.start} ${c.student}</span>`).join('')}
      ${evs.length > 3 ? `<span class="md-ev" style="background:#f1f5f9">+${evs.length - 3} 节</span>` : ''}
    </div>`;
  }
  document.getElementById('monthGrid').innerHTML = html;
}

function setView(v) {
  view = v;
  ['week', 'day', 'month'].forEach(k => document.getElementById('v-' + k).classList.toggle('on', k === v));
  document.getElementById('weekView').classList.toggle('hidden', v === 'month');
  document.getElementById('monthView').classList.toggle('hidden', v !== 'month');
  drawCal();
}

function openCreate() {
  document.getElementById('conflictBox').innerHTML = '';
  Proto.openModal('createModal');
}

/* ---------- 核心：冲突校验 ---------- */
function toMin(t) { const [h, m] = t.split(':').map(Number); return h * 60 + m; }

function checkConflict(student, teacher, date, start, end) {
  const errs = [];
  if (toMin(start) >= toMin(end)) {
    errs.push({ type: 'danger', text: '开始时间必须早于结束时间。' });
    return errs;
  }
  if (teacher.startsWith('徐峰')) {
    errs.push({ type: 'danger', text: '教师「徐峰」处于<b>暂停合作</b>状态，不可排课。请选择可授课教师。' });
    return errs;
  }
  /* 教师候选池只给可授课教师；这里再兜一层，防止直接改 DOM 绕过 */
  const tObj = S.teachers().filter(t => t.name === teacher)[0];
  if (!tObj) {
    errs.push({ type: 'danger', text: `教师「${teacher}」不存在或已离职。` });
    return errs;
  }
  if (tObj.cooperationStatus !== S.COOP.READY) {
    errs.push({ type: 'danger', text: `教师「${teacher}」当前为<b>${tObj.cooperationStatus}</b>状态，不可创建有效排课。` });
    return errs;
  }
  const s1 = toMin(start), e1 = toMin(end);
  S.courses().forEach(c => {
    if (c.date !== date || c.status === '已取消') return;
    const s2 = toMin(c.start), e2 = toMin(c.end);
    const overlap = s1 < e2 && s2 < e1;
    if (!overlap) return;
    if (c.teacher === teacher) {
      errs.push({ type: 'danger',
        text: `教师时间冲突：<b>${teacher}</b> 在 ${c.start}-${c.end} 已安排课程 <b>${c.id}</b>（学员 ${c.student}）。` });
    }
    if (c.student === student) {
      errs.push({ type: 'danger',
        text: `学员时间冲突：<b>${student}</b> 在 ${c.start}-${c.end} 已有课程 <b>${c.id}</b>（教师 ${c.teacher}）。` });
    }
  });
  return errs;
}

function submitCourse() {
  const student = document.getElementById('n_student').value;
  const teacher = document.getElementById('n_teacher').value;
  const date = document.getElementById('n_date').value;
  const start = document.getElementById('n_start').value;
  const end = document.getElementById('n_end').value;

  if (!student || !teacher || !date || !start || !end) {
    Proto.toast('请补全学员、教师、日期与时间', 'err');
    return;
  }
  const errs = checkConflict(student, teacher, date, start, end);
  const box = document.getElementById('conflictBox');

  if (errs.length) {
    box.innerHTML = errs.map(e => `<div class="alert alert-${e.type} mb12"><span class="ico">!</span><div>${e.text}</div></div>`).join('');
    Proto.toast('排课校验未通过，已拦截', 'err');
    return;
  }
  box.innerHTML = `<div class="alert alert-success mb12"><span class="ico">✓</span>
    <div>校验通过：教师与学员时段均无冲突，正在保存预约。</div></div>`;
  Proto.toast('课程已创建，会议链接将自动生成', 'ok');
  setTimeout(() => Proto.closeModal('createModal'), 700);
}

function demoConflict() {
  Proto.openModal('createModal');
  document.getElementById('n_student').value = '陈可欣';
  document.getElementById('n_teacher').value = '李婉';
  document.getElementById('n_date').value = '2026-11-02';
  document.getElementById('n_start').value = '09:30';
  document.getElementById('n_end').value = '10:30';
  document.getElementById('conflictBox').innerHTML = '';
  setTimeout(submitCourse, 300);
}

function openEv(c) {
  currentEv = c;
  document.getElementById('evTitle').textContent = `${c.student} · ${c.start}-${c.end}`;
  document.getElementById('evBody').innerHTML = `
    <div class="desc g2 mb16">
      <div class="desc-item"><span class="k">课程编号</span><span class="v mono">${c.id}</span></div>
      <div class="desc-item"><span class="k">课程状态</span><span class="v"><span class="tag tag-blue">${c.status}</span></span></div>
      <div class="desc-item"><span class="k">学员</span><span class="v">${c.student}</span></div>
      <div class="desc-item"><span class="k">教师</span><span class="v">${c.teacher}</span></div>
      <div class="desc-item"><span class="k">日期</span><span class="v">${c.date}</span></div>
      <div class="desc-item"><span class="k">时间</span><span class="v mono">${c.start}-${c.end}</span></div>
      <div class="desc-item"><span class="k">腾讯会议</span><span class="v">${c.meeting}</span></div>
      <div class="desc-item"><span class="k">扣课状态</span><span class="v">${c.deduct}</span></div>
    </div>
    ${c.note ? `<div class="alert alert-info"><span class="ico">i</span><div>${c.note}</div></div>` : ''}
    <div class="mt16 flex gap8">
      <button class="btn btn-sm" onclick="Proto.toast('打开调整时间（示意）')">调整时间</button>
      <button class="btn btn-sm" onclick="openReassign()">调整教师</button>
      <button class="btn btn-sm" onclick="Proto.toast('已复制会议链接','ok')">复制会议链接</button>
    </div>`;
  Proto.openModal('evModal');
}

function cancelCourse() {
  Proto.closeModal('evModal');
  Proto.confirmBox('取消课程',
    `确认取消 <b>${currentEv ? currentEv.student : ''}</b> 的课程吗？<br><br>
     · 取消课程<b>不扣课时</b><br>
     · 已扣课的需通过「扣课冲正」流水修复，原流水保留<br>
     · 家长端与教师端将同步更新`, '确认取消',
    () => {
      try {
        S.cancelCourse(currentEv.id, '教务在排课页手动取消');
        Proto.toast('课程已取消，未扣课', 'ok');
        drawCal();
      } catch (e) { Proto.toast(e.message, 'err'); }
    });
}

function openReassign() {
  const c = currentEv;
  if (!c) return;
  document.getElementById('r_info').innerHTML = `
    <div class="desc-item"><span class="k">课程</span><span class="v mono">${c.id}</span></div>
    <div class="desc-item"><span class="k">时间</span><span class="v">${c.date} ${c.start}-${c.end}</span></div>
    <div class="desc-item"><span class="k">学员</span><span class="v">${c.student}</span></div>
    <div class="desc-item"><span class="k">当前教师</span><span class="v">${c.teacher}</span></div>`;
  const pool = S.teacherPool();
  document.getElementById('r_teacher').innerHTML = '<option value="">请选择教师</option>' +
    pool.filter(p => p.teacher.id !== c.teacherId)
      .map(p => `<option value="${p.teacher.id}">${p.teacher.name}（当前 ${p.stat.currentStudents} 人）</option>`).join('');
  document.getElementById('r_reason').value = '';
  Proto.openModal('reassignModal');
}

function doReassign() {
  const tid = document.getElementById('r_teacher').value;
  if (!tid) { Proto.toast('请选择接替教师', 'err'); return; }
  try {
    S.reassignCourse(currentEv.id, tid, { reason: document.getElementById('r_reason').value.trim() });
    Proto.closeModal('reassignModal');
    Proto.toast('课程已改派，操作已留痕', 'ok');
    drawCal();
  } catch (e) { Proto.toast(e.message, 'err'); }
}

drawCal();
</script>
</body>
</html>
